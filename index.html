    g.fillStyle = '#ffcf33';
    g.font = 'bold 76px "Arial Black", Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('START / FINISH', w / 2, h / 2 + 4);
  });
  const checkerMat = new THREE.MeshBasicMaterial({ map: checkerTex, toneMapped: false });
  const slotMat = new THREE.MeshBasicMaterial({ color: 0xf5f5f5 });
  const postMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, emissive: 0x222233, metalness: 0.8, roughness: 0.25 });
  const archEdgeMat = new THREE.MeshStandardMaterial({ color: 0x16213e, metalness: 0.6, roughness: 0.4 });
  const archFaceMat = new THREE.MeshBasicMaterial({ map: bannerTex });

  function buildStartFinish() {
    const group = new THREE.Group();
    group.position.copy(samples[0]);
    frameQuaternion(0, group.quaternion);
    const y0 = samples[0].y;
    const lineGeo = new THREE.PlaneGeometry(TRACK_WIDTH, 2.4);
    lineGeo.rotateX(-Math.PI / 2);
    const line = new THREE.Mesh(lineGeo, checkerMat);
    line.position.y = 0.05;
    group.add(line);
    const slotGeo = new THREE.PlaneGeometry(4, 0.35);
    slotGeo.rotateX(-Math.PI / 2);
    for (let r = 1; r <= 4; r++) {
      for (const sx of [-3.5, 3.5]) {
        const slot = new THREE.Mesh(slotGeo, slotMat);
        slot.position.set(sx, 0.05, -r * 7 + (sx > 0 ? 3.5 : 0));
        group.add(slot);
      }
    }
    const postH = 9 + y0 + 1;
    const postGeo = new THREE.BoxGeometry(0.9, postH, 0.9);
    for (const sx of [-1, 1]) {
      const post = new THREE.Mesh(postGeo, postMat);
      post.position.set(sx * (HALF + 1.6), 9 - postH / 2, 0);
      post.castShadow = true;
      group.add(post);
    }
    const banner = new THREE.Mesh(new THREE.BoxGeometry(TRACK_WIDTH + 4.6, 2.6, 0.6),
      [archEdgeMat, archEdgeMat, archEdgeMat, archEdgeMat, archFaceMat, archFaceMat]);
    banner.position.y = 9.2;
    banner.castShadow = true;
    group.add(banner);
    trackGroup.add(group);
  }

  /* Debug view of the checkpoint gates (G) */
  const gateGroup = new THREE.Group();
  gateGroup.visible = false;
  scene.add(gateGroup);
  const gateDebugMat = new THREE.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false });
  function buildGateDebug() {
    disposeGroup(gateGroup);
    const geo = new THREE.PlaneGeometry(GATE_HALF * 2, 7);
    for (const G of gates) {
      const m = new THREE.Mesh(geo, gateDebugMat);
      m.position.copy(samples[G.i]).addScaledVector(frameU[G.i], 3.5);
      frameQuaternion(G.i, m.quaternion);
      gateGroup.add(m);
    }
  }

  /* Scenery: instanced glowing crystal asteroids (space theme only) */
  function mulberry32(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const crystalGroup = new THREE.Group();
  scene.add(crystalGroup);
  const crystalGeo = new THREE.OctahedronGeometry(1, 0).translate(0, 1, 0);
  const crystalMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x2a0f55, flatShading: true, metalness: 0.3, roughness: 0.15 });
  function buildCrystals(show) {
    while (crystalGroup.children.length) crystalGroup.remove(crystalGroup.children[0]);
    if (!show) return;
    const COUNT = 160;
    const rand = mulberry32(1337);
    const inst = new THREE.InstancedMesh(crystalGeo, crystalMat, COUNT);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
    const minD2 = (HALF + 12) ** 2;
    const palette = [0x29f0ff, 0xff3df2, 0x9d6bff, 0x5b8cff];
    const col = new THREE.Color();
    let placed = 0, tries = 0;
    while (placed < COUNT && tries < 8000) {
      tries++;
      const x = (rand() - 0.5) * 900, z = (rand() - 0.5) * 760;
      let ok = true;
      for (let i = 0; i < N; i += 2) {
        const dx = samples[i].x - x, dz = samples[i].z - z;
        if (dx * dx + dz * dz < minD2) { ok = false; break; }
      }
      if (!ok) continue;
      const k = 3 + rand() * 4;
      p.set(x, -140 + rand() * 300, z);
      s.set(k, k * (2.5 + rand() * 3), k);
      q.setFromAxisAngle(WORLD_UP, rand() * TAU);
      m.compose(p, q, s);
      inst.setMatrixAt(placed, m);
      inst.setColorAt(placed, col.setHex(palette[Math.floor(rand() * palette.length)]));
      placed++;
    }
    inst.count = placed;
    crystalGroup.add(inst);
  }

  /* Theme scenery: lava sea (Magma Keep) and a solid neon grid floor (Neon Plains) */
  const LAVA_Y = -45;
  const lavaTex = (function () {
    const t = makeCanvasTexture(256, 256, (g, w, h) => {
      g.fillStyle = '#3a0602'; g.fillRect(0, 0, w, h);
      const rnd01 = mulberry32(7);
      for (let k = 0; k < 90; k++) {
        const x = rnd01() * w, y = rnd01() * h, r = 6 + rnd01() * 26;
        g.fillStyle = k % 3 ? 'rgba(255,90,20,0.35)' : 'rgba(255,200,60,0.45)';
        g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      }
    });
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(40, 40);
    return t;
  })();
  const lava = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: lavaTex, toneMapped: false }));
  lava.position.y = LAVA_Y;
  lava.visible = false;
  scene.add(lava);
  const neonGridTex = (function () {
    const t = makeCanvasTexture(512, 512, (g) => {
      g.fillStyle = '#05150a'; g.fillRect(0, 0, 512, 512);
      g.fillStyle = 'rgba(57,255,20,0.35)';
      for (let k = 1; k < 4; k++) { g.fillRect(k * 128 - 1, 0, 2, 512); g.fillRect(0, k * 128 - 1, 512, 2); }
      g.fillStyle = 'rgba(57,255,20,0.3)';
      g.fillRect(0, 0, 10, 512); g.fillRect(502, 0, 10, 512); g.fillRect(0, 0, 512, 10); g.fillRect(0, 502, 512, 10);
      g.fillStyle = '#39ff14';
      g.fillRect(0, 0, 3, 512); g.fillRect(509, 0, 3, 512); g.fillRect(0, 0, 512, 3); g.fillRect(0, 509, 512, 3);
    });
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(100, 100);
    return t;
  })();
  const neonFloor = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: neonGridTex, toneMapped: false }));
  neonFloor.visible = false;
  scene.add(neonFloor);

  /* =====================================================================
     PLAYER KART — composite procedural model
     ===================================================================== */
  /* Liveries: the player is red; the AI presets are ready for rival karts */
  const KART_LIVERIES = {
    // Every kart is unlit (MeshBasicMaterial): flat, full-strength colour plus a black outline
    player: { paint: 0xffffff, metal: 0xd9dde5, tyre: 0x111111, suit: 0x1d3557, helmet: 0x00e5ff, glow: 0x00ffff },
    ai: [
      { paint: 0xffff00, metal: 0xd9dde5, tyre: 0x111111, suit: 0x222222, helmet: 0xffff00, glow: 0xffff00 },
      { paint: 0xff00ff, metal: 0xd9dde5, tyre: 0x111111, suit: 0x222222, helmet: 0xff00ff, glow: 0xff00ff },
      { paint: 0x00ffff, metal: 0xd9dde5, tyre: 0x111111, suit: 0x222222, helmet: 0x00ffff, glow: 0x00ffff }
    ]
  };

  /* Black silhouette outlines (inverted hull): each baked kart mesh gets a back-face shell pushed out
     along smoothed normals, so karts read sharply against the bright road */
  const OUTLINE_VERT = `
    attribute vec3 outlineNormal;
    uniform float uThickness;
    void main() {
      vec3 p = position + outlineNormal * uThickness;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`;
  const OUTLINE_FRAG = `
    void main() {
      gl_FragColor = vec4(0.015, 0.01, 0.03, 1.0);
    }`;
  const outlineMats = {};
  function outlineMaterial(thickness) {
    if (!outlineMats[thickness]) {
      outlineMats[thickness] = new THREE.ShaderMaterial({
        uniforms: { uThickness: { value: thickness } }, vertexShader: OUTLINE_VERT, fragmentShader: OUTLINE_FRAG, side: THREE.BackSide
      });
    }
    return outlineMats[thickness];
  }
  // Average the normals of vertices that share a position so hard edges don't split the shell
  function smoothedNormals(geo) {
    const pos = geo.attributes.position, nor = geo.attributes.normal, n = pos.count;
    const sums = new Map(), keys = new Array(n), out = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const k = Math.round(pos.getX(i) * 1000) + ',' + Math.round(pos.getY(i) * 1000) + ',' + Math.round(pos.getZ(i) * 1000);
      keys[i] = k;
      let acc = sums.get(k);
      if (!acc) sums.set(k, (acc = [0, 0, 0]));
      acc[0] += nor.getX(i); acc[1] += nor.getY(i); acc[2] += nor.getZ(i);
    }
    for (let i = 0; i < n; i++) {
      const acc = sums.get(keys[i]);
      const l = Math.hypot(acc[0], acc[1], acc[2]) || 1;
      out[i * 3] = acc[0] / l; out[i * 3 + 1] = acc[1] / l; out[i * 3 + 2] = acc[2] / l;
    }
    return new THREE.BufferAttribute(out, 3);
  }
  function addOutlines(group, thickness) {
    const targets = group.children.filter(o => o.isMesh && !o.material.transparent && !o.material.isShaderMaterial);
    for (const m of targets) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', m.geometry.attributes.position);
      g.setAttribute('outlineNormal', smoothedNormals(m.geometry));
      g.boundingSphere = m.geometry.boundingSphere;
      const hull = new THREE.Mesh(g, outlineMaterial(thickness));
      hull.position.copy(m.position);
      hull.quaternion.copy(m.quaternion);
      hull.scale.copy(m.scale);
      group.add(hull);
    }
  }

  /* Bake every static part under `root` into one mesh per material (≈190 parts → ~10 draw calls).
     Anything inside `skip` (moving or toggled parts) is left untouched. */
  const _mInv = new THREE.Matrix4(), _mRel = new THREE.Matrix4();
  function mergeStatic(root, skip) {
    root.updateMatrixWorld(true);
    _mInv.copy(root.matrixWorld).invert();
    const buckets = new Map(), victims = [];
    root.traverse(o => {
      if (!o.isMesh || o === root) return;
      for (let q = o; q && q !== root; q = q.parent) if (skip.has(q)) return;
      const key = o.material.uuid + (o.castShadow ? '|s' : '|n');
      if (!buckets.has(key)) buckets.set(key, { mat: o.material, shadow: o.castShadow, geos: [] });
      const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
      g.applyMatrix4(_mRel.multiplyMatrices(_mInv, o.matrixWorld));
      buckets.get(key).geos.push(g);
      victims.push(o);
    });
    for (const v of victims) if (v.parent) v.parent.remove(v);
    for (const { mat, shadow, geos } of buckets.values()) {
      let total = 0;
      for (const g of geos) total += g.attributes.position.count;
      const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uv = new Float32Array(total * 2);
      let at = 0;
      for (const g of geos) {
        pos.set(g.attributes.position.array, at * 3);
        nor.set(g.attributes.normal.array, at * 3);
        if (g.attributes.uv) uv.set(g.attributes.uv.array, at * 2);
        at += g.attributes.position.count;
        g.dispose();
      }
      const merged = new THREE.BufferGeometry();
      merged.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      for (let i = 0; i < nor.length; i += 3) {       // zero/NaN normals from degenerate triangles poison lighting
        const l = Math.hypot(nor[i], nor[i + 1], nor[i + 2]);
        if (!(l > 1e-6)) { nor[i] = 0; nor[i + 1] = 1; nor[i + 2] = 0; }
      }
      merged.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      merged.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      merged.computeBoundingSphere();
      const m = new THREE.Mesh(merged, mat);
      m.castShadow = m.receiveShadow = shadow;
      root.add(m);
    }
  }

  /* Classic open-wheel go-kart, built from primitives.
     Returned handles: root → model (drift yaw / spin / hop) → body (lean) + wheel pivots. */
  function buildKart(livery = KART_LIVERIES.player, withDriver = true) {
    const root = new THREE.Group();
    const model = new THREE.Group();
    const body = new THREE.Group();
    root.add(model);
    model.add(body);

    // Unlit materials: body parts in the livery colour, mechanical parts a light metal grey, wheels near-black
    const unlit = (color, extra) => new THREE.MeshBasicMaterial(Object.assign({ color, toneMapped: false }, extra));
    const paintMat = livery.paintMap ? unlit(0xffffff, { map: livery.paintMap }) : unlit(livery.paint);
    const accentMat = unlit(livery.paint);
    const floorMat = unlit(livery.paint);
    const silverMat = unlit(livery.metal);
    const chromeMat = unlit(livery.metal);
    const rubberMat = unlit(livery.tyre);
    const hubMat = unlit(0x3a3a40);
    const seatMat = unlit(livery.paint, { side: THREE.DoubleSide });
    const lampMat = new THREE.MeshBasicMaterial({ color: 0xfff6e0 });
    const tailMat = new THREE.MeshBasicMaterial({ color: 0xff2a55 });

    const UPV = new THREE.Vector3(0, 1, 0);
    const mesh = (geo, mat, parent, x = 0, y = 0, z = 0, shadow = true) => {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = shadow;
      m.receiveShadow = shadow;
      parent.add(m);
      return m;
    };
    // A straight tube between two points, plus rounded joints at both ends
    const tube = (parent, mat, a, b, r = 0.045, joints = true) => {
      const A = new THREE.Vector3(a[0], a[1], a[2]), B = new THREE.Vector3(b[0], b[1], b[2]);
      const dir = B.clone().sub(A);
      const len = dir.length();
      const m = mesh(new THREE.CylinderGeometry(r, r, len, 12), mat, parent);
      m.position.copy(A).addScaledVector(dir, 0.5);
      m.quaternion.setFromUnitVectors(UPV, dir.normalize());
      if (joints) {
        const jg = new THREE.SphereGeometry(r * 1.2, 10, 8);
        mesh(jg, mat, parent, A.x, A.y, A.z);
        mesh(jg, mat, parent, B.x, B.y, B.z);
      }
      return m;
    };
    const roundedRect = (w, h, r) => {
      const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
      return s;
    };
    const mirror = fn => { fn(-1); fn(1); };

    /* --- 1. Chassis --- */
    // Low carbon floorboard
    const floorGeo = new THREE.ExtrudeGeometry(roundedRect(1.45, 3.1, 0.3), { depth: 0.05, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2, curveSegments: 6 });
    floorGeo.rotateX(-Math.PI / 2);
    mesh(floorGeo, floorMat, body, 0, 0.22, 0.15);

    // Main perimeter rails
    mirror(sx => {
      tube(body, paintMat, [sx * 0.75, 0.3, -1.4], [sx * 0.75, 0.3, 1.2]);
      tube(body, paintMat, [sx * 0.75, 0.3, 1.2], [sx * 0.45, 0.32, 1.75]);
    });
    tube(body, paintMat, [-0.45, 0.32, 1.75], [0.45, 0.32, 1.75], 0.045, false);
    tube(body, paintMat, [-0.75, 0.3, -1.4], [0.75, 0.3, -1.4], 0.045, false);
    tube(body, paintMat, [-0.75, 0.3, -0.2], [0.75, 0.3, -0.2], 0.04, false);
    tube(body, paintMat, [-0.75, 0.3, 0.65], [0.75, 0.3, 0.65], 0.04, false);

    // Front bumper protection bar
    tube(body, paintMat, [-0.55, 0.3, 2.05], [0.55, 0.3, 2.05], 0.04, false);
    tube(body, paintMat, [-0.42, 0.5, 2.1], [0.42, 0.5, 2.1], 0.04, false);
    mirror(sx => {
      tube(body, paintMat, [sx * 0.45, 0.32, 1.75], [sx * 0.55, 0.3, 2.05], 0.04);
      tube(body, paintMat, [sx * 0.55, 0.3, 2.05], [sx * 0.42, 0.5, 2.1], 0.04);
      tube(body, paintMat, [sx * 0.2, 0.32, 1.75], [sx * 0.2, 0.5, 2.1], 0.03);
    });

    // Side pods: nerf-bar tubes wrapped around a moulded panel
    mirror(sx => {
      tube(body, paintMat, [sx * 1.12, 0.34, -0.8], [sx * 1.12, 0.34, 0.8], 0.04);
      tube(body, paintMat, [sx * 0.75, 0.3, -0.9], [sx * 1.12, 0.34, -0.8], 0.035);
      tube(body, paintMat, [sx * 0.75, 0.3, 0.9], [sx * 1.12, 0.34, 0.8], 0.035);
      tube(body, paintMat, [sx * 1.05, 0.52, -0.6], [sx * 1.05, 0.52, 0.6], 0.035);
      tube(body, paintMat, [sx * 1.12, 0.34, -0.7], [sx * 1.05, 0.52, -0.6], 0.03);
      tube(body, paintMat, [sx * 1.12, 0.34, 0.7], [sx * 1.05, 0.52, 0.6], 0.03);
      const pod = mesh(new THREE.ExtrudeGeometry(roundedRect(1.3, 0.2, 0.08), { depth: 0.04, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 2, curveSegments: 4 }),
        accentMat, body, sx * 0.97, 0.42, 0);
      pod.rotation.order = 'ZYX';
      pod.rotation.set(0, sx * Math.PI / 2, -sx * 0.22);                              // lean the panel outward
    });

    // Rear bumper
    tube(body, paintMat, [-0.95, 0.36, -1.85], [0.95, 0.36, -1.85], 0.04, false);
    mirror(sx => tube(body, paintMat, [sx * 0.75, 0.3, -1.4], [sx * 0.95, 0.36, -1.85], 0.035));

    // Nose fairing
    const nose = new THREE.Shape([new THREE.Vector2(-0.5, 0), new THREE.Vector2(0.5, 0), new THREE.Vector2(0.36, 0.42), new THREE.Vector2(-0.36, 0.42)]);
    const noseGeo = new THREE.ExtrudeGeometry(nose, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 2 });
    noseGeo.rotateX(Math.PI / 2);                         // shape y → forward, thickness → down
    const noseMesh = mesh(noseGeo, paintMat, body, 0, 0.52, 1.55);
    noseMesh.rotation.x = 0.32;

    /* --- 2. Axles (the wheels sit outside the frame) --- */
    tube(body, chromeMat, [-1.2, 0.32, -1.25], [1.2, 0.32, -1.25], 0.035, false);
    mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.03, 20).rotateZ(Math.PI / 2), silverMat, body, -0.45, 0.32, -1.25);   // sprocket
    mirror(sx => {
      tube(body, chromeMat, [sx * 0.75, 0.3, 1.25], [sx * 1.02, 0.3, 1.25], 0.03, false);                           // spindle arm
      mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.22, 10), chromeMat, body, sx * 1.02, 0.3, 1.25);                // kingpin
      tube(body, chromeMat, [0, 0.3, 1.0], [sx * 0.98, 0.3, 1.12], 0.015, false);                                    // tie rod
    });

    /* --- Engine block & exhaust (right-rear, like a real kart) --- */
    mesh(new THREE.BoxGeometry(0.42, 0.36, 0.45), silverMat, body, 0.5, 0.55, -1.0);
    const head = mesh(new THREE.CylinderGeometry(0.15, 0.17, 0.28, 18), silverMat, body, 0.52, 0.86, -1.0);
    head.rotation.z = -0.22;
    const finGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.018, 18);
    for (let k = 0; k < 5; k++) mesh(finGeo, chromeMat, head, 0, -0.1 + k * 0.05, 0);
    mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 8), tailMat, head, 0, 0.18, 0, false);                        // plug cap
    const filter = mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.2, 18), floorMat, body, 0.52, 0.52, -0.66);         // air filter
    filter.rotation.x = Math.PI / 2;
    const exhaustTips = [];
    for (const px of [0.4, 0.58]) {
      tube(body, chromeMat, [px, 0.55, -1.2], [px, 0.62, -1.5], 0.05);
      tube(body, chromeMat, [px, 0.62, -1.5], [px, 0.62, -1.88], 0.055, false);
      const flare = mesh(new THREE.CylinderGeometry(0.075, 0.06, 0.1, 14), chromeMat, body, px, 0.62, -1.92);
      flare.rotation.x = Math.PI / 2;
      const tip = new THREE.Object3D();
      tip.position.set(px, 0.62, -1.98);
      body.add(tip);
      exhaustTips.push(tip);
    }
    mirror(sx => mesh(new THREE.BoxGeometry(0.22, 0.07, 0.03), tailMat, body, sx * 0.62, 0.42, -1.9, false));

    /* --- Fuel tank, pedals, headlamps --- */
    const tank = mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.32, 16), accentMat, body, 0, 0.42, 1.38);
    tank.rotation.z = Math.PI / 2;
    mirror(sx => {
      const pedal = mesh(new THREE.BoxGeometry(0.1, 0.16, 0.03), silverMat, body, sx * 0.14, 0.36, 1.12);
      pedal.rotation.x = -0.5;
      const pod = mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.09, 14), floorMat, body, sx * 0.28, 0.5, 2.15);
      pod.rotation.x = Math.PI / 2;
      mesh(new THREE.CircleGeometry(0.06, 14), lampMat, body, sx * 0.28, 0.5, 2.2, false);
    });

    /* --- 3. Driver area: bucket seat + steering column --- */
    const seat = new THREE.Group();
    seat.position.set(0, 0.3, -0.5);
    body.add(seat);
    const shell = mesh(new THREE.CylinderGeometry(0.31, 0.27, 0.82, 24, 1, true, Math.PI / 2, Math.PI), seatMat, seat, 0, 0.45, -0.12);
    shell.rotation.x = -0.28;
    mesh(new THREE.ExtrudeGeometry(roundedRect(0.54, 0.5, 0.12), { depth: 0.08, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 2, curveSegments: 5 }).rotateX(-Math.PI / 2),
      seatMat, seat, 0, 0.02, 0.08);
    const headrest = mesh(new THREE.ExtrudeGeometry(roundedRect(0.34, 0.2, 0.08), { depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2, curveSegments: 5 }),
      paintMat, seat, 0, 0.84, -0.36);
    headrest.rotation.x = -0.28;
    mirror(sx => tube(seat, chromeMat, [sx * 0.2, 0.0, -0.1], [sx * 0.22, 0.55, -0.3], 0.018, false));            // seat stays

    // Steering column (angled) with a small black hoop that turns with your steering input
    const colBase = new THREE.Vector3(0, 0.3, 1.0), colTop = new THREE.Vector3(0, 0.74, 0.42);
    tube(body, chromeMat, colBase.toArray(), colTop.toArray(), 0.025, false);
    const wheelMount = new THREE.Group();
    wheelMount.position.copy(colTop);
    wheelMount.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), colTop.clone().sub(colBase).normalize().negate());
    body.add(wheelMount);
    const steeringWheel = new THREE.Group();
    wheelMount.add(steeringWheel);
    mesh(new THREE.TorusGeometry(0.16, 0.022, 8, 30), rubberMat, steeringWheel);
    mesh(new THREE.BoxGeometry(0.3, 0.025, 0.02), floorMat, steeringWheel);
    mesh(new THREE.BoxGeometry(0.025, 0.16, 0.02), floorMat, steeringWheel, 0, -0.08, 0);
    mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.05, 14).rotateX(Math.PI / 2), accentMat, steeringWheel);

    /* --- Driver (optional) --- */
    if (withDriver) {
      const suitMat = unlit(livery.suit);
      const helmetMat = unlit(livery.helmet);
      const visorMat = unlit(0x0a2030);
      const torso = mesh(new THREE.CylinderGeometry(0.19, 0.23, 0.5, 16), suitMat, body, 0, 0.78, -0.5);
      torso.rotation.x = -0.25;
      mesh(new THREE.SphereGeometry(0.21, 16, 12), suitMat, body, 0, 1.0, -0.56);
      mesh(new THREE.SphereGeometry(0.2, 24, 18), helmetMat, body, 0, 1.2, -0.56);
      mesh(new THREE.SphereGeometry(0.205, 24, 10, Math.PI / 2 - 0.9, 1.8, 1.2, 0.5), visorMat, body, 0, 1.2, -0.56);
      mirror(sx => {
        tube(body, suitMat, [sx * 0.22, 0.98, -0.52], [sx * 0.2, 0.8, -0.05], 0.055);
        tube(body, suitMat, [sx * 0.2, 0.8, -0.05], [sx * 0.13, 0.76, 0.36], 0.05);
        tube(body, suitMat, [sx * 0.12, 0.5, -0.3], [sx * 0.15, 0.6, 0.4], 0.07);
        tube(body, suitMat, [sx * 0.15, 0.6, 0.4], [sx * 0.14, 0.4, 1.02], 0.06);
      });
    }

    /* --- Underglow: additive disc plus a low PointLight that pools colour on the road below --- */
    const glowGeo = new THREE.CircleGeometry(1.9, 32);
    glowGeo.rotateX(-Math.PI / 2);
    const under = new THREE.Mesh(glowGeo, new THREE.MeshBasicMaterial({ color: livery.glow || 0x29f0ff, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }));
    under.position.y = 0.05;
    model.add(under);
    // (No PointLight: the road and karts are unlit, so a dynamic light here only cost GPU time.)

    /* --- Open wheels: fat torus tyre + silver rim + hubcap --- */
    const wheels = [], frontPivots = [];
    const boltGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.04, 6).rotateZ(Math.PI / 2);
    if (livery.hover) {                                  // anti-gravity pods instead of wheels
      const podGeo = new THREE.CylinderGeometry(0.34, 0.42, 0.26, 20);
      const padGeo = new THREE.CircleGeometry(0.55, 24).rotateX(Math.PI / 2);
      const padMat = new THREE.MeshBasicMaterial({ color: livery.helmet, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false });
      for (const [x, z] of [[-1.2, 1.25], [1.2, 1.25], [-1.25, -1.25], [1.25, -1.25]]) {
        mesh(podGeo, rubberMat, body, x, 0.36, z);
        mesh(new THREE.TorusGeometry(0.36, 0.05, 8, 24).rotateX(Math.PI / 2), unlit(livery.helmet), body, x, 0.24, z, false);
        const pad = new THREE.Mesh(padGeo, padMat);
        pad.position.set(x, 0.18, z);
        model.add(pad);
      }
    }
    for (const [x, z, front] of (livery.hover ? [] : [[-1.22, 1.25, true], [1.22, 1.25, true], [-1.26, -1.25, false], [1.26, -1.25, false]])) {
      const r = front ? 0.28 : 0.32, w = front ? 0.22 : 0.32;
      const side = Math.sign(x);
      const pivot = new THREE.Group();
      pivot.position.set(x, r, z);
      model.add(pivot);
      const spin = new THREE.Group();
      spin.userData.r = r;
      pivot.add(spin);
      const tyreGeo = new THREE.TorusGeometry(r * 0.7, r * 0.3, 16, 36);
      tyreGeo.rotateY(Math.PI / 2);
      const tyre = mesh(tyreGeo, rubberMat, spin);
      tyre.scale.x = w / (r * 0.6);
      mesh(new THREE.CylinderGeometry(r * 0.52, r * 0.52, w * 0.9, 24).rotateZ(Math.PI / 2), rubberMat, spin);
      mesh(new THREE.CylinderGeometry(r * 0.26, r * 0.26, w * 0.9 + 0.03, 20).rotateZ(Math.PI / 2), hubMat, spin);
      for (let k = 0; k < 4; k++) {                                   // lug bolts make the rotation readable
        const a = (k / 4) * TAU;
        mesh(boltGeo, unlit(0x777780), spin, side * (w * 0.45 + 0.02), Math.cos(a) * r * 0.38, Math.sin(a) * r * 0.38, false);
      }
      wheels.push(spin);
      if (front) frontPivots.push(pivot);
    }

    /* --- Boost flames from each exhaust tip --- */
    const flameGeo = new THREE.ConeGeometry(0.1, 0.9, 12);
    flameGeo.rotateX(-Math.PI / 2);
    flameGeo.translate(0, 0, -0.45);
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x5fe8ff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
    const flames = exhaustTips.map((tip, k) => {
      const f = new THREE.Mesh(flameGeo, flameMat);
      f.visible = false;
      f.userData.phase = k * 1.7;
      tip.add(f);
      return f;
    });

    // Bake the static parts; the steering hoop, exhaust tips/flames and wheel pivots stay live
    mergeStatic(body, new Set([wheelMount, ...exhaustTips]));
    for (const w of wheels) mergeStatic(w, new Set());
    addOutlines(body, 0.045);
    for (const w of wheels) addOutlines(w, 0.03);

    scene.add(root);
    return {
      root, model, body, bodyMat: paintMat, baseColor: new THREE.Color(livery.paintMap ? 0xffffff : livery.paint),

      wheels, frontPivots, steeringWheel, flames, exhaustTips, boostVis: 0,
      underglow: under, tyreMat: rubberMat, baseTyre: livery.tyre, baseGlow: livery.glow || 0x29f0ff, hover: !!livery.hover,
      headlightMount: new THREE.Vector3(0, 0.56, 2.12),
      wheelLocal: [new THREE.Vector3(-1.26, 0.03, -1.25), new THREE.Vector3(1.26, 0.03, -1.25)],
      sparkAnchors: [-1.26, 1.26].map(x => { const a = new THREE.Object3D(); a.position.set(x, 0.03, -1.4); model.add(a); return a; })
    };
  }

  /* Headlights: a warm, wide forward SpotLight with a soft penumbra and a faint visible beam.
     Works on any kart built by buildKart(), so AI karts can reuse it. */
  const BEAM_VERT = `
    varying vec2 vUv;
    varying vec3 vViewNormal;
    varying vec3 vViewPos;
    void main() {
      vUv = uv;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vViewPos = mv.xyz;
      vViewNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * mv;
    }`;
  const BEAM_FRAG = `
    uniform vec3 uColor;
    uniform float uStrength;
    varying vec2 vUv;
    varying vec3 vViewNormal;
    varying vec3 vViewPos;
    void main() {
      float along = pow(vUv.y, 2.2);                                     // bright at the lamp, fading down the beam
      float facing = abs(dot(normalize(vViewNormal), normalize(-vViewPos)));
      float a = along * pow(facing, 1.6) * uStrength;
      gl_FragColor = vec4(uColor, a);
    }`;
  const HEADLIGHT = { intensity: 2.5, angle: Math.PI / 4, range: 60, penumbra: 0.55 };
  const beamGeo = new THREE.CylinderGeometry(0.3, 24 * Math.tan(HEADLIGHT.angle * 0.55), 24, 32, 1, true);
  beamGeo.translate(0, -12, 0);          // apex (top, uv.y = 1) at the origin
  beamGeo.rotateX(-Math.PI / 2);         // point the beam down +Z (forward)

  function addHeadlights(km, color = 0xffe7b0) {
    const lampPos = km.headlightMount || new THREE.Vector3(0, 0.95, 2.35);
    const beam = new THREE.Mesh(beamGeo, new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(color) }, uStrength: { value: 0.07 } },
      vertexShader: BEAM_VERT, fragmentShader: BEAM_FRAG,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
    }));
    beam.position.copy(lampPos);
    beam.rotation.x = Math.atan2(0.8 + 0.95, 24) * 0.6;
    beam.renderOrder = 4;
    km.body.add(beam);

    km.beam = beam;                                   // the visible cone is the headlight now; hidden for distant karts
    return beam;
  }

  const magmaChassisTex = (function () {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#b3120a'; g.fillRect(0, 0, 256, 256);
    let seed = 11;
    const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let k = 0; k < 26; k++) {                       // glowing lava veins
      g.strokeStyle = k % 3 ? 'rgba(255,150,40,0.9)' : 'rgba(255,230,120,0.95)';
      g.lineWidth = 2 + r() * 4;
      g.beginPath();
      let x = r() * 256, y = r() * 256;
      g.moveTo(x, y);
      for (let s2 = 0; s2 < 5; s2++) { x += (r() - 0.5) * 70; y += (r() - 0.5) * 70; g.lineTo(x, y); }
      g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.needsUpdate = true;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  })();
  let kartMesh = buildKart(KART_LIVERIES.player);
  addHeadlights(kartMesh);
  function applyLoadout() {
    Object.assign(PC, statsOf(CHARACTERS[playerCharId]));
    if (loadout.rocket) PC.accel *= 0.85;                // Rocket Exhaust: slower pickup…
  }
  function setPlayerCharacter(id) {
    playerCharId = CHARACTERS[id] ? id : 'cyber';
    const ch = CHARACTERS[playerCharId];
    applyLoadout();                                      // character coefficients + equipped parts
    scene.remove(kartMesh.root);
    kartMesh.root.traverse(o => { if (o.geometry && o.geometry !== beamGeo) o.geometry.dispose(); });
    kartMesh = buildKart(Object.assign({}, KART_LIVERIES.player, {
      paint: ch.paint, helmet: ch.helmet, suit: ch.suit, hover: !!ch.hover, glow: ch.hover ? ch.helmet : KART_LIVERIES.player.glow,
      paintMap: ch.glowingChassis ? magmaChassisTex : null
    }));
    addHeadlights(kartMesh);
    kartMesh.root.scale.setScalar(ch.scale);
    playerRacer.color = ch.paint;
    applyCosmetics();
    updateKartVisual(0, NO_INPUT, 0);
  }

  const kart = {
    x: 0, y: 0, z: 0, h: 0, vx: 0, vz: 0, vf: 0, vy: 0,
    airborne: false, onTrack: true, gradeF: 0,
    groundN: new THREE.Vector3(0, 1, 0), upVis: new THREE.Vector3(0, 1, 0), squash: 0,
    steerVis: 0, driftVis: 0, hopT: 0,
    drifting: false, driftDir: 0, driftTimer: 0, boost: 0, boostMax: 1, boostMult: 1.5, fovPulse: 0, fovKick: 0,
    offroad: false, lateral: 0, idx: 0, wrongWay: false,
    spinT: 0, spinDir: 1, invuln: 0, fallT: 0, teleported: false,
    safeIdx: 0, missT: 0, missFrames: 0, rampUsed: false, coinSurge: 0, invertT: 0, shakeT: 0, airT: 0, shrinkT: 0, scaleVis: 1, tumble: 0,
    ag: false, agS: 0, agLat: 0, agSpeed: 0, agVis: 0, gliding: false, glideTilt: 0, glideVis: 0, frenzyT: 0, frenzyCool: 0, glideUsed: false, roadY: 0, roadVy: 0, roadVyRaw: 0
  };
  const KART_BOOST = new THREE.Color(0x2ee6ff);
  const EMIT_OFF = new THREE.Color(0x000000);
  const EMIT_BOOST = new THREE.Color(0x0b5c7a);

  /* =====================================================================
     TRACK QUERIES
     ===================================================================== */
  // Smallest vertical gap wherever two far-apart parts of the lap pass within 14 m of each other (x/z)
  function overpassClearance() {
    let min = Infinity;
    for (let i = 0; i < N; i += 2) {
      for (let j = i + 60; j < N; j += 2) {
        if (N - (j - i) < 60) continue;
        const dx = samples[i].x - samples[j].x, dz = samples[i].z - samples[j].z;
        if (dx * dx + dz * dz < 196) min = Math.min(min, Math.abs(samples[i].y - samples[j].y));
      }
    }
    return min;
  }
  function steepestGrade() {
    let g = 0;
    for (let i = 1; i < N; i++) {
      const a = samples[i - 1], b = samples[i];
      g = Math.max(g, Math.abs(b.y - a.y) / Math.max(0.01, Math.hypot(b.x - a.x, b.z - a.z)));
    }
    return g;
  }
  // Is nothing else from the lap passing overhead within r metres? (for tall hazards like geysers)
  function clearOverhead(i, r) {
    for (let j = 0; j < N; j += 2) {
      const d = Math.abs(j - i);
      if (Math.min(d, N - d) < 60) continue;
      const dx = samples[j].x - samples[i].x, dz = samples[j].z - samples[i].z;
      if (dx * dx + dz * dz < r * r && samples[j].y > samples[i].y) return false;
    }
    return true;
  }
  function nearestIndex(x, z, y) {
    // With an overpass, two parts of the lap share the same x/z: weight height in so the kart
    // always resolves to the level it is actually on
    const useY = y !== undefined;
    let best = 0, bd = Infinity;
    for (let i = 0; i < N; i++) {
      const dx = samples[i].x - x, dz = samples[i].z - z, dy = useY ? (samples[i].y - y) * 2 : 0;
      const d = dx * dx + dz * dz + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function lateralOffset(i, x, z) {
    return (x - samples[i].x) * sides[i].x + (z - samples[i].z) * sides[i].z;
  }

  /* Downward ray cast against the chunks around `idx`; falls back to the ground plane */
  const raycaster = new THREE.Raycaster();
  raycaster.far = 500;
  const DOWN = new THREE.Vector3(0, -1, 0);
  const rayOrigin = new THREE.Vector3();
  const rayHits = [], rayTargets = [];
  const groundHit = { y: 0, onTrack: false, normal: new THREE.Vector3(0, 1, 0) };
  function queryGround(x, z, fromY, idx) {
    if (!trackChunks.length) {                           // the battle arena has no track mesh, just its floor
      groundHit.y = currentMap.floorY === null ? VOID_Y : currentMap.floorY;
      groundHit.onTrack = false;
      groundHit.normal.set(0, 1, 0);
      return groundHit;
    }
    const c = Math.floor(idx / CHUNK_STEPS);
    rayTargets.length = 0;
    for (let d = -1; d <= 1; d++) rayTargets.push(trackChunks[(c + d + CHUNKS) % CHUNKS]);
    rayOrigin.set(x, fromY, z);
    raycaster.set(rayOrigin, DOWN);
    rayHits.length = 0;
    raycaster.intersectObjects(rayTargets, false, rayHits);
    for (let k = 0; k < rayHits.length; k++) {
      const h = rayHits[k];
      if (h.face && h.face.normal.y > 0.25) {
        groundHit.y = h.point.y;
        groundHit.onTrack = true;
        groundHit.normal.copy(h.face.normal);
        return groundHit;
      }
    }
    groundHit.y = currentMap.floorY === null ? VOID_Y : currentMap.floorY;   // solid neon floor on the easy map
    groundHit.onTrack = false;
    groundHit.normal.set(0, 1, 0);
    return groundHit;
  }

  /* =====================================================================
     INPUT
     ===================================================================== */
  /* Driving keys are a plain boolean map. Listeners only flip flags; the game loop reads them every frame.
     Keys are matched by physical position (event.code), so Caps Lock, Shift or keyboard layout can't
     change what a key does, and OS key-repeat is ignored entirely. */
  const keys = { w: false, a: false, s: false, d: false, Shift: false, Space: false };
  const KEY_MAP = {
    KeyW: 'w', ArrowUp: 'w', KeyA: 'a', ArrowLeft: 'a', KeyS: 's', ArrowDown: 's', KeyD: 'd', ArrowRight: 'd',
    ShiftLeft: 'Shift', ShiftRight: 'Shift', Space: 'Space'
  };
  const input = { throttle: false, brake: false, steer: 0, drift: false };
  const NO_INPUT = Object.freeze({ throttle: false, brake: false, steer: 0, drift: false });
  let spaceTapped = false;          // latched on keydown so even a sub-frame tap fires the item

  window.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;   // typing in the cheat console
    watchCheatSequence(e.code);
    const k = KEY_MAP[e.code];
    if (k) {
      keys[k] = true;
      if (k === 'Space' && !e.repeat) spaceTapped = true;
      if (state === 'racing' || state === 'countdown') e.preventDefault();   // no page scroll / button clicks mid-race
      return;
    }
    if (e.repeat) return;
    // Menu and debug shortcuts only — nothing here moves the kart
    if (e.code === 'Enter') {
      if (state === 'paused') resume();              // in menus and results, Enter clicks the focused button
    } else if (e.code === 'Escape' || e.code === 'KeyP') {
      if (state === 'racing' || state === 'countdown') pause();
      else if (state === 'paused') resume();
    } else if (e.code === 'KeyC') {
      if (state === 'racing') swapItems();
    } else if (e.code === 'KeyB') {
      if (composer) {
        useBloom = !useBloom;
        bloomCheck = useBloom ? 6 : 0;
        showStatus(useBloom ? 'Glow on' : 'Glow off', 'boost', 0.9);
      }
    } else if (e.code === 'KeyG') {
      gateGroup.visible = !gateGroup.visible;
    } else if (e.code === 'KeyR' && (state === 'racing' || state === 'countdown' || state === 'paused')) {
      startRace();
    }
  });
  window.addEventListener('keyup', e => {
    const k = KEY_MAP[e.code];
    if (k) keys[k] = false;
  });
  window.addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
    if (state === 'racing' || state === 'countdown') pause();
  });

  /* Sampled once per frame, right before physics */
  function readInput() {
    input.throttle = keys.w;
    input.brake = keys.s;
    input.steer = (keys.a ? 1 : 0) - (keys.d ? 1 : 0);
    input.drift = keys.Shift;
    return input;
  }

  /* =====================================================================
     PHYSICS — horizontal (fixed substeps)
     ===================================================================== */
  function driftTier(t) { return t >= DRIFT_TIERS[2].from ? 2 : t >= DRIFT_TIERS[1].from ? 1 : 0; }

  // grant = true only when Shift is released (not when grass, low speed or a hit cancels the drift)
  function endDrift(grant) {
    if (grant && kart.driftTimer >= DRIFT_MIN_REWARD) {
      const tier = driftTier(kart.driftTimer), T = DRIFT_TIERS[tier];
      kart.boost = T.time;
      kart.boostMax = T.time;
      kart.boostMult = 1 + (T.mult - 1) * (loadout.slick ? 1.3 : 1);   // Slick Tires: turbos 30% stronger
      showStatus(T.label, 'boost', 0.9);
      turboBurst(tier);
      if (tier === 2 && state === 'racing') race.t3++;
      if (tier >= 1) {                                   // tier 2 / 3: 0.1 s FOV punch + screen flash
        kart.fovPulse = 0.1;
        kart.fovKick = tier === 2 ? 20 : 11;
        flashScreen(T.hex, tier === 2 ? 0.55 : 0.35);
      }
    }
    kart.drifting = false;
    kart.driftTimer = 0;
  }

  /* Anti-gravity: on the wall section the kart rides the track surface itself — position comes from the
     spline (distance along + offset across), its "down" is the road's own normal, and gravity is ignored */
  const agTmp = { x: 0, y: 0, z: 0 };
  function enterAntiGrav() {
    const i = kart.idx;
    kart.ag = true;
    kart.agS = i;
    kart.agLat = clamp((kart.x - samples[i].x) * frameR[i].x + (kart.y - samples[i].y) * frameR[i].y + (kart.z - samples[i].z) * frameR[i].z, -(HALF - 1.2), HALF - 1.2);
    kart.agSpeed = Math.max(Math.abs(kart.vf), 8);
    kart.airborne = false;
    if (kart.drifting) endDrift(false);
    showStatus('ANTI-GRAVITY', 'boost', 1.2);
    flashScreen(0x2a9bff, 0.3);
  }
  function exitAntiGrav() {
    kart.ag = false;
    kart.idx = trackIdx(kart.agS);
    kart.safeIdx = kart.idx;
    kart.roadY = kart.y; kart.roadVy = 0;
    kart.airborne = false;
  }
  function agStep(dt, inp) {
    const top = PC.maxSpeed * activeCC().allTop * (kart.boost > 0 ? kart.boostMult : 1) * (kart.frenzyT > 0 ? 1.3 : 1) * (kart.shrinkT > 0 ? 0.4 : 1) * (1 + 0.005 * race.coins);
    let v = kart.agSpeed;
    if (inp.throttle && !inp.brake) { if (v < top) v += PC.accel * Math.max(0.2, 1 - v / top) * dt; }
    else if (inp.brake) v = Math.max(2, v - BRAKE * dt);
    else v = Math.max(0, v - COAST * dt);
    if (v > top) v -= (v - top) * 2.4 * dt;
    kart.agSpeed = v;
    kart.agLat = clamp(kart.agLat - inp.steer * 9 * clamp(v / 10, 0.3, 1) * dt, -(HALF - 1.2), HALF - 1.2);
    kart.agS += (v / SPACING) * dt;
    trackPoint(kart.agS, kart.agLat, agTmp);
    const i = trackIdx(kart.agS);
    kart.x = agTmp.x; kart.y = agTmp.y; kart.z = agTmp.z;
    kart.h = Math.atan2(tangents[i].x, tangents[i].z);
    kart.vx = tangents[i].x * v; kart.vz = tangents[i].z * v; kart.vf = v; kart.vy = 0;
    kart.groundN.copy(frameU[i]);
    kart.steerVis = inp.steer;
    if (kart.agS >= agZone.i1) exitAntiGrav();
  }

  function stepKart(dt, inp) {
    if (kart.invuln > 0) kart.invuln = Math.max(0, kart.invuln - dt);
    if (kart.boost > 0) kart.boost = Math.max(0, kart.boost - dt);
    if (kart.hopT > 0) kart.hopT = Math.max(0, kart.hopT - dt);
    if (kart.frenzyT > 0) kart.frenzyT = Math.max(0, kart.frenzyT - dt);
    if (kart.ag && kart.fallT <= 0 && kart.spinT <= 0) { agStep(dt, inp); return; }
    if (kart.fallT > 0) {                              // falling / being rescued: keyboard has no effect
      return;                                           // updateRescue() moves the kart
    }
    if (kart.spinT > 0) {                              // spun out
      kart.spinT = Math.max(0, kart.spinT - dt);
      kart.vx = kart.vz = kart.vf = 0;
      return;
    }

    const fx = Math.sin(kart.h), fz = Math.cos(kart.h);
    const rx = -fz, rz = fx;
    let vf = kart.vx * fx + kart.vz * fz;
    let vl = kart.vx * rx + kart.vz * rz;
    const air = kart.airborne;
    const boosting = kart.boost > 0;
    const ccTop = PC.maxSpeed * activeCC().allTop;       // 200cc: every kart +30%
    const baseTop = kart.offroad ? ccTop * OFFROAD_FACTOR : ccTop;
    // Coins: +0.5% top speed per coin held (max 10) plus a 1.05× surge for a second after each pickup
    if (kart.coinSurge > 0) kart.coinSurge = Math.max(0, kart.coinSurge - dt);
    const coinMult = (1 + 0.005 * race.coins) * (kart.coinSurge > 0 ? 1.05 : 1);
    const slickOff = loadout.slick && kart.offroad;       // Slick Tires: less traction on the grid
    if (kart.shrinkT > 0) kart.shrinkT = Math.max(0, kart.shrinkT - dt);
    const top = baseTop * (boosting ? kart.boostMult : 1) * coinMult * (slickOff ? 0.85 : 1) * (kart.shrinkT > 0 ? 0.4 : 1) * (kart.frenzyT > 0 ? 1.3 : 1) *
      (draft.slipT > 0 ? SLIP_MULT : 1);                  // slipstream
    if (draft.slipT > 0 && inp.throttle && vf < top) vf += PC.accel * 0.6 * dt;   // the tow pulls you up to it
    const accel = PC.accel * (kart.offroad ? OFFROAD_ACCEL * (loadout.slick ? 0.7 : 1) : 1);

    if (!air) {
      // Gravity along the surface: climbing slows you, descending speeds you up, banks pull you inward
      const n = kart.groundN, ny = Math.max(n.y, 0.2);
      const gf = -(n.x * fx + n.z * fz) / ny;
      const gl = -(n.x * rx + n.z * rz) / ny;
      kart.gradeF = gf;
      vf -= SLOPE_G * (gf / Math.sqrt(1 + gf * gf)) * dt;
      vl -= SLOPE_G * 0.35 * (gl / Math.sqrt(1 + gl * gl)) * dt;

      if (boosting) {
        if (vf < top) vf += (top - vf) * 3.5 * dt;
      } else if (inp.throttle && !inp.brake) {
        if (vf < 0) vf += BRAKE * dt;
        else if (vf < top) vf += accel * Math.max(0.2, 1 - vf / top) * dt;   // no push past the character's top speed
      } else if (inp.brake) {
        if (vf > 0.5) vf -= BRAKE * dt;
        else vf = Math.max(-REVERSE_MAX, vf - PC.accel * 0.8 * dt);
      } else {
        const c = Math.min(Math.abs(vf), COAST * dt);
        vf -= Math.sign(vf) * c;
      }
      if (vf > top) vf -= (vf - top) * (kart.offroad ? OFFROAD_DRAG : 2.4) * dt;
    } else {
      kart.gradeF = 0;
    }

    // Drift (Shift + steer)
    if (!kart.drifting && !air && inp.drift && inp.steer !== 0 && vf > DRIFT_MIN_SPEED && !kart.offroad) {
      kart.drifting = true;
      kart.driftDir = inp.steer;
      kart.driftTimer = 0;
      kart.hopT = 0.22;
    } else if (kart.drifting) {
      if (!inp.drift) endDrift(true);
      else if (!air && (vf < DRIFT_MIN_SPEED * 0.65 || kart.offroad)) endDrift(false);
    }

    // Steering
    let yawRate;
    if (kart.drifting) {
      const s = inp.steer * kart.driftDir;
      yawRate = kart.driftDir * PC.driftTurn * (0.72 + 0.36 * s) * (air ? 0.6 : 1);
      kart.driftTimer += dt;
      if (kart.driftTimer > DRIFT_TIERS[2].from + 3.5) unlockAch('drift');   // 3.5 s held in purple
    } else {
      const speedFactor = clamp(Math.abs(vf) / 4, 0, 1);   // full steering from walking pace
      const highSpeedDamp = 1 - 0.2 * clamp(Math.abs(vf) / PC.maxSpeed, 0, 1);
      yawRate = inp.steer * PC.steer * speedFactor * highSpeedDamp * (vf >= 0 ? 1 : -1) * (air ? (kart.gliding ? 1 : AIR_STEER) : 1);
      if (weather === 'rain' && !air) yawRate = yawRate * 1.15 - vl * 0.05;   // wet: oversteer, the rear keeps stepping out
    }
    kart.h = wrapPi(kart.h + yawRate * dt);

    const wetGrip = weather === 'rain' ? 0.45 : 1, wetDrift = weather === 'rain' ? 0.7 : 1;   // Neon Rain: far less traction
    const grip = air ? AIR_GRIP : kart.drifting ? PC.driftGrip * wetDrift : (kart.offroad ? OFFROAD_GRIP * (loadout.slick ? 0.6 : 1) : GRIP) * wetGrip;
    vl *= Math.exp(-grip * dt);

    kart.vx = fx * vf + rx * vl;
    kart.vz = fz * vf + rz * vl;
    kart.x += kart.vx * dt;
    kart.z += kart.vz * dt;
    kart.vf = vf;

    const LIM = 900;
    if (kart.x > LIM || kart.x < -LIM) { kart.x = clamp(kart.x, -LIM, LIM); kart.vx *= -0.3; }
    if (kart.z > LIM || kart.z < -LIM) { kart.z = clamp(kart.z, -LIM, LIM); kart.vz *= -0.3; }
  }

  function updateTrackState() {
    const idx = nearestIndex(kart.x, kart.z, kart.y);
    kart.idx = idx;
    kart.lateral = lateralOffset(idx, kart.x, kart.z);
    const along = kart.vx * tangents[idx].x + kart.vz * tangents[idx].z;
    kart.wrongWay = !currentMap.arena && along < -6;
  }

  /* =====================================================================
     PHYSICS — vertical: ray cast, surface snap, gravity, respawn
     ===================================================================== */
  /* =====================================================================
     RESCUE DRONE — fishes a fallen kart out of the void and sets it back on the road
     One 1.8 s timeline: swoop & hook (0.4 s) → up and across (0.9 s) → lower & release (0.5 s)
     ===================================================================== */
  const HOOK_H = 3.6;                                    // drone height above the kart while carrying
  // One 1.8 s timeline, driven by a single clock that starts the moment the fall is detected:
  //   0.00–0.40  drone swoops in and hooks the kart (the kart keeps falling meanwhile)
  //   0.40–0.80  straight up to just above the road   ·   0.80–1.30  across onto the centre line
  //   1.30–1.65  lowered onto the surface             ·   1.65–1.80  drone lets go and vanishes
  //   1.80       controls back, with a small push forward
  const RESCUE_TOTAL = 1.8, T_HOOK = 0.4, T_RISEN = 0.8, T_OVER = 1.3, T_DOWN = 1.65;
  const rescue = { phase: 'idle', clock: 0, i: 0, x0: 0, y0: 0, z0: 0, h0: 0, liftY: 0, speed0: 0, dx: 0, dy: 0, dz: 0 };

  const drone = (function buildDrone() {
    const root = new THREE.Group();
    const unlit = (color, extra) => new THREE.MeshBasicMaterial(Object.assign({ color, toneMapped: false }, extra));
    const yellow = unlit(0xffd21a), white = unlit(0xf4f4f8), dark = unlit(0x1b1b24);
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.85, 24, 18), yellow);         // cockpit
    root.add(body);
    const visor = new THREE.Mesh(new THREE.SphereGeometry(0.87, 24, 10, Math.PI / 2 - 0.8, 1.6, 1.1, 0.55), unlit(0x0a2030));
    root.add(visor);
    const rotors = [];
    for (const sx of [-1, 1]) {
      const wing = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.12, 0.45), white);         // stubby wing
      wing.position.set(sx * 1.35, 0.05, 0);
      root.add(wing);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.22, 10), dark);
      hub.position.set(sx * 1.9, 0.2, 0);
      root.add(hub);
      const rotor = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.03, 0.14), dark);        // spinning blade
      rotor.position.set(sx * 1.9, 0.34, 0);
      root.add(rotor);
      rotors.push(rotor);
    }
    const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), unlit(0xff2a55));
    beacon.position.y = 0.9;
    root.add(beacon);
    // Tether + hook hanging from the belly (scaled to length each frame)
    const tether = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1, 8), dark);
    root.add(tether);
    const hook = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.06, 8, 16, Math.PI * 1.5), white);
    root.add(hook);
    root.traverse(o => { if (o.isMesh) o.castShadow = true; });
    root.visible = false;
    scene.add(root);
    return { root, rotors, beacon, tether, hook };
  })();

  const easeInOut = p => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
  const easeOut = p => 1 - (1 - p) * (1 - p);
  const fallEl = document.getElementById('fall');

  function startFall(cause) {
    kart.ag = false; kart.gliding = false;
    if (state === 'racing') ticker(cause === 'geyser' ? '🌋 A geyser launched you' : '🕳 You fell into the void');
    if (state === 'racing' && cause !== 'geyser') {    // only real drops into the void count
      race.falls++;
      if (game.mode === 'gp') cup.falls++;
    }
    kart.fallT = 1;                                    // "busy" flag: controls, items and hits are off
    kart.missT = 0; kart.missFrames = 0;
    if (kart.drifting) endDrift(false);
    kart.boost = 0;
    rescue.phase = 'active';
    rescue.clock = 0;
    rescue.i = kart.safeIdx;
    rescue.speed0 = Math.hypot(kart.vx, kart.vz);
    rescue.liftY = samples[rescue.i].y + 5;
    rescue.x0 = kart.x; rescue.y0 = kart.y; rescue.z0 = kart.z; rescue.h0 = kart.h;
    rescue.dx = kart.x; rescue.dy = kart.y + 30; rescue.dz = kart.z;   // drone starts high above
    fallEl.className = 'show';
  }

  function resetRescue() {
    rescue.phase = 'idle';
    drone.root.visible = false;
    fallEl.className = '';
  }

  function updateRescue(dt) {
    kart.teleported = true;                            // the kart is being carried: no lap-gate crossings
    kart.airborne = true;
    rescue.clock = Math.min(RESCUE_TOTAL, rescue.clock + dt);
    if (rescue.clock > RESCUE_TOTAL - 1e-6) rescue.clock = RESCUE_TOTAL;   // absorb float drift (108 × 1/60 ≠ 1.8 exactly)
    const c = rescue.clock, i = rescue.i, s = samples[i];
    const hOut = Math.atan2(tangents[i].x, tangents[i].z);
    if (c < T_HOOK) {                                  // phase 1: still falling while the drone swoops in
      kart.vy -= GRAVITY * dt;
      kart.x += kart.vx * dt; kart.y += kart.vy * dt; kart.z += kart.vz * dt;
      kart.tumble += dt * 6;
      rescue.x0 = kart.x; rescue.y0 = kart.y; rescue.z0 = kart.z; rescue.h0 = kart.h;
    } else if (c < T_RISEN) {                          // phase 2a: hooked, straight up
      const p = easeInOut((c - T_HOOK) / (T_RISEN - T_HOOK));
      kart.vx = kart.vz = kart.vy = kart.vf = 0;
      kart.x = rescue.x0; kart.z = rescue.z0;
      kart.y = rescue.y0 + (rescue.liftY - rescue.y0) * p;
      kart.tumble *= Math.exp(-12 * dt);
    } else if (c < T_OVER) {                           // phase 2b: across onto the centre line
      const p = easeInOut((c - T_RISEN) / (T_OVER - T_RISEN));
      kart.x = rescue.x0 + (s.x - rescue.x0) * p;
      kart.z = rescue.z0 + (s.z - rescue.z0) * p;
      kart.y = rescue.liftY;
      kart.h = lerpAngle(rescue.h0, hOut, p);
      kart.tumble = 0;
    } else {                                           // phase 3: lowered onto the road, then released
      const p = easeOut(Math.min(1, (c - T_OVER) / (T_DOWN - T_OVER)));
      kart.x = s.x; kart.z = s.z; kart.h = hOut;
      kart.y = rescue.liftY + (s.y - rescue.liftY) * p;
      kart.airborne = false;                           // tilt to the road's surface normal on the way down
      kart.groundN.copy(frameU[i]);
      kart.tumble = 0;
    }
    if (c >= RESCUE_TOTAL) releaseKart(i);
  }

  /* Back on the road at exactly 1.8 s: controls live again, with a small forward push */
  function releaseKart(i) {
    const push = clamp(rescue.speed0 * 0.4, 10, 20);   // 36–72 km/h, so you don't restart from a standstill
    kart.x = samples[i].x; kart.z = samples[i].z; kart.y = samples[i].y;
    kart.h = Math.atan2(tangents[i].x, tangents[i].z);
    kart.vx = tangents[i].x * push; kart.vz = tangents[i].z * push; kart.vf = push; kart.vy = 0;
    kart.airborne = false; kart.onTrack = true; kart.offroad = false;
    kart.groundN.copy(frameU[i]); kart.upVis.copy(frameU[i]);
    kart.fallT = 0; kart.invuln = 1.2; kart.teleported = true;
    kart.idx = i; kart.lateral = 0; kart.missT = 0; kart.missFrames = 0; kart.tumble = 0; kart.squash = 0.25;
    kart.roadY = kart.y; kart.roadVy = 0; kart.roadVyRaw = 0;
    rescue.phase = 'idle';
    drone.root.visible = false;
    fallEl.className = '';                             // the FALL! alert goes the same frame
  }

  /* Drone motion and tether, every frame */
  const dronePos = new THREE.Vector3();
  function updateDrone(dt, time) {
    if (rescue.phase !== 'active') { drone.root.visible = false; return; }
    const c = rescue.clock;
    let scale = 1, hooked = false;
    if (c < T_HOOK) {                                  // swoop down onto the falling kart
      const e = easeOut(c / T_HOOK);
      dronePos.set(rescue.dx + (kart.x - rescue.dx) * e, rescue.dy + (kart.y + HOOK_H - rescue.dy) * e, rescue.dz + (kart.z - rescue.dz) * e);
    } else if (c < T_DOWN) {                           // carrying
      dronePos.set(kart.x, kart.y + HOOK_H, kart.z);
      hooked = true;
    } else {                                           // let go: zip upward and shrink away by 1.8 s
      const e = (c - T_DOWN) / (RESCUE_TOTAL - T_DOWN);
      dronePos.set(kart.x, kart.y + HOOK_H + e * e * 14, kart.z);
      scale = Math.max(0.001, 1 - e);
    }
    drone.root.visible = true;
    drone.root.position.copy(dronePos);
    drone.root.position.y += Math.sin(time * 6) * 0.08;
    drone.root.scale.setScalar(scale);
    drone.root.rotation.y = kart.h;
    drone.root.rotation.z = Math.sin(time * 3) * 0.06;
    for (const r of drone.rotors) r.rotation.y += dt * 45;
    drone.beacon.visible = Math.sin(time * 14) > 0;
    const len = hooked ? Math.max(0.4, HOOK_H - 2.2) : 0.6;
    drone.tether.scale.set(1, len, 1);
    drone.tether.position.set(0, -0.8 - len / 2, 0);
    drone.hook.position.set(0, -0.8 - len, 0);
  }


  /* Dual-ray suspension probe: front bumper + rear axle, averaged, so a crest or dip is felt before the
     kart's centre reaches it. Falls back to a centre ray when only one end is over the road. */
  const rayF = { y: 0, on: false, n: new THREE.Vector3() };
  const rayR = { y: 0, on: false, n: new THREE.Vector3() };
  const rayC = { y: 0, on: false, n: new THREE.Vector3() };
  const susp = { y: 0, on: false, n: new THREE.Vector3(0, 1, 0) };
  function probe(out, x, z, fromY) {
    const g = queryGround(x, z, fromY, kart.idx);
    out.y = g.y; out.on = g.onTrack; out.n.copy(g.normal);
    return out;
  }
  /* Continuous collision for landings. While falling, three rays (left wheel, centre, right wheel) are cast
     from where the kart was at the start of this step, along its velocity (so angled down and forward),
     reaching the distance it travels this step plus a predictive look-ahead. They test the track chunks around
     both the kart's current index AND the x/z-nearest index of where it is heading, so a stale index can't hide
     the road. If the kart is at or below the surface — or will be before the next frame — it is clamped
     onto the road at its own x/z. */
  const ccdRay = new THREE.Raycaster();
  const ccdOrigin = new THREE.Vector3(), ccdDir = new THREE.Vector3();
  const ccdTargets = [], ccdHits = [];
  const ccd = { y: 0, n: new THREE.Vector3(0, 1, 0), idx: 0 };
  function nearestIndexXZ(x, z) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < N; i += 2) {
      const dx = samples[i].x - x, dz = samples[i].z - z, d = dx * dx + dz * dz;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  function pushChunksAround(idx) {
    const c = Math.floor(idx / CHUNK_STEPS);
    for (let d = -1; d <= 1; d++) {
      const m = trackChunks[(c + d + CHUNKS) % CHUNKS];
      if (!ccdTargets.includes(m)) ccdTargets.push(m);
    }
  }
  function sweptLanding(fromX, fromY, fromZ, dt) {
    if (!trackChunks.length || kart.vy >= 0) return null;
    const speed = Math.hypot(kart.vx, kart.vy, kart.vz);
    if (speed < 1e-3) return null;
    let moved = Math.hypot(kart.x - fromX, kart.y - fromY, kart.z - fromZ);
    if (moved > speed * dt * 2 + 3) { fromX = kart.x; fromZ = kart.z; moved = Math.abs(kart.y - fromY); }   // teleported (rescue): no sweep across the jump
    const lookAheadDistance = Math.max(5, speed * dt);  // predictive reach beyond this step
    ccdTargets.length = 0;
    pushChunksAround(kart.idx);
    pushChunksAround(nearestIndexXZ(kart.x + kart.vx * dt, kart.z + kart.vz * dt));
    ccdDir.set(kart.vx, kart.vy, kart.vz).normalize();
    ccdRay.far = moved + lookAheadDistance;
    const rx = Math.cos(kart.h), rz = -Math.sin(kart.h);   // kart's right vector (flat)
    let found = false, bestY = -Infinity;
    for (const side of [-1.2, 0, 1.2]) {                  // left wheel, centre, right wheel
      ccdOrigin.set(fromX + rx * side, fromY + 0.6, fromZ + rz * side);
      ccdRay.set(ccdOrigin, ccdDir);
      ccdHits.length = 0;
      ccdRay.intersectObjects(ccdTargets, false, ccdHits);
      for (let k = 0; k < ccdHits.length; k++) {
        const h = ccdHits[k];
        if (!h.face || h.face.normal.y <= 0.25) continue;
        // only a hit reached this step, or within the next frame's travel, counts
        if (h.distance > moved + 0.6 + speed * dt) break;
        const ci = trackChunks.indexOf(h.object) * CHUNK_STEPS + (CHUNK_STEPS >> 1);
        const under = queryGround(kart.x, kart.z, h.point.y + STEP_UP + 2, ci);   // surface under the kart itself
        if (under.onTrack && under.y > bestY && under.y <= fromY + STEP_UP) {
          bestY = under.y; found = true;
          ccd.n.copy(under.normal); ccd.idx = ci;
        }
        break;
      }
    }
    if (!found) return null;
    // clamp: at/below the surface now, or would be before the next frame
    if (kart.y <= bestY + 0.02 || kart.y + kart.vy * dt <= bestY) { ccd.y = bestY; return ccd; }

  function sampleSuspension(fromY) {
    const fx = Math.sin(kart.h), fz = Math.cos(kart.h);
    probe(rayF, kart.x + fx * SUSP_FRONT, kart.z + fz * SUSP_FRONT, fromY);
    probe(rayR, kart.x - fx * SUSP_REAR, kart.z - fz * SUSP_REAR, fromY);
    if (rayF.on && rayR.on) {
      // Weighted so the average is the road height under the kart's centre on a straight slope
      const wf = SUSP_REAR / (SUSP_FRONT + SUSP_REAR);
      susp.y = rayF.y * wf + rayR.y * (1 - wf);
      susp.on = true;
      susp.n.copy(rayF.n).add(rayR.n).normalize();
      return susp;
    }
    probe(rayC, kart.x, kart.z, fromY);                  // one or both ends off the road: check the middle
    const best = rayC.on ? rayC : rayF.on ? rayF : rayR.on ? rayR : rayC;

    const gScale = cheats.moon ? 0.3 : 1;              // MOONJUMP cheat: 70% less gravity
    if (kart.fallT > 0) {                              // in the hands of the rescue drone
      updateRescue(dt);
      return;
    }
    if (kart.ag) {                                     // riding the anti-gravity wall: no gravity, no void
      kart.onTrack = true; kart.offroad = false; kart.missT = 0; kart.missFrames = 0;
      kart.safeIdx = trackIdx(kart.agS);

    }
    if (agZone && state === 'racing' && !kart.airborne && kart.onTrack && kart.idx >= agZone.i0 && kart.idx < agZone.i1 - 3) enterAntiGrav();

    if (kart.airborne) {
      // Glider (MK7 style): 60% less gravity, W dives for speed, S pulls up to stretch the glide
      const glide = kart.gliding ? 0.4 : 1;

      if (hit && (!g.on || hit.y > g.y)) {              // the swept rays found road the point ray missed

      const step = g.y - kart.roadY;
      const roadVyNow = Math.abs(step) > 0.6 ? 0 : step * idt;          // >0.6 m in a frame = climbing onto a ledge
      // Crest launch from the spline's own vertical curvature (noise-free): leave the road when the pull
      // needed to follow a convex crest exceeds gravity (v² · κ > g), or when there's simply no road
      // under the kart any more (driven off an edge)

    const belowRoad = !kart.airborne || kart.y < samples[kart.idx].y - 2;

  /* =====================================================================

  function checkGates(px, pz, x, z) {
    for (let g = 0; g < gates.length; g++) {
      const G = gates[g];
      const s0 = (px - G.x) * G.tx + (pz - G.z) * G.tz;
      const s1 = (x - G.x) * G.tx + (z - G.z) * G.tz;
      if ((s0 < 0) === (s1 < 0)) continue;
      const t = s0 / (s0 - s1);
      const cx = px + (x - px) * t, cz = pz + (z - pz) * t;
      if (Math.abs((cx - G.x) * G.sx + (cz - G.z) * G.sz) > GATE_HALF) continue;
      if (Math.abs(kart.y - G.y) > 8) continue;           // a gate on the other level of an overpass
      if (s1 >= 0) onGateForward(g); else onGateBackward(g);
    }
  }
  function onGateForward(g) {
    if (g === race.gatesPassed % gates.length) {
      race.gatesPassed++;
      if (g === 0 && race.gatesPassed > 1) completeLap();
    } else if (g === 0 && race.gatesPassed % gates.length !== 1) {
      showStatus('Missed a checkpoint', 'warn', 1.8);
    }
  }
  function onGateBackward(g) {
    if (race.gatesPassed > 0 && g === (race.gatesPassed - 1) % gates.length) race.gatesPassed--;
  }

  /* =====================================================================

  const PARTICLE_VERT = `

    attribute vec3 aColor;

    varying float vAlpha;

      this.alpha = new Float32Array(max);
      this.vel = new Float32Array(max * 3);
      this.life = new Float32Array(max);
      this.maxLife = new Float32Array(max);

    const T = DRIFT_TIERS[tier];
    for (const tip of kartMesh.exhaustTips) {
      tip.getWorldPosition(fxP);
      emitBurst(fxP.x, fxP.y, fxP.z, T.hex, 14 + tier * 14, 5 + tier * 3);
    }
  }

  function updateFx(dt, inp) {
    if (dt <= 0) return;
    const km = kartMesh;
    km.root.updateMatrixWorld(true);
    const mw = km.model.matrixWorld;
    fxBack.set(0, 0, -1).transformDirection(mw);
    fxSide.set(1, 0, 0).transformDirection(mw);
    const up = kart.upVis;
    const active = kart.spinT <= 0 && kart.fallT <= 0;
    const throttle = (state === 'racing' && inp.throttle) || (state === 'countdown' && keys.w);
    const speedRatio = clamp(Math.abs(kart.vf) / PC.maxSpeed, 0, 1);
    const jx = kart.vx * dt, jy = kart.vy * dt, jz = kart.vz * dt;   // spread emissions along this frame's path

    // Cosmetic underglow trail (unlocked by achievements)
    if (active && cosmetic.glow !== 'default' && Math.abs(kart.vf) > 6 && !kart.airborne) {
      const gh = glowHexFor(cosmetic.glow);
      if (gh !== null) {
        fxAcc.trail = (fxAcc.trail || 0) + dt * 50;
        sparkCol.setHex(gh);
        while (fxAcc.trail >= 1) {
          fxAcc.trail -= 1;
          fxGlow.emit(kart.x - fxBack.x * -0.4 + rnd(-0.8, 0.8), kart.y + 0.15, kart.z - fxBack.z * -0.4 + rnd(-0.8, 0.8),
            fxBack.x * 2, rnd(0.2, 0.8), fxBack.z * 2, rnd(0.35, 0.6), 1.0, 0.2, sparkCol.r, sparkCol.g, sparkCol.b, 0.6, 0, 1.5);
        }
      }
    }

    // Exhaust fumes wired to the pipe tips: smoke-ring puffs at idle, dense expanding fumes
    // under throttle, and a rapid triple puff the moment you hit the gas
    if (active) {
      const tips = km.exhaustTips;
      if (throttle && !fxAcc.wasThrottle) {
        for (const tip of tips) {
          tip.getWorldPosition(fxP);
          for (let k = 0; k < 3; k++) emitSmokeRing(fxP, fxBack, up, 1.6 + k * 0.9);
        }
      }
      if (throttle || kart.boost > 0) {
        fxAcc.idle = 0;
        fxAcc.exhaust += dt * (28 + 60 * speedRatio);
        while (fxAcc.exhaust >= 1) {
          fxAcc.exhaust -= 1;
          for (const tip of tips) {
            const f = Math.random();
            tip.getWorldPosition(fxP);
            fxP.x -= jx * f; fxP.y -= jy * f; fxP.z -= jz * f;
            const sp = rnd(1.5, 3.5);
            fxSmoke.emit(fxP.x, fxP.y, fxP.z,
              fxBack.x * sp + up.x * 0.9 + rnd(-0.4, 0.4), fxBack.y * sp + up.y * 0.9 + rnd(-0.2, 0.4), fxBack.z * sp + up.z * 0.9 + rnd(-0.4, 0.4),
              rnd(0.5, 0.9), 0.18, rnd(1.2, 1.9), 0.74, 0.74, 0.78, 0.22, -1.4, 2.0);
            if (kart.boost > 0) {
              const bs = rnd(6, 11);
              fxGlow.emit(fxP.x, fxP.y, fxP.z, fxBack.x * bs + rnd(-0.6, 0.6), fxBack.y * bs + rnd(-0.3, 0.6), fxBack.z * bs + rnd(-0.6, 0.6),
                rnd(0.14, 0.28), rnd(0.5, 0.8), 0.08, 0.25, 0.85, 1.0, 0.9, 0, 3);
            }
          }
        }
      } else {
        fxAcc.exhaust = 0;
        fxAcc.idle += dt;
        if (fxAcc.idle >= 0.26) {                 // idle: alternate pipes, one ring at a time
          fxAcc.idle = 0;
          const tip = tips[fxAcc.pipe++ % tips.length];
          tip.getWorldPosition(fxP);
          emitSmokeRing(fxP, fxBack, up, rnd(1.1, 1.7));
        }
      }
    }
    fxAcc.wasThrottle = throttle;

    // Drift sparks from anchors on the rear wheels. Emission uses the wheels' world transform, which
    // includes the drift yaw, so the spray always shoots backward relative to how the kart is sliding.
    if (active && kart.drifting && !kart.airborne) {
      const tier = driftTier(kart.driftTimer), T = DRIFT_TIERS[tier];
      sparkCol.setHex(T.hex);
      fxAcc.spark += dt * T.rate;
      while (fxAcc.spark >= 1) {
        fxAcc.spark -= 1;
        for (const anchor of km.sparkAnchors) {
          const f = Math.random();
          anchor.getWorldPosition(fxP);
          fxP.x -= jx * f; fxP.y -= jy * f; fxP.z -= jz * f;
          const b = rnd(2, 6) * T.speed, u2 = rnd(1.5, 4.5) * T.speed, s2 = rnd(-2.5, 2.5) * T.speed;
          // Tier 3 flickers between magenta and red, like fire
          const c = tier === 2 && Math.random() < 0.4 ? fireCol : sparkCol;
          fxSpark.emit(fxP.x, fxP.y, fxP.z,
            fxBack.x * b + up.x * u2 + fxSide.x * s2, fxBack.y * b + up.y * u2 + fxSide.y * s2, fxBack.z * b + up.z * u2 + fxSide.z * s2,
            rnd(0.2, 0.38) + tier * 0.06, rnd(0.16, 0.26) * T.size, 0.04, c.r, c.g, c.b, 1, 20, 1.0);
          if (tier === 2 && Math.random() < 0.5) {       // roaring flame licks rising off the tyres
            fxGlow.emit(fxP.x, fxP.y + 0.2, fxP.z, fxBack.x * 2 + rnd(-0.8, 0.8), rnd(2, 4), fxBack.z * 2 + rnd(-0.8, 0.8),
              rnd(0.25, 0.4), rnd(0.9, 1.3), 0.2, c.r, c.g * 0.6, c.b, 0.7, -2, 1.5);
          }
        }
      }
      for (const anchor of km.sparkAnchors) {             // hot glow at each contact patch
        anchor.getWorldPosition(fxP);
        fxGlow.emit(fxP.x, fxP.y + 0.12, fxP.z, 0, 0, 0, 0.06, 0.9 + tier * 0.45, 0.9, sparkCol.r, sparkCol.g, sparkCol.b, 0.55, 0, 0);
      }
    } else {
      fxAcc.spark = 0;
    }

    if (active && kart.offroad && Math.abs(kart.vf) > 4) {
      fxAcc.dust += dt * 70 * speedRatio;
      while (fxAcc.dust >= 1) {
        fxAcc.dust -= 1;

        }
      }
    } else {
      fxAcc.dust = 0;
    }
  }

  function segDist2(px, pz, ax, az, bx, bz) {
    const abx = bx - ax, abz = bz - az;
    const l2 = abx * abx + abz * abz;
    let t = l2 > 1e-8 ? ((px - ax) * abx + (pz - az) * abz) / l2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const dx = ax + abx * t - px, dz = az + abz * t - pz;
    return dx * dx + dz * dz;
  }
  /* Point on the (banked) road surface at track position s and lateral offset lat */
  function trackPoint(s, lat, out) {
    const n = ((s % N) + N) % N;
    const i = Math.floor(n), f = n - i;
    const a = samples[i], b = samples[i + 1], ra = frameR[i], rb = frameR[i + 1];
    out.x = a.x + (b.x - a.x) * f + (ra.x + (rb.x - ra.x) * f) * lat;
    out.y = a.y + (b.y - a.y) * f + (ra.y + (rb.y - ra.y) * f) * lat;
    out.z = a.z + (b.z - a.z) * f + (ra.z + (rb.z - ra.z) * f) * lat;
    return out;
  }

  function spawnBurst(x, y, z, color, size) {

    b.mesh.visible = true;
    emitBurst(x, y, z, color, Math.round(16 * size), 4 + 2 * size);

  function dropBananaAt(x, z, fromY, idx) {
    const g = queryGround(x, z, fromY, idx);

    let bn = null;
    for (const c of BANANA_POOL) if (!c.live) { bn = c; break; }
