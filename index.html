        (r.out ? 'out' : '🎈 × ' + r.balloons) + '</td></tr>').join('') + '</table>' +
      '<p class="gpc">' + (battle.paid ? '💰 +300 GPC' : 'Winner: ' + (w ? w.name : '–')) + ' <small>· balance ' + gpc() + ' GPC</small></p>' +
      '<div class="row"><button data-action="battle">Battle again</button><button class="alt" data-action="garage">🔧 Garage</button><button class="alt" data-action="modes">Main menu</button></div>';
  }

  function startBattle() {
    game.mode = 'battle';
    loadMap('arena');
    configureRoster();
    startRace();
    battle.t = 0; battle.over = false; battle.winner = null;
    const spawns = [0, 1, 2, 3].map(k => { const a = k * Math.PI / 2 + Math.PI / 8; return { x: Math.sin(a) * 40, z: Math.cos(a) * 40 }; });
    kart.x = spawns[3].x; kart.z = spawns[3].z; kart.y = 0; kart.roadY = 0;
    kart.h = Math.atan2(-kart.x, -kart.z);
    kart.upVis.set(0, 1, 0); kart.groundN.set(0, 1, 0);
    camYaw = kart.h;
    for (const r of racers) { r.balloons = 3; r.out = false; r.outT = 0; }
    attachBalloons(kartMesh);
    ais.forEach((ai, k) => {
      ai.x = ai.px = spawns[k].x; ai.z = ai.pz = spawns[k].z; ai.y = 0;
      ai.h = Math.atan2(-ai.x, -ai.z); ai.speed = 0;
      ai.km.root.visible = true;
      attachBalloons(ai.km);
    });
  }
  function leaveBattle() {                               // tidy up when going back to racing
    hideBalloons(kartMesh);
    for (const ai of ais) { hideBalloons(ai.km); ai.out = false; ai.km.root.visible = true; }
    playerRacer.out = false;
  }

  function nearestFoe(me) {
    let best = null, bd = Infinity;
    for (const r of racers) {
      if (r === me || r.out) continue;
      const p = racerPos(r), d = (p.x - me.x) ** 2 + (p.z - me.z) ** 2;
      if (d < bd) { bd = d; best = r; }
    }
    return best;
  }
  function nearestBox(me) {
    let best = null, bd = Infinity;
    for (const b of itemBoxes) {
      if (!b.active) continue;
      const d = (b.x - me.x) ** 2 + (b.z - me.z) ** 2;
      if (d < bd) { bd = d; best = b; }
    }
    return best;
  }

  // Free-roaming rival: hunts item boxes when empty-handed, hunts karts when armed
  function updateBattleAi(ai, dt, time, driving) {
    ai.px = ai.x; ai.pz = ai.z;
    const km = ai.km;
    ai.near = true;
    if (ai.out) {
      ai.outT += dt;
      km.model.rotation.y += dt * 8;
      km.root.position.y = -ai.outT * 0.8;
      if (ai.outT > 1.4) km.root.visible = false;
      return;
    }
    if (driving) {
      if (ai.invuln > 0) ai.invuln -= dt;
      if (ai.boost > 0) ai.boost = Math.max(0, ai.boost - dt);
      if (ai.roll > 0) { ai.roll -= dt; if (ai.roll <= 0) { ai.item = pickItem(); ai.holdT = 0; } }
      if (ai.spinT > 0) {
        ai.spinT = Math.max(0, ai.spinT - dt);
        ai.speed *= Math.exp(-5 * dt);
      } else {
        const foe = nearestFoe(ai), fp = foe ? racerPos(foe) : null;
        let tx = 0, tz = 0;
        if (ai.item && fp) { tx = fp.x; tz = fp.z; }
        else { const b = nearestBox(ai); if (b) { tx = b.x; tz = b.z; } else if (fp) { tx = fp.x; tz = fp.z; } }
        let want = Math.atan2(tx - ai.x, tz - ai.z);
        const r = Math.hypot(ai.x, ai.z);
        if (r > ARENA_R - 10) want = lerpAngle(want, Math.atan2(-ai.x, -ai.z), clamp((r - (ARENA_R - 10)) / 8, 0, 1));
        const dh = wrapPi(want - ai.h), turn = ai.stats.steer * 0.85;
        ai.h = wrapPi(ai.h + clamp(dh, -turn * dt, turn * dt));
        ai.steerVis += (clamp(dh * 2, -1, 1) - ai.steerVis) * (1 - Math.exp(-8 * dt));
        const top = ai.stats.maxSpeed * 0.72 * activeCC().aiTop * activeCC().allTop * (ai.boost > 0 ? BOOST_MULT : 1) * (1 - 0.4 * Math.min(1, Math.abs(dh) / 1.5)) * (weather === 'rain' ? 0.9 : 1);
        const a = Math.min(ai.stats.accel, PC.accel) * 0.92;                     // same launch clamp as racing
        if (ai.speed < top) ai.speed = Math.min(top, ai.speed + a * Math.max(0.2, 1 - ai.speed / top) * dt);
        else ai.speed = Math.max(top, ai.speed - BRAKE * 0.5 * dt);
        if (ai.item) {
          ai.holdT += dt;
          if (ai.item === 'nitro' || ai.item === 'triple') { ai.boost = NITRO_TIME; ai.item = null; }
          else if (ai.item === 'feather' || ai.item === 'blue' || ai.item === 'horn') ai.item = null;
          else if (ai.item === 'fake') { dropFakeBoxArena(ai); ai.item = null; }
          else if (ai.item === 'bomb' && fp) {
            const ahead = (fp.x - ai.x) * Math.sin(ai.h) + (fp.z - ai.z) * Math.cos(ai.h);
            if ((ahead > 8 && ahead < 25) || ai.holdT > 8) { throwBomb(ai); ai.item = null; }
          }
          else if (ai.item === 'seeker' && fp) {
            const ang = Math.abs(wrapPi(Math.atan2(fp.x - ai.x, fp.z - ai.z) - ai.h)), d = Math.hypot(fp.x - ai.x, fp.z - ai.z);
            if ((ang < 0.22 && d < 32 && ai.holdT > 2) || ai.holdT > 12) { fireArenaShell(ai); ai.item = null; }
          } else if (ai.item === 'banana') {
            const behind = fp ? -((fp.x - ai.x) * Math.sin(ai.h) + (fp.z - ai.z) * Math.cos(ai.h)) : 0;
            if ((behind > 2 && behind < 14) || ai.holdT > 8) {
              dropBananaAt(ai.x - Math.sin(ai.h) * 3.3, ai.z - Math.cos(ai.h) * 3.3, 3, 0);
              ai.item = null;
            }
          }
        }
      }
      ai.x += Math.sin(ai.h) * ai.speed * dt;
      ai.z += Math.cos(ai.h) * ai.speed * dt;
      arenaBounds(ai, false);
    }
    ai.y = 0;
    km.root.position.set(ai.x, 0, ai.z);
    km.root.rotation.set(0, ai.h, 0);
    let spinYaw = 0;
    if (ai.spinT > 0) { const p2 = 1 - ai.spinT / SPIN_TIME; spinYaw = ai.spinDir * TAU * (1 - (1 - p2) * (1 - p2)); }
    km.model.rotation.set(0, spinYaw, 0);
    km.model.position.y = km.hover ? 0.35 : 0;
    for (const p2 of km.frontPivots) p2.rotation.y = ai.steerVis * 0.42;
    for (const w of km.wheels) w.rotation.x += (ai.speed * dt) / w.userData.r;
    for (const f of km.flames) f.visible = ai.boost > 0;
    animateBalloons(km, time, ai.phase);
  }

  // Arena shells: straight-line shots that home a little toward the nearest kart and bounce off walls
  const arenaShells = [];
  function fireArenaShell(owner) {
    let p = null;
    for (const c of SEEKER_POOL) if (!c.live) { p = c; break; }
    if (!p) return;
    const o = racerPos(owner), h = owner.isPlayer ? kart.h : owner.h;
    p.live = true;
    p.mesh.visible = true;
    arenaShells.push({ p, owner, x: o.x + Math.sin(h) * 3, z: o.z + Math.cos(h) * 3, vx: Math.sin(h) * 44, vz: Math.cos(h) * 44, life: 4.5 });
  }
  function updateArenaShells(dt, time) {
    for (let k = arenaShells.length - 1; k >= 0; k--) {
      const sh = arenaShells[k];
      const target = nearestFoe(sh.owner);
      if (target) {                                      // gentle homing inside a 60° cone
        const tp = racerPos(target), want = Math.atan2(tp.x - sh.x, tp.z - sh.z), cur = Math.atan2(sh.vx, sh.vz);
        const d = wrapPi(want - cur);
        if (Math.abs(d) < 0.4) {
          const n = cur + clamp(d, -2.4 * dt, 2.4 * dt), v = Math.hypot(sh.vx, sh.vz);
          sh.vx = Math.sin(n) * v; sh.vz = Math.cos(n) * v;
        }
      }
      sh.x += sh.vx * dt; sh.z += sh.vz * dt;
      const r = Math.hypot(sh.x, sh.z);
      if (r > ARENA_R - 1) {                             // bounce off the bumper wall
        const nx = sh.x / r, nz = sh.z / r, vn = sh.vx * nx + sh.vz * nz;
        sh.vx -= 2 * vn * nx; sh.vz -= 2 * vn * nz;
        sh.x = nx * (ARENA_R - 1.1); sh.z = nz * (ARENA_R - 1.1);
      }
      sh.life -= dt;
      sh.p.mesh.position.set(sh.x, 0.9 + Math.sin(time * 18) * 0.08, sh.z);
      sh.p.body.rotation.y += dt * 14;
      sh.p.ring.rotation.z += dt * 9;
      let dead = sh.life <= 0;
      for (const rr of racers) {
        if (dead || rr === sh.owner || rr.out) continue;
        const rp = racerPos(rr);
        if ((rp.x - sh.x) ** 2 + (rp.z - sh.z) ** 2 < 2.1 * 2.1) { hitRacer(rr); dead = true; }
      }
      if (dead) {
        emitBurst(sh.x, 0.9, sh.z, 0xff5a1f, 24, 6);
        sh.p.live = false; sh.p.mesh.visible = false;
        arenaShells[k] = arenaShells[arenaShells.length - 1];
        arenaShells.pop();
      }
    }
  }
  function clearArenaShells() {
    for (const sh of arenaShells) { sh.p.live = false; sh.p.mesh.visible = false; }
    arenaShells.length = 0;
  }
  const battleTextEl = document.getElementById('battletext');
  let battleTextShown = '';
  function updateBattle(dt, time) {
    animateBalloons(kartMesh, time, 0);
    if (state !== 'racing') return;
    updateArenaShells(dt, time);
    if (playerRacer.out && !battle.over) checkBattleOver();
    battle.t += dt;
    if (battle.t >= BATTLE_TIME && !battle.over) checkBattleOver(true);
    const left = Math.max(0, BATTLE_TIME - battle.t), alive = racers.filter(r => !r.out).length;
    const txt = '🎈 × ' + (playerRacer.balloons || 0) + ' · ' + alive + ' karts left · ' + Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
    if (txt !== battleTextShown) { battleTextShown = txt; battleTextEl.textContent = txt; }
  }

  /* =====================================================================
     BLAST BOMB and LEADER SEEKER
     ===================================================================== */
  const BOMB_RADIUS = 9;
  const bombBodyMat = new THREE.MeshBasicMaterial({ color: 0x22222c, toneMapped: false });
  const bombCapMat = new THREE.MeshBasicMaterial({ color: 0x8a93a6, toneMapped: false });
  const bombLampMat = new THREE.MeshBasicMaterial({ color: 0xff2a3a, toneMapped: false });
  const bombs = [];
  const shockGeo = new THREE.RingGeometry(0.8, 1, 48).rotateX(-Math.PI / 2);
  const shocks = [];
  for (let k = 0; k < 4; k++) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.85, 20, 14), bombBodyMat);
    body.position.y = 0.85;
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.3, 12), bombCapMat);
    cap.position.y = 1.75;
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), bombLampMat);
    lamp.position.y = 2.0;
    g.add(body, cap, lamp);
    addOutlines(g, 0.05);
    g.visible = false;
    scene.add(g);
    bombs.push({ g, lamp, live: false, x: 0, y: 0, z: 0, fuse: 0 });
    const ring = new THREE.Mesh(shockGeo, new THREE.MeshBasicMaterial({ color: 0xffb020, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false, toneMapped: false }));
    ring.visible = false;
    scene.add(ring);
    shocks.push({ ring, t: 1 });
  }
  const bombTmp = { x: 0, y: 0, z: 0 };
  function throwBomb(owner) {
    const b = bombs.find(o => !o.live);
    if (!b) return;
    if (currentMap.arena) {
      const o = racerPos(owner), h = owner.isPlayer ? kart.h : owner.h;
      bombTmp.x = o.x + Math.sin(h) * 14; bombTmp.y = 0; bombTmp.z = o.z + Math.cos(h) * 14;
    } else if (owner.isPlayer) {
      trackPoint(playerRacer.prog + 14 / SPACING, clamp(kart.lateral, -(HALF - 1), HALF - 1), bombTmp);
    } else {
      trackPoint(owner.s + 14 / SPACING, owner.lat, bombTmp);
    }
    b.x = bombTmp.x; b.y = bombTmp.y; b.z = bombTmp.z; b.fuse = 3; b.live = true;
    b.g.position.set(b.x, b.y, b.z);
    b.g.visible = true;
    showStatus(owner.isPlayer ? 'Bomb away: 3 s fuse' : owner.name + ' threw a bomb!', owner.isPlayer ? 'boost' : 'warn', 1);
  }
  function explode(x, y, z, radius) {
    emitBurst(x, y + 1, z, 0xffb020, 70, 14);
    emitBurst(x, y + 1, z, 0xff3a10, 40, 9);
    for (let k = 0; k < 30; k++) fxSmoke.emit(x + rnd(-2, 2), y + 0.5, z + rnd(-2, 2), rnd(-6, 6), rnd(2, 7), rnd(-6, 6), rnd(0.8, 1.4), 1.2, rnd(4, 6), 0.3, 0.26, 0.28, 0.5, -1, 1.5);
    const sh = shocks.find(o => o.t >= 1) || shocks[0];
    sh.t = 0; sh.r = radius; sh.ring.position.set(x, y + 0.2, z); sh.ring.visible = true;
    const cdx = camera.position.x - x, cdz = camera.position.z - z;
    if (cdx * cdx + cdz * cdz < 40 * 40) kart.shakeT = Math.max(kart.shakeT, 0.4);
    // everyone inside the blast radius gets hit
    for (const r of racers) {
      if (r.out) continue;
      const p2 = racerPos(r);
      if ((p2.x - x) ** 2 + (p2.z - z) ** 2 < radius * radius && Math.abs(p2.y - y) < 5) {
        if (r.isPlayer) { if (game.mode === 'battle') battleHit(r); else spinOut(); }
        else hitRacer(r);
      }
    }
  }
  function updateBombs(dt) {
    for (const b of bombs) {
      if (!b.live) continue;
      b.fuse -= dt;
      b.lamp.visible = Math.sin((3 - b.fuse) * (6 + (3 - b.fuse) * 8)) > 0;   // blinks faster as it counts down
      b.g.scale.setScalar(1 + (3 - b.fuse) * 0.08);
      if (b.fuse <= 0) { b.live = false; b.g.visible = false; b.g.scale.setScalar(1); explode(b.x, b.y, b.z, BOMB_RADIUS); }
    }
    for (const sh of shocks) {
      if (sh.t >= 1) continue;
      sh.t = Math.min(1, sh.t + dt / 0.45);
      sh.ring.scale.setScalar(sh.r * (0.2 + sh.t));
      sh.ring.material.opacity = 0.85 * (1 - sh.t);
      if (sh.t >= 1) sh.ring.visible = false;
    }
  }
  function clearBombs() { for (const b of bombs) { b.live = false; b.g.visible = false; } }

  // Leader Seeker: races along the spline at 110 m/s straight for whoever is 1st, then dives and explodes
  const leaderMesh = (function () {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8, 0), new THREE.MeshBasicMaterial({ color: 0x1a8cff, toneMapped: false }));
    g.add(body);
    for (let k = 0; k < 8; k++) {
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.7, 8), new THREE.MeshBasicMaterial({ color: 0xf4f7ff, toneMapped: false }));
      const a = (k / 8) * TAU;
      spike.position.set(Math.cos(a) * 0.8, 0.25, Math.sin(a) * 0.8);
      spike.rotation.set(0, -a, -Math.PI / 2);
      g.add(spike);
    }
    for (const sx of [-1, 1]) {
      const wing = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape([new THREE.Vector2(0, 0), new THREE.Vector2(sx * 1.8, 0.5), new THREE.Vector2(sx * 1.4, -0.3)])), wingMat);
      wing.position.set(sx * 0.6, 0.4, 0);
      g.add(wing);
    }
    addOutlines(g, 0.05);
    g.visible = false;
    scene.add(g);
    return { g, body };
  })();
  const leader = { live: false, s: 0, lat: 0, owner: null, t: 0 };
  function fireLeaderSeeker(owner) {
    if (currentMap.arena) { fireArenaShell(owner); return; }
    leader.live = true; leader.owner = owner; leader.t = 0;
    leader.s = owner.prog + 4 / SPACING;
    leader.lat = owner.isPlayer ? kart.lateral : owner.lat;
    leaderMesh.g.visible = true;
    showStatus('Leader Seeker launched!', 'boost', 1.2);
  }
  function updateLeaderSeeker(dt, time) {
    if (!leader.live) return;
    leader.t += dt;
    const target = standings()[0];
    if (!target || target.finished || leader.t > 20) { leader.live = false; leaderMesh.g.visible = false; return; }
    const gap = target.prog - leader.s;
    leader.s += Math.min((110 / SPACING) * dt, Math.max(gap, 0) + (gap < 0 ? 0.5 : 0));
    leader.lat += (racerLateral(target) - leader.lat) * (1 - Math.exp(-4 * dt));
    trackPoint(leader.s, leader.lat, bombTmp);
    const dive = clamp(gap / 25, 0, 1);                   // flies high, dives on the leader at the end
    leaderMesh.g.position.set(bombTmp.x, bombTmp.y + 1 + 6 * dive, bombTmp.z);
    leaderMesh.g.rotation.y += dt * 10;
    fxGlow.emit(bombTmp.x, bombTmp.y + 1 + 6 * dive, bombTmp.z, rnd(-1, 1), rnd(0, 1), rnd(-1, 1), 0.35, 0.9, 0.1, 0.2, 0.55, 1.0, 0.8, 0, 1);
    if (gap < 1.2) {
      const p2 = racerPos(target);
      leader.live = false; leaderMesh.g.visible = false;
      explode(p2.x, p2.y, p2.z, 7);
      showStatus(target.isPlayer ? 'Leader Seeker hit you!' : 'Leader Seeker hit ' + target.name + '!', target.isPlayer ? 'warn' : 'boost', 1.4);
    }
  }

  /* =====================================================================
     SUPER HORN and FAKE ITEM BOX
     ===================================================================== */
  const HORN_RADIUS = 13;
  const hornRing = new THREE.Mesh(new THREE.RingGeometry(0.85, 1, 64).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x9fe0ff, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false, toneMapped: false }));
  const hornRing2 = new THREE.Mesh(hornRing.geometry, hornRing.material.clone());
  hornRing.visible = hornRing2.visible = false;
  scene.add(hornRing, hornRing2);
  const horn = { t: 1, x: 0, y: 0, z: 0 };
  function superHorn(x, y, z) {
    horn.t = 0; horn.x = x; horn.y = y; horn.z = z;
    hornRing.position.set(x, y + 0.6, z); hornRing2.position.set(x, y + 1.4, z);
    hornRing.visible = hornRing2.visible = true;
    kart.shakeT = Math.max(kart.shakeT, 0.2);
    const r2 = HORN_RADIUS * HORN_RADIUS;
    const near = (px, py, pz) => (px - x) ** 2 + (pz - z) ** 2 < r2 && Math.abs(py - y) < 6;
    let n = 0;
    // shatter everything dangerous nearby: bananas, Seekers, arena shells, the Leader Seeker, fakes, drops, bombs
    for (let k = bananas.length - 1; k >= 0; k--) { const b = bananas[k]; if (near(b.x, b.y, b.z)) { emitBurst(b.x, b.y, b.z, 0xffff00, 12, 4); removeBanana(k); n++; } }
    for (let k = seekers.length - 1; k >= 0; k--) { const sk = seekers[k]; if (near(sk.x, sk.y, sk.z)) { emitBurst(sk.x, sk.y, sk.z, 0xff2a3a, 12, 4); removeSeeker(k); n++; } }
    for (let k = arenaShells.length - 1; k >= 0; k--) {
      const sh = arenaShells[k];
      if (near(sh.x, 0.9, sh.z)) { sh.p.live = false; sh.p.mesh.visible = false; arenaShells[k] = arenaShells[arenaShells.length - 1]; arenaShells.pop(); n++; }
    }
    if (leader.live) { const lp = leaderMesh.g.position; if (near(lp.x, lp.y - 3, lp.z)) { leader.live = false; leaderMesh.g.visible = false; emitBurst(lp.x, lp.y, lp.z, 0x1a8cff, 30, 7); n++; } }
    for (const f of fakes) if (f.live && near(f.x, f.y, f.z)) { f.live = false; f.g.visible = false; n++; }
    for (const d of drops) if (d.live && near(d.x, d.y, d.z)) { d.live = false; d.g.visible = false; n++; }
    for (const b of bombs) if (b.live && near(b.x, b.y, b.z)) { b.live = false; b.g.visible = false; n++; }
    showStatus('HONK!' + (n ? ' Cleared ' + n : ''), 'boost', 0.9);
    ticker('📯 You blasted the Super Horn' + (n ? ' and cleared ' + n + ' hazard' + (n > 1 ? 's' : '') : ''));
  }
  function updateHorn(dt) {
    if (horn.t >= 1) return;
    horn.t = Math.min(1, horn.t + dt / 0.35);
    const e = 1 - (1 - horn.t) * (1 - horn.t);
    hornRing.scale.setScalar(HORN_RADIUS * e);
    hornRing2.scale.setScalar(HORN_RADIUS * 0.8 * e);

  // Fake Item Box: an upside-down red wireframe cube left on the road
  const fakeWireMat = new THREE.LineBasicMaterial({ color: 0xff2a3a, toneMapped: false });
  const fakeGlowMat = new THREE.MeshBasicMaterial({ color: 0xff2a3a, transparent: true, opacity: 0.25, depthWrite: false, toneMapped: false });
  const fakes = [];
  for (let k = 0; k < 6; k++) {
    const g = new THREE.Group();
    const cube = new THREE.Group();
    cube.add(new THREE.LineSegments(boxEdges, fakeWireMat), new THREE.Mesh(boxSolid, fakeGlowMat));
    const q = new THREE.Mesh(boxCoreGeo, new THREE.MeshBasicMaterial({ color: 0xffd0d6, toneMapped: false }));
    q.scale.set(1, -1, 1);                               // the "?" hangs upside down

  function dropFakeBox(owner) {
    const f = fakes.find(o => !o.live);
    if (!f) return;
    if (owner.isPlayer) {
      const fx = kart.x - Math.sin(kart.h) * 3.4, fz = kart.z - Math.cos(kart.h) * 3.4;
      const g = queryGround(fx, fz, kart.y + STEP_UP + 1, kart.idx);
      if (!g.onTrack && currentMap.floorY === null) return;
      f.x = fx; f.y = g.y; f.z = fz;
    } else {
      trackPoint(owner.s - 3 / SPACING, owner.lat, bombTmp);
      f.x = bombTmp.x; f.y = bombTmp.y; f.z = bombTmp.z;
    }
    f.live = true; f.owner = owner; f.arm = 0.4;
    f.g.position.set(f.x, f.y, f.z);
    f.g.visible = true;
    ticker(owner.isPlayer ? '❓ You dropped a Fake Item Box' : '❓ ' + owner.name + ' dropped a Fake Item Box');
  }
  function updateFakes(dt, time) {
    for (const f of fakes) {
      if (!f.live) continue;
      f.arm -= dt;
      f.cube.rotation.y = 0.35 + Math.sin(time * 1.3) * 0.2;
      if (state !== 'racing' || f.arm > 0) continue;
      const dx = kart.x - f.x, dz = kart.z - f.z;
      if (dx * dx + dz * dz < 2.3 * 2.3 && Math.abs(kart.y - f.y) < 2 && kart.fallT <= 0) {
        f.live = false; f.g.visible = false;
        emitBurst(f.x, f.y + 1.2, f.z, 0xff2a3a, 20, 6);
        if (game.mode === 'battle') battleHit(playerRacer); else spinOut();   // spin and dead stop
        if (!playerImmune()) ticker('❓ You hit a Fake Item Box!');
        continue;
      }
      for (const ai of activeAis) {
        if (ai.out || ai.invuln > 0 || (ai === f.owner && f.arm > -1)) continue;
        const ax = ai.x - f.x, az = ai.z - f.z;
        if (ax * ax + az * az < 2.3 * 2.3) {
          f.live = false; f.g.visible = false;
          hitRacer(ai);
          ai.speed = 0;
          ticker('❓ ' + ai.name + ' fell for a Fake Item Box');
          break;
        }
      }
    }
  }
  function dropFakeBoxArena(ai) {
    const f = fakes.find(o => !o.live);
    if (!f) return;
    f.x = ai.x - Math.sin(ai.h) * 3.4; f.y = 0; f.z = ai.z - Math.cos(ai.h) * 3.4;
    f.live = true; f.owner = ai; f.arm = 0.4;
    f.g.position.set(f.x, f.y, f.z); f.g.visible = true;
  }
  function clearFakes() { for (const f of fakes) { f.live = false; f.g.visible = false; } }

  /* =====================================================================
     DRAFTING — a ray straight ahead; 1.5 s locked on a rival's tail gives a 1.25× slipstream
     ===================================================================== */
  const draftRay = new THREE.Raycaster();
  draftRay.far = 22;
  const draftOrigin = new THREE.Vector3(), draftDir = new THREE.Vector3();
  const draftProxyGeo = new THREE.BoxGeometry(2.6, 1.6, 3.6);
  const draftProxyMat = new THREE.MeshBasicMaterial({ visible: false });
  const draftTargets = [];
  function addDraftProxy(km) {                           // an invisible box on each rival for the ray to hit
    const box = new THREE.Mesh(draftProxyGeo, draftProxyMat);
    box.position.y = 0.9;
    km.root.add(box);
    draftTargets.push(box);
  }
  for (const ai of ais) addDraftProxy(ai.km);
  const draft = { t: 0, slipT: 0, hitting: false };
  const DRAFT_TIME = 1.5, SLIP_TIME = 2.2, SLIP_MULT = 1.25;
  function updateDraft(dt) {
    if (draft.slipT > 0) draft.slipT = Math.max(0, draft.slipT - dt);
    draft.hitting = false;
    if (state !== 'racing' || kart.airborne || kart.fallT > 0 || kart.spinT > 0 || kart.vf < 15) { draft.t = 0; return; }
    const fx = Math.sin(kart.h), fz = Math.cos(kart.h);
    draftOrigin.set(kart.x + fx * 2.2, kart.y + 0.9, kart.z + fz * 2.2);
    draftDir.set(fx, kart.gradeF || 0, fz).normalize();
    draftRay.set(draftOrigin, draftDir);
    const hits = draftRay.intersectObjects(draftTargets, false);
    if (hits.length && hits[0].object.parent.visible !== false) {
      draft.hitting = true;
      draft.t += dt;
      if (draft.t >= DRAFT_TIME) {
        draft.t = 0;
        draft.slipT = SLIP_TIME;
        showStatus('SLIPSTREAM!', 'boost', 1);
        ticker('💨 You caught a slipstream');
      }
    } else draft.t = Math.max(0, draft.t - dt * 2);
    // neon wind tunnel: streaks that stream past the chassis while drafting or slipstreaming
    if (draft.hitting || draft.slipT > 0) {
      const n = draft.slipT > 0 ? 3 : 1 + (draft.t > 0.75 ? 1 : 0);
      for (let k = 0; k < n; k++) {
        const a = Math.random() * TAU, r = 1.5 + Math.random() * 0.6;
        const ox = Math.cos(a) * r * fz, oz = -Math.cos(a) * r * fx, oy = 0.9 + Math.sin(a) * r;
        fxGlow.emit(kart.x + fx * 4 + ox, kart.y + oy, kart.z + fz * 4 + oz, kart.vx * 0.35, 0, kart.vz * 0.35,
          0.22, 0.14, 0.05, 0.55, 0.95, 1.0, 0.25, 0, 1);
      }
    }
  }

  /* =====================================================================
     RACE TICKER — bottom-left feed of milestones
     ===================================================================== */
  const tickerEl = document.getElementById('ticker');
  const tickerLines = [];
  function ticker(msg) {
    if (state !== 'racing' && state !== 'countdown') return;
    tickerLines.push({ msg, t: 4.5 });
    if (tickerLines.length > 4) tickerLines.shift();
    renderTicker();
  }
  function renderTicker() {
    tickerEl.innerHTML = tickerLines.map(l => '<div style="opacity:' + Math.min(1, l.t).toFixed(2) + '">' + l.msg.replace(/</g, '&lt;') + '</div>').join('');
  }
  let tickerAcc = 0;
  function updateTicker(dt) {
    if (!tickerLines.length) return;
    for (const l of tickerLines) l.t -= dt;
    while (tickerLines.length && tickerLines[0].t <= 0) tickerLines.shift();
    tickerAcc += dt;
    if (tickerAcc > 0.1) { tickerAcc = 0; renderTicker(); }   // fade redraws at 10 Hz, not every frame
  }
  function clearTicker() { tickerLines.length = 0; tickerEl.innerHTML = ''; }
  let lastLeader = null, lastPlayerPlace = 0;

  /* =====================================================================
     CHEAT CONSOLE — type M, K, 2 on any menu screen
     ===================================================================== */
  const cheatEl = document.getElementById('cheat'), cheatIn = document.getElementById('cheatin'), cheatLog = document.getElementById('cheatlog');
  const cheatSeq = [];
  function cheatPrint(msg) {
    const line = document.createElement('div');
    line.textContent = msg;
    cheatLog.appendChild(line);
    while (cheatLog.childNodes && cheatLog.childNodes.length > 7) cheatLog.removeChild(cheatLog.firstChild);
  }
  function openCheats() {
    cheatEl.classList.remove('hidden');
    cheatIn.value = '';
    cheatIn.focus();
    cheatPrint('> READY. ENTER A CODE.');
  }
  function closeCheats() { cheatEl.classList.add('hidden'); cheatIn.blur(); }
  function runCheat(code) {
    const c = code.trim().toUpperCase();
    if (!c) return;
    if (c === 'MOONJUMP') { cheats.moon = !cheats.moon; cheatPrint('> MOONJUMP ' + (cheats.moon ? 'ON: gravity -70%' : 'OFF')); }
    else if (c === 'RICHKID') { addGpc(9999); cheatPrint('> RICHKID: +9,999 GPC (balance ' + gpc() + ')'); }
    else if (c === 'GODMODE') { cheats.god = !cheats.god; cheatPrint('> GODMODE ' + (cheats.god ? 'ON: untouchable' : 'OFF')); }
    else cheatPrint('> UNKNOWN CODE: ' + c);
    hudEl.classList.toggle('cheating', cheats.moon || cheats.god);
    if (state === 'menu') showOverlay('menu');
  }
  cheatIn.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { runCheat(cheatIn.value); cheatIn.value = ''; }
    else if (e.key === 'Escape') closeCheats();
  });
  document.getElementById('cheatclose').addEventListener('click', closeCheats);
  function watchCheatSequence(code) {
    if (state !== 'menu') { cheatSeq.length = 0; return; }
    cheatSeq.push(code);
    if (cheatSeq.length > 3) cheatSeq.shift();
    if (cheatSeq.join() === 'KeyM,KeyK,Digit2') { cheatSeq.length = 0; openCheats(); }
  }

  /* =====================================================================
     LICENCE SWITCHING
     ===================================================================== */
  const peek = (profile, k) => raw.get(pkey(profile, k));
  function licenceStats(profile) {
    const coinsP = Math.max(0, parseInt(peek(profile, 'gpc') || '0', 10) || 0);
    const tracks = CUP_ORDER.filter((id, k) => k === 0 || peek(profile, 'unlocked_' + id) === '1').length;
    const trophies = parseInt(peek(profile, 'gp_trophies') || '0', 10) || 0;
    const used = CUP_ORDER.some(id => peek(profile, 'best_lap_' + id) !== null) || coinsP > 0 || trophies > 0;
    return { coins: coinsP, tracks, trophies, used };
  }
  function switchProfile(id) {
    if (!PROFILES.includes(id) || id === activeProfile) return;
    activeProfile = id;
    raw.set('kl_active_profile', id);
    for (const a of ACHIEVEMENTS) achDone[a.id] = store.get('ach_' + a.id) === '1';
    cosmetic.glow = store.get('cosmetic_glow') || 'default';
    cosmetic.gold = store.get('cosmetic_gold') === '1';
    loadout.slick = owns('slick') && store.get('equip_slick') === '1';
    loadout.rocket = owns('rocket') && store.get('equip_rocket') === '1';
    setPlayerCharacter(owns(playerCharId) ? playerCharId : 'cyber');
    showStatus('Driver ' + id + ' licence loaded', 'boost', 1.4);
  }
  function licenceHTML() {
    return '<div class="licences">' + PROFILES.map(id => {
      const st = licenceStats(id);
      return '<button class="licence' + (id === activeProfile ? ' on' : '') + '" data-profile="' + id + '">' +
        '<span class="lid">DRIVER ' + id + '</span><span class="lsub">' + (st.used ? '💰 ' + st.coins + ' · 🏆 ' + st.trophies + ' · ' + st.tracks + '/' + CUP_ORDER.length + ' tracks' : 'New licence') + '</span>' +
        (id === activeProfile ? '<span class="lact">ACTIVE</span>' : '') + '</button>';
    }).join('') + '</div>';
  }

  /* =====================================================================
     MAP LOADING — rebuilds the spline, meshes, gates, boxes and theme, then resets everyone
     ===================================================================== */
  function applyTheme(look) {
    renderer.setClearColor(look.bg, 1);
    const f = look.fog;
    scene.fog = f.exp2 ? new THREE.FogExp2(f.color, f.density) : new THREE.Fog(f.color, f.near, f.far);
    const u = skyMesh.material.uniforms, k = look.sky;
    u.uBase.value.setHex(k.base); u.uNebA.value.setHex(k.a); u.uNebB.value.setHex(k.b); u.uLow.value.setHex(k.low);
    u.uNebAmt.value = k.amount; u.uDust.value = k.dust; u.uGrid.value = k.grid;
    bakeSky();
    starfield.visible = look.stars;
    lava.visible = look.lava;
    neonFloor.visible = look.groundGrid;
    rainbowTex = roadTexture(look.track);
    roadMat.map = rainbowTex;
    roadMat.needsUpdate = true;
    roadScroll = look.scroll;
  }

  function loadMap(id) {
    if (id !== 'nexus' && MAPS[id]) nexusBase = id;      // the Nexus mirrors whatever you raced last
    currentMapId = MAPS[id] ? id : 'prism';
    currentMap = MAPS[currentMapId];
    TRACK_WIDTH = currentMap.width;
    HALF = TRACK_WIDTH / 2;
    computeTrack(currentMap);
    if (currentMapId === 'nexus') {                      // random hills must never squash an overpass
      nexusHillScale = 1;
      const bad = () => overpassClearance() < 10 || steepestGrade() > 0.28;
      for (let tries = 0; tries < 8 && bad(); tries++) {
        nexusHillScale = Math.max(0, 1 - (tries + 1) * 0.15);   // re-roll with gentler hills each time
        computeTrack(currentMap);
      }
      if (bad()) { nexusHillScale = 0; computeTrack(currentMap); }   // no extra hills: the base layout's own heights
      nexusHillScale = 1;
    }
    if (currentMap.arena) {                              // Battle: no track ribbon, laps, hazards or coins
      disposeGroup(trackGroup);
      trackChunks.length = 0;
      buildArenaMeshes();
      gates.length = 0;
      disposeGroup(hazardGroup); hazards.length = 0;
      disposeGroup(coinGroup); coins.length = 0;
    } else {
      buildTrackMeshes(currentMap);
      buildGates();
      buildHazards(currentMap);
      buildCoins();
      buildStartFinish();
    }
    buildGateDebug();
    buildCrystals(currentMap.look.crystals);
    resetItems();                                    // clears bananas / seekers from the old track
    buildItemBoxes();
    buildCornerSpeeds();
    prerenderMinimap();
    new THREE.Box3().setFromPoints(samples).getCenter(trackCenter);
    applyTheme(currentMap.look);
    rollWeather();                                       // a fresh sky for every load
    clearArenaShells();
    clearDrops();
    leader.live = false; leaderMesh.g.visible = false;
    clearFakes();
    placeOnGrid();
    placeAiOnGrid();
    boardKey = '';
  }

  /* Tall barriers on walled maps: clamp to the road, bounce off, lose a little speed, throw sparks */
  function applyWalls() {
    if (!currentMap.walls || kart.fallT > 0 || kart.ag) return;
    if (kart.airborne && kart.y > samples[kart.idx].y + WALL_H + 0.3) return;   // feathered over the barrier
    const i = kart.idx, lim = (HALF - 1.3) * Math.cos(bank[i]);
    const lat = kart.lateral;
    if (Math.abs(lat) <= lim) return;
    const sgn = Math.sign(lat), push = Math.abs(lat) - lim;
    kart.x -= sides[i].x * push * sgn;
    kart.z -= sides[i].z * push * sgn;
    kart.lateral = sgn * lim;
    const vs = kart.vx * sides[i].x + kart.vz * sides[i].z;
    if (vs * sgn > 0) { kart.vx -= sides[i].x * vs * 1.4; kart.vz -= sides[i].z * vs * 1.4; }
    kart.vx *= 0.985; kart.vz *= 0.985;
    if (Math.abs(kart.vf) > 8 && Math.random() < 0.6) {
      const wx = kart.x + sides[i].x * sgn * 1.2, wz = kart.z + sides[i].z * sgn * 1.2;
      fxGlow.emit(wx, kart.y + 0.5, wz, rnd(-2, 2), rnd(1, 4), rnd(-2, 2), rnd(0.2, 0.4), 0.25, 0.03, 1.0, 0.55, 0.15, 1, 18, 1);
    }
  }

  /* Rising embers and smoke from the lava sea (Magma Keep) */
  let emberAcc = 0;
  function updateEmbers(dt) {
    if (!currentMap.look.embers || dt <= 0) return;
    emberAcc += dt * 55;
    while (emberAcc >= 1) {
      emberAcc -= 1;
      const i = (kart.idx + Math.floor(rnd(-40, 160)) + N) % N, sp = samples[i];
      const off = rnd(HALF + 3, HALF + 45) * (Math.random() < 0.5 ? -1 : 1);
      const x = sp.x + sides[i].x * off, z = sp.z + sides[i].z * off, y = sp.y - rnd(6, 30);
      if (Math.random() < 0.8) {
        fxGlow.emit(x, y, z, rnd(-0.6, 0.6), rnd(4, 9), rnd(-0.6, 0.6), rnd(2, 3.5), rnd(0.35, 0.7), 0.05,
          1.0, rnd(0.2, 0.5), 0.05, 0.9, -0.5, 0.2);
      } else {
        fxSmoke.emit(x, y, z, rnd(-0.4, 0.4), rnd(3, 5), rnd(-0.4, 0.4), rnd(2.5, 4), 2, rnd(6, 9), 0.35, 0.08, 0.06, 0.35, -0.3, 0.3);
      }
    }
  }

  /* =====================================================================
     LOOP
     ===================================================================== */
  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (composer) composer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onResize);

  /* Dynamic resolution: if the average frame time over a second drops below ~50 fps, render at a lower
     pixel ratio (down to 0.75); step back up after a few seconds of solid 58+ fps */
  let perfAcc = 0, perfFrames = 0, perfCool = 0, perfGood = 0, mmTick = false;
  function adaptResolution(rawDt) {
    if (rawDt > 0.25) return;                         // tab switch / breakpoint: ignore
    perfAcc += rawDt; perfFrames++;
    if (perfAcc < 1) return;
    const avg = perfAcc / perfFrames;
    perfAcc = 0; perfFrames = 0;
    if (perfCool > 0) { perfCool--; return; }
    let next = dpr;
    if (avg > 1 / 50 && dpr > 0.75) { next = Math.max(0.75, dpr - 0.25); perfGood = 0; }
    else if (avg < 1 / 58 && dpr < DPR_MAX) { if (++perfGood >= 3) { next = Math.min(DPR_MAX, dpr + 0.25); perfGood = 0; } }
    else perfGood = 0;
    if (next !== dpr) {
      dpr = next;
      renderer.setPixelRatio(dpr);
      if (composer) composer.setPixelRatio(dpr);
      onResize();
      perfCool = 3;
    }
  }

  const clock = new THREE.Clock();
  const MAX_SUBSTEP = 1 / 120;
  let elapsed = 0;

  function frame() {
    requestAnimationFrame(frame);
    const rawDt = clock.getDelta();
    const dt = Math.min(rawDt, 0.1);
    adaptResolution(rawDt);
    elapsed += dt;
    if (state === 'podium') { updatePodium(dt); updateStatus(dt); return; }
    if (podium.pending > 0 && state === 'finished') { podium.pending -= dt; if (podium.pending <= 0) { showPodium(); return; } }

    let inp = NO_INPUT;
    if (state === 'countdown') {
      countdownT += dt;
      const label = countdownT < 3 ? String(3 - Math.floor(countdownT)) : '';
      if (label && label !== lastCount) { lastCount = label; showCount(label, false); }
      if (countdownT >= 3) { state = 'racing'; showCount('Go!', true); }
    } else if (state === 'finished') {
      race.clock += dt;
    } else if (state === 'racing') {
      inp = readInput();
      if (kart.invertT > 0) { kart.invertT = Math.max(0, kart.invertT - dt); input.steer = -input.steer; }   // EMP strike
      if (spaceTapped) useItem();                           // fires on the first frame after Space goes down
      race.time += dt;
      race.clock += dt;
    }
    spaceTapped = false;

    if (state !== 'paused') {
      let px = kart.x, pz = kart.z;
      kart.teleported = false;
      const steps = Math.max(1, Math.ceil(dt / MAX_SUBSTEP));
      const sdt = dt / steps;
      for (let s = 0; s < steps; s++) stepKart(sdt, inp);
      updateTrackState();
      applyWalls();
      if (currentMap.arena) arenaBounds(kart, true);
      updateVertical(dt);
      if (kart.teleported) { px = kart.x; pz = kart.z; }
      else if (state === 'racing') checkGates(px, pz, kart.x, kart.z);
      updatePlayerProgress();
      const aiDrive = state === 'racing' || state === 'finished';
      let leadProg = -Infinity;
      for (let k = 0; k < racers.length; k++) if (racers[k].prog > leadProg) leadProg = racers[k].prog;
      for (const ai of activeAis) {
        ai.isLeader = ai.prog >= leadProg;
        if (game.mode === 'battle') updateBattleAi(ai, dt, elapsed, aiDrive); else updateAi(ai, dt, elapsed, aiDrive);
      }
      if (aiDrive) resolveKartContacts();
      updateWorldItems(dt, elapsed, state === 'racing', px, pz);
      updateDrone(dt, elapsed);
      updateEmbers(dt);
      updateHazards(dt, elapsed);
      updateBombs(dt);
      updateLeaderSeeker(dt, elapsed);
      updateHorn(dt);
      updateFakes(dt, elapsed);
      updateDraft(dt);
      updateTicker(dt);
      if (game.mode !== 'battle') updateDrops(dt, elapsed);
      updateCoins(dt, elapsed);
      updateWeather(dt, elapsed);
      if (game.mode === 'battle') updateBattle(dt, elapsed);
    }

    updateKartVisual(state === 'paused' ? 0 : dt, inp, elapsed);
    updateFx(state === 'paused' ? 0 : dt, inp);

    if (state === 'countdown' || state === 'racing') {
      updateFollowCamera(dt);
    } else {
      if (state === 'finished') controls.target.lerp(kartMesh.root.position, 1 - Math.exp(-4 * dt));
      controls.update();
    }

    // Shadow frustum follows the kart along the fixed sunset direction
    sun.position.set(kart.x + SUN_DIR.x * 160, kart.y + SUN_DIR.y * 160, kart.z + SUN_DIR.z * 160);
    sun.target.position.set(kart.x, kart.y, kart.z);
    fxTime.value = elapsed;
    if (state !== 'paused') {
      rainbowTex.offset.y = (rainbowTex.offset.y + dt * roadScroll) % 1;
      starfield.rotation.y += dt * 0.012;                   // slow galactic spin
      if (currentMap.rails) nexusRailMat.color.setHSL(0.83, 1, 0.3 + 0.25 * (0.5 + 0.5 * Math.sin(elapsed * 4)));   // pulsing border
    }
    updateParticles(state === 'paused' ? 0 : dt);

    updateHUD();
    updateFlash(state === 'paused' ? 0 : dt);
    updateBoard();
    updateStatus(state === 'paused' ? 0 : dt);
    if ((mmTick = !mmTick)) drawMinimap();            // the minimap only needs 30 Hz
    if (composer && useBloom) {
      composer.render(dt);
      // Safety net: if the post-processed frame comes out black on this GPU, fall back to a direct render
      if (bloomCheck > 0 && --bloomCheck === 0 && frameLooksBlack()) {
        useBloom = false;
        showStatus('Glow unsupported here, turned off', 'warn', 2.5);
      }
    } else {
      renderer.render(scene, camera);
    }
  }

  const probePx = new Uint8Array(4);
  function frameLooksBlack() {
    const gl = renderer.getContext(), w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    let sum = 0;
    for (const [fx, fy] of [[0.5, 0.5], [0.25, 0.3], [0.75, 0.3], [0.5, 0.15], [0.5, 0.85]]) {
      gl.readPixels(Math.floor(w * fx), Math.floor(h * fy), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, probePx);
      sum += probePx[0] + probePx[1] + probePx[2];
    }
    return sum < 15;
  }

  /* Boot */
  loadMap('neon');
  applyLoadout();
  applyCosmetics();
  freshCupPoints();
  configureRoster();
  updateKartVisual(0, NO_INPUT, 0);
  setOrbitMode(trackCenter, true);
  setSlot('', '');
  game.page = 'title';
  showOverlay('menu');
  frame();

})();
</script>
</body>
</html>
