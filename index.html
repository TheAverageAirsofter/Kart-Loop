<style>
  :root {
    --sky: #140c2e;

  .ctitle { display: flex; justify-content: space-between; align-items: center; font-weight: 700; letter-spacing: 0.2em; margin-bottom: 8px; }
  #cheatlog { min-height: 120px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }

  .licences { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 12px 0 4px; }

  .cosm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 14px; }

  button.on { background: var(--sun); color: var(--navy); }
  .achs { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .ach { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 10px 12px; border-radius: 12px; background: #0f1630; border: 2px solid #2a3350; opacity: 0.7; }
  .ach.got { opacity: 1; border-color: var(--g); box-shadow: 0 0 14px var(--g); }

  .adesc { color: #d7def0; font-size: 13px; } .areward { color: var(--sun); font-size: 12px; font-weight: 800; }
  .icount { position: absolute; right: 2px; bottom: 16px; font-family: "Titan One", "Arial Black", sans-serif; font-size: 16px; color: var(--sun); -webkit-text-stroke: 3px var(--navy); paint-order: stroke fill; }
  .itemicon { position: relative; }

    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;

    -webkit-text-stroke: 6px var(--navy); paint-order: stroke fill; text-shadow: 6px 6px 0 rgba(22,33,62,0.45);
    visibility: hidden;                               /* no fade: appears and vanishes on the exact frame */
  }
  #fall.show { visibility: visible; animation: fallflash 0.24s steps(1, end) infinite; }
  @keyframes fallflash { 0% { color: #ff1f3d; opacity: 1; } 50% { color: #ff1f3d; opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { #fall.show { animation: none; } }
  #status {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 18px); transform: translateX(-50%) skewX(-10deg);
    pointer-events: none; font-family: "Titan One", "Arial Black", sans-serif; font-size: 22px;
    padding: 6px 18px 8px; border-radius: 10px; border: 3px solid var(--navy);
    background: var(--sun); color: var(--navy); box-shadow: 4px 4px 0 rgba(22,33,62,0.35);

  }
  #status.on { opacity: 1; }

  @media (max-width: 600px) { #status { top: calc(env(safe-area-inset-top, 0px) + 74px); font-size: 17px; } }
  .itembox { grid-column: 2; grid-row: 1; justify-self: end; align-self: start; padding: 6px 12px 6px; }

  #count {

    font-family: "Titan One", "Arial Black", sans-serif; font-size: clamp(72px, 18vw, 180px); color: var(--sun);
    -webkit-text-stroke: 6px var(--navy); paint-order: stroke fill; text-shadow: 6px 6px 0 rgba(22,33,62,0.4);

  }

  .panel {

    padding: 26px 28px 24px; box-shadow: 8px 8px 0 rgba(22,33,62,0.4);

  }
  .panel h1 {
    font-family: "Titan One", "Arial Black", sans-serif; font-weight: 400; margin: 0 0 4px;
    font-size: clamp(40px, 11vw, 60px); line-height: 0.95; color: var(--sun);
    transform: skewX(-8deg); -webkit-text-stroke: 2px var(--navy); paint-order: stroke fill;
  }
  .panel h2 { font-family: "Titan One", "Arial Black", sans-serif; font-weight: 400; margin: 0 0 10px; font-size: 36px; color: var(--sun); }
  .panel p { margin: 6px 0 14px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0 20px; font-size: 15px; }
  .keys kbd {
    font-family: inherit; font-weight: 800; background: var(--paper); color: var(--navy);
    border-radius: 6px; padding: 1px 8px; box-shadow: 0 2px 0 var(--muted); white-space: nowrap; justify-self: start;
  }
  .results { width: 100%; border-collapse: collapse; margin: 6px 0 18px; font-variant-numeric: tabular-nums; }
  .results td { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.14); font-weight: 800; }
  .results td:last-child { text-align: right; }
  .results tr.best td { color: var(--sun); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font-family: "Titan One", "Arial Black", sans-serif; font-size: 20px; cursor: pointer;
    background: var(--kart); color: var(--paper); border: 3px solid var(--navy); border-radius: 12px;
    padding: 10px 22px; box-shadow: 0 4px 0 var(--navy); transition: transform 0.08s, box-shadow 0.08s;
  }
  button.alt { background: var(--paper); color: var(--navy); }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); }
  button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .credit { margin-top: 18px; font-size: 12px; color: var(--muted); }

  @media (max-width: 600px) {
    .lap { font-size: 26px; }
    .speed { font-size: 34px; }
    #minimap { width: 112px; height: 112px; }
    .pos { font-size: 30px; }
    .board { min-width: 0; padding: 6px 10px 8px; }
    .board li { font-size: 12px; line-height: 1.6; }
    .drift { width: 130px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #count.pop { animation-duration: 0.01s; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud">
  <div class="lapbox">
    <div class="badge posbadge"><div class="pos" id="pos">4<small>th</small></div></div>
    <div class="badge"><div class="lap" id="lap">Lap 1<small>/3</small></div></div>
    <div class="badge livesbadge"><div class="lives" id="lives">❤️ × 3</div></div>
    <div class="badge battlebadge"><div class="btrack" id="battletext"></div></div>
    <div class="badge dailybadge"><div class="dtrack" id="dailytrack"></div></div>
    <div class="badge coinbadge"><div class="coins" id="coinwrap"><span class="coin-ico"></span><b id="coins">0</b><small>/10</small></div></div>
    <div class="badge"><div class="times">
      <div><span>Time</span><b id="time">0:00.000</b></div>
      <div><span>Best</span><b id="best">–</b></div>
    </div></div>
  </div>
  <div class="itembox badge empty" id="itemslot" aria-label="No item">
    <div><div class="slots"><div class="itemicon" id="itemicon"></div><div class="itemicon2" id="itemicon2" title="Back item (C to swap)"></div></div><div class="itemkey"><kbd>Space</kbd> use · <kbd>C</kbd> swap</div><div class="itemcount" id="itemcount"></div></div>
  </div>
  <div class="board badge"><ol id="board" aria-label="Race positions"></ol></div>
  <canvas id="minimap" width="320" height="320"></canvas>
  <div id="ticker" aria-live="polite"></div>
  <div class="speedbox badge">
    <div>
      <div class="speed" id="speed">0<small>km/h</small></div>
      <div class="drift"><i id="driftbar"></i></div>
    </div>
  </div>
</div>

<div id="flash" aria-hidden="true"></div>
<div id="cheat" class="hidden" role="dialog" aria-label="Cheat console"><div class="cpanel">
  <div class="ctitle">CHEAT CONSOLE <button class="alt small" id="cheatclose" type="button">×</button></div>
  <div id="cheatlog"></div>
  <input id="cheatin" type="text" autocomplete="off" spellcheck="false" placeholder="TYPE A CODE, PRESS ENTER" maxlength="16">
</div></div>
<div id="fall" role="status" aria-live="polite">FALL!</div>
<div id="status"></div>
<div id="count"></div>
<div id="overlay"><div class="panel" id="panel"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
  'use strict';

  /* =====================================================================
     CONSTANTS
     ===================================================================== */
  let TRACK_WIDTH = 18;                   // full road width (m) — set per map by loadMap()
  let HALF = TRACK_WIDTH / 2;
  const SLAB = 0.45;                      // road thickness: a thin floating ribbon
  const N = 720;                          // spline samples around the lap
  const CHUNK_STEPS = 30;                 // extrude steps per track chunk
  const CHUNKS = N / CHUNK_STEPS;
  const TOTAL_LAPS = 3;
  const START_OFFSET = 10;
  const TEX_METERS = 8;                   // road texture repeat length

  const MAX_SPEED = 46;                   // m/s
  const REVERSE_MAX = 14;
  const ACCEL = 38;                       // punchy launch
  const BRAKE = 85;                       // S stops the kart almost on the spot
  const COAST = 7;
  const OFFROAD_FACTOR = 0.3;             // off the track mesh: top speed drops to 30%
  const OFFROAD_DRAG = 3.4;
  const OFFROAD_ACCEL = 0.55;
  const STEER_RATE = 2.9;                 // rad/s, applied the frame a key goes down
  const GRIP = 13;
  const OFFROAD_GRIP = 5;
  const AIR_GRIP = 0.8;
  const AIR_STEER = 0.6;
  const DRIFT_GRIP = 1.2;
  const DRIFT_TURN = 2.15;
  const DRIFT_VISUAL_YAW = 0.52;
  const DRIFT_MIN_SPEED = 14;
  // Tiered drift: how long you hold Shift while steering decides the turbo you get on release
  const DRIFT_TIERS = [
    { from: 0.0, hex: 0x00ffff, mult: 1.2, time: 0.5, label: 'Mini-turbo',   rate: 60,  speed: 1.0, size: 1.0, css: 't1' },
    { from: 1.0, hex: 0xffaa00, mult: 1.5, time: 1.2, label: 'Super turbo!', rate: 120, speed: 1.6, size: 1.2, css: 't2' },
    { from: 2.2, hex: 0xff00ff, mult: 2.0, time: 2.0, label: 'ROCKET TURBO!', rate: 240, speed: 2.1, size: 1.5, css: 't3' }
  ];
  /* Racer profiles. Max speed is in km/h (as on the HUD); acceleration × 10 = m/s² of launch;
     turn speed is the steering rate in rad/s. Heavier karts drift wider and win bumps. */
  const CHARACTERS = {
    ninja:   { name: 'Neon Ninja',   weight: 'Lightweight', maxKmh: 110, accel: 4.5, turn: 3.5, mass: 0.8,  scale: 0.92, driftGrip: 1.5,
               paint: 0x39ff14, helmet: 0xffffff, suit: 0x0b3d2e, blurb: 'Launches almost instantly and corners like a knife. Lowest top speed.' },
    cyber:   { name: 'Cyber Racer',  weight: 'Medium',      maxKmh: 130, accel: 3.2, turn: 2.8, mass: 1.0,  scale: 1.0,  driftGrip: 1.2,
               paint: 0xffffff, helmet: 0x00e5ff, suit: 0x1d3557, blurb: 'The all-rounder: steady pickup and reliable arcade handling.' },
    goliath: { name: 'Mech-Goliath', weight: 'Heavy',       maxKmh: 155, accel: 1.8, turn: 2.0, mass: 1.45, scale: 1.12, driftGrip: 0.8,
               paint: 0xff6a00, helmet: 0xffffff, suit: 0x3a2a1a, blurb: 'Unmatched top speed and shoves everyone aside, but slow off the line and slides wide.' },
    titan:   { name: 'Magma Titan',  weight: 'Juggernaut',  maxKmh: 165, accel: 1.6, turn: 1.8, mass: 1.75, scale: 1.18, driftGrip: 0.75,
               paint: 0xff2a1a, helmet: 0x1a0a08, suit: 0x2a0a06, glowingChassis: true,
               blurb: 'A heavy juggernaut with a glowing magma chassis. The highest top speed in the game and nothing moves it.' },
    xeno:    { name: 'Xeno Drifter', weight: 'Legendary',   maxKmh: 145, accel: 3.8, turn: 3.2, mass: 0.95, scale: 1.0,  driftGrip: 1.35,
               paint: 0xc9a8ff, helmet: 0x7dff4f, suit: 0x3a1a66, hover: true,
               blurb: 'The secret legend: an anti-gravity hover kart with near-top speed and ninja-grade handling.' }
  };
  // Pit Stop Garage prices (GPC). Characters without a price are owned from the start.
  const SHOP = [
    { id: 'ninja', kind: 'char', price: 100 },
    { id: 'titan', kind: 'char', price: 250 },
    { id: 'xeno', kind: 'char', price: 500, secret: true },
    { id: 'slick', kind: 'part', price: 75, name: 'Slick Tires', desc: 'Drift turbos hit 30% harder. Less grip and pace when you run onto the grid.' },
    { id: 'rocket', kind: 'part', price: 150, name: 'Rocket Exhaust', desc: '15% less acceleration, but every Nitro lasts 1.5 s longer.' }
  ];
  const loadout = { slick: false, rocket: false };        // equipped parts, filled from localStorage at boot
  function statsOf(ch) {
    return {
      maxSpeed: ch.maxKmh / 3.6,                         // m/s
      accel: ch.accel * 10,                              // m/s²
      steer: ch.turn,                                    // rad/s
      driftTurn: ch.turn * 0.74,                         // drifting rotates a little slower than grip steering
      driftGrip: ch.driftGrip,                           // lower = slides wider through a drift
      mass: ch.mass
    };
  }
  let playerCharId = 'cyber';
  const PC = statsOf(CHARACTERS.cyber);                  // the player's live coefficients (updated on selection)

  const DRIFT_MIN_REWARD = 0.35;          // tier 1 needs a real drift: tapping Shift can't farm boosts
  const DRIFT_FULL = 2.2;                 // meter full at tier 3
  const BOOST_MULT = 1.5;                 // Nitro shroom and rivals' boosts

  const GRAVITY = 46;                     // arcade gravity (m/s²)
  const SLOPE_G = 16;                     // how strongly hills slow you / speed you up
  const STEP_UP = 1.6;                    // highest ledge the kart can climb onto
  const FALL_Y = -50;                     // fall below this and the rescue drone comes to fetch you
  const MISS_GRACE = 0.2;                 // the rays must miss the road for 0.2 s AND
  const MISS_FRAMES = 10;                 // more than 10 frames in a row before the rescue starts
  const SUSP_FRONT = 1.9, SUSP_REAR = 1.25;   // ray origins: front bumper and rear axle (metres from centre)
  const SUSP_RATE = 25;                   // how fast the ride height closes on the road (per second)
  const VOID_Y = -10000;                  // "ground" height when the ray finds no track: there is no floor
  const MAX_BANK = 0.6;                   // ~34°
  const BANK_GAIN = 46;

  const SKY = 0x0c0721;                   // rich dark indigo: clear colour and background
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const wrapPi = a => ((((a + Math.PI) % TAU) + TAU) % TAU) - Math.PI;

  /* =====================================================================
     RENDERER / SCENE / CAMERA
     ===================================================================== */
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  const DPR_MAX = Math.min(window.devicePixelRatio || 1, 2);
  let dpr = DPR_MAX;                                  // lowered automatically if the frame rate dips
  renderer.setPixelRatio(dpr);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = false;                 // the road and karts are unlit, so a shadow pass would be pure cost
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.setClearColor(SKY, 1);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.FogExp2(0x0c0721, 0.0015);   // deep-space haze: distant stars soften into the nebula

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 3000);
  camera.position.set(0, 320, 420);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.47;
  controls.minDistance = 12;
  controls.maxDistance = 750;
  controls.autoRotateSpeed = 0.5;

  /* =====================================================================
     LIGHTING — strong ambient fill (the track and karts are unlit and need no light at all), key light for scenery shadows
     ===================================================================== */
  // Moon sits fairly high so karts throw a short, dark shadow right underneath them
  const SUN_DIR = new THREE.Vector3(-0.35, 0.62, -0.7).normalize();
  // Soft white fill so the tops of the karts are always lit, plus a cosmic hemisphere tint
  scene.add(new THREE.AmbientLight(0xffffff, 1.5));              // global visibility fill: nothing lit can go black
  const sun = new THREE.DirectionalLight(0xfff4e6, 0.6);        // starlight: still casts shadows on the lit scenery
  sun.castShadow = false;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 20, far: 400 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  scene.add(sun, sun.target);
  const rimLight = new THREE.DirectionalLight(0x3fd8ff, 0.22);
  rimLight.position.set(0.6, 0.5, 0.7);
  scene.add(rimLight);

  /* Shared clock for every animated shader */
  const fxTime = { value: 0 };

  /* =====================================================================
     SKY — 360° deep-space nebula dome + omnidirectional starfield
     ===================================================================== */
  const SKY_VERT = `
    varying vec3 vDir;
    void main() {
      vDir = position;
      vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      gl_Position = p;             // dome radius sits well inside the far plane
    }`;
  const SKY_FRAG = `
    uniform float uTime;
    uniform vec3 uSunDir;
    uniform vec3 uBase, uNebA, uNebB, uLow;
    uniform float uNebAmt, uDust, uGrid;
    varying vec3 vDir;
    float hash31(vec3 p) { p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float noise3(vec3 p) {
      vec3 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(hash31(i), hash31(i + vec3(1.0, 0.0, 0.0)), f.x), mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
                 mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x), mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);
    }
    float fbm(vec3 p) {
      float v = 0.0, a = 0.5;
      for (int k = 0; k < 5; k++) { v += a * noise3(p); p *= 2.03; a *= 0.5; }
      return v;
    }
    void main() {
      vec3 d = normalize(vDir);
      // No horizon in open space: one deep indigo in every direction, with nebula wisps above AND below
      vec3 col = uBase;                                          // matches the fog colour of the theme
      float n = fbm(d * 2.2 + vec3(0.0, uTime * 0.01, 0.0));
      float n2 = fbm(d * 4.5 + vec3(7.1, 3.3, uTime * 0.015));
      vec3 neb = mix(uNebA, uNebB, n2);
      col += neb * smoothstep(0.5, 0.85, n) * uNebAmt;
      col += mix(uNebA, uNebB, 0.5) * smoothstep(0.35, 0.7, n) * uNebAmt * 0.3;
      col += uLow * smoothstep(0.05, -0.7, d.y) * 0.5;           // volcanic glow from below
      // faint tech lat/long grid (Neon Plains)
      float gx = abs(fract(atan(d.z, d.x) / 6.2831 * 48.0) - 0.5);
      float gy = abs(fract(asin(clamp(d.y, -1.0, 1.0)) / 3.1416 * 24.0) - 0.5);
      col += uNebA * uGrid * (1.0 - smoothstep(0.0, 0.03, 0.5 - max(gx, gy))) * 0.18 * smoothstep(-0.05, 0.3, d.y);
      vec3 sp = d * 420.0;
      float r = hash31(floor(sp));
      col += vec3(1.0) * step(0.994, r) * (1.0 - smoothstep(0.0, 0.2, length(fract(sp) - 0.5))) * uDust;
      gl_FragColor = vec4(col, 1.0);
    }`;
  const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), new THREE.ShaderMaterial({
    uniforms: {
      uTime: fxTime, uSunDir: { value: SUN_DIR },
      uBase: { value: new THREE.Color(0x0c0721) }, uNebA: { value: new THREE.Color(0xd940bf) }, uNebB: { value: new THREE.Color(0x3399ff) },
      uLow: { value: new THREE.Color(0x000000) }, uNebAmt: { value: 0.35 }, uDust: { value: 0.45 }, uGrid: { value: 0 }
    },
    vertexShader: SKY_VERT, fragmentShader: SKY_FRAG,
    side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false
  }));
  skyMesh.frustumCulled = false;
  // The nebula shader (two 5-octave noise fields per pixel) is far too heavy to run full-screen every
  // frame. It is rendered ONCE per map into a cube texture, which then costs one texture lookup.
  const skyScene = new THREE.Scene();
  skyScene.add(skyMesh);
  const skyCubeRT = new THREE.WebGLCubeRenderTarget(1024, { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
  const skyCubeCam = new THREE.CubeCamera(1, 3000, skyCubeRT);
  function bakeSky() {
    skyCubeCam.update(renderer, skyScene);
    scene.background = skyCubeRT.texture;
  }

  /* Starfield: 2,500 stars on a full sphere around the course (above and below); the loop spins it like a galaxy */
  const STAR_COUNT = 2500;
  const starSprite = makeDotTexture();
  function makeDotTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const g = c.getContext('2d');
    for (let r = 16; r > 0; r -= 2) {                       // soft round glow, bright core
      g.fillStyle = 'rgba(255,255,255,' + Math.pow(1 - r / 16, 1.6).toFixed(3) + ')';
      g.beginPath(); g.arc(16, 16, r, 0, Math.PI * 2); g.fill();
    }
    const t = new THREE.CanvasTexture(c);
    t.needsUpdate = true;
    return t;
  }
  const starfield = (function buildStarfield() {
    const pos = new Float32Array(STAR_COUNT * 3), col = new Float32Array(STAR_COUNT * 3);
    const v = new THREE.Vector3(), tint = new THREE.Color();
    for (let i = 0; i < STAR_COUNT; i++) {
      // Uniform direction over the full sphere (cos-latitude uniform in [-1, 1]), so stars fill
      // the sky above AND the void below; distance biased toward the near shell for depth
      const cy = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, rr = Math.sqrt(1 - cy * cy);
      const dist = 450 + Math.pow(Math.random(), 1.5) * 850;
      v.set(Math.cos(th) * rr, cy, Math.sin(th) * rr).multiplyScalar(dist);
      pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;
      const r = Math.random();                                    // mostly white, a few warm and cool stars
      tint.setHex(r < 0.75 ? 0xffffff : r < 0.9 ? 0xfff1b0 : 0xbfd8ff);
      col[i * 3] = tint.r; col[i * 3 + 1] = tint.g; col[i * 3 + 2] = tint.b;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    // size is in world units with attenuation; the fog dims the far shell so it melts into the nebula
    const mat = new THREE.PointsMaterial({
      size: 2.6, sizeAttenuation: true, transparent: true, opacity: 0.8, color: 0xffffff,
      vertexColors: true, map: starSprite, depthWrite: false, fog: true, toneMapped: false
    });
    const pts = new THREE.Points(g, mat);
    pts.frustumCulled = false;
    pts.renderOrder = -5;
    scene.add(pts);
    return pts;
  })();

  /* Procedural environment map (PMREM) so metallic surfaces have something to reflect */
  (function buildEnvironment() {
    try {
      const envScene = new THREE.Scene();
      envScene.add(new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false,
        uniforms: { uSunDir: { value: SUN_DIR } },
        vertexShader: 'varying vec3 vDir; void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: 'uniform vec3 uSunDir; varying vec3 vDir; void main() { vec3 d = normalize(vDir); float h = d.y;' +
          ' vec3 c = mix(vec3(0.35, 0.15, 0.5), vec3(0.12, 0.08, 0.3), smoothstep(-0.1, 0.7, h));' +
          ' float az = atan(d.z, d.x) / 6.2831; vec3 rb = 0.5 + 0.5 * cos(6.2831 * (az * 3.0 + vec3(0.0, 0.33, 0.67)));' +
          ' c = mix(c, rb * 1.3, smoothstep(0.05, -0.35, h));' +
          ' float s = max(dot(d, uSunDir), 0.0); c += vec3(1.0, 0.97, 0.9) * (pow(s, 30.0) * 3.0 + pow(s, 4.0) * 0.3);' +
          ' gl_FragColor = vec4(c, 1.0); }'
      })));
      const panelGeo = new THREE.PlaneGeometry(1, 1);
      const panels = [[0x29f0ff, 18, 6, 10, 2], [0xff3df2, -16, 8, -12, 2], [0x9d6bff, 0, 20, 0, 0.6], [0xff3df2, 12, 4, -18, 1.4], [0x29f0ff, -12, 5, 16, 1.4]];
      for (const [hex, x, y, z, k] of panels) {
        const m = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide }));
        m.position.set(x, y, z);
        m.scale.set(14, 3, 1);
        m.lookAt(0, 0, 0);
        envScene.add(m);
      }
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(envScene, 0.03).texture;

        new THREE.Shape([new THREE.Vector2(HALF, WALL_H), new THREE.Vector2(HALF + t, WALL_H), new THREE.Vector2(HALF + t, -SLAB), new THREE.Vector2(HALF, -SLAB)]),
        new THREE.Shape([new THREE.Vector2(-HALF - t, WALL_H), new THREE.Vector2(-HALF, WALL_H), new THREE.Vector2(-HALF, -SLAB), new THREE.Vector2(-HALF - t, -SLAB)])
      ];
      for (let c = 0; c < CHUNKS; c++) {
        for (const ws of wallShapes) {
          const geo = new THREE.ExtrudeGeometry(ws, { steps: CHUNK_STEPS, bevelEnabled: false, extrudePath: chunkPath(c * CHUNK_STEPS) });
          trackGroup.add(new THREE.Mesh(geo, wallMat));
        }
      }
      for (const side of [-1, 1]) {
        const pts = [];
        for (let i = 0; i < N; i++) pts.push(samples[i].clone().addScaledVector(frameR[i], side * (HALF + t / 2)).addScaledVector(frameU[i], WALL_H + 0.05));
        trackGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), N, 0.22, 6, true), wallGlowMat));
      }
    }
  }

  /* Invisible checkpoint gates (0 = start/finish, then 25/50/75% of the lap) */
  let GATE_HALF = HALF + 10;
  const gates = [];
  function buildGates() {
    GATE_HALF = HALF + 10;
    gates.length = 0;
    for (const f of [0, 0.25, 0.5, 0.75]) {
      const i = Math.round(f * N) % N;
      gates.push({ i, x: samples[i].x, y: samples[i].y, z: samples[i].z, tx: tangents[i].x, tz: tangents[i].z, sx: sides[i].x, sz: sides[i].z });
    }
  }

  const tmpBasis = new THREE.Matrix4();
  function frameQuaternion(i, out) {
    const x = new THREE.Vector3().crossVectors(frameU[i], frameT[i]).normalize();
    tmpBasis.makeBasis(x, frameU[i], frameT[i]);
    return out.setFromRotationMatrix(tmpBasis);
  }

  /* ---------- Start / finish ---------- */
  const checkerTex = makeCanvasTexture(512, 64, (g, w, h) => {
    const cols = 16, rows = 2, sw = w / cols, sh = h / rows;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      g.fillStyle = (x + y) % 2 ? '#15171d' : '#f7f7f7';
      g.fillRect(x * sw, y * sh, sw, sh);
    }
  });
  const bannerTex = makeCanvasTexture(1024, 128, (g, w, h) => {
    g.fillStyle = '#16213e'; g.fillRect(0, 0, w, h);
    const s = 16;
    for (let y = 0; y < h / s; y++) for (let x = 0; x < 6; x++) {
      g.fillStyle = (x + y) % 2 ? '#15171d' : '#f7f7f7';
      g.fillRect(x * s, y * s, s, s);
