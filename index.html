      let oldest = 0;
      for (let k = 1; k < bananas.length; k++) if (bananas[k].born < bananas[oldest].born) oldest = k;
      bn = bananas[oldest];
      removeBanana(oldest);
    }
    bn.live = true;
    bn.x = x; bn.y = g.y; bn.z = z; bn.arm = 0.35; bn.born = ++bananaStamp;
    bn.mesh.position.set(x, g.y + 0.04, z);
    bn.mesh.quaternion.setFromUnitVectors(WORLD_UP, g.normal);
    bn.mesh.quaternion.multiply(qTmp.setFromAxisAngle(WORLD_UP, Math.random() * TAU));
    bn.mesh.visible = true;
    bn.mesh.updateMatrixWorld(true);
    bananas.push(bn);
  }
  function dropBanana() {
    dropBananaAt(kart.x - Math.sin(kart.h) * 3.3, kart.z - Math.cos(kart.h) * 3.3, kart.y + STEP_UP + 1, kart.idx);
  }

  const seekerTmp = { x: 0, y: 0, z: 0 };
  function fireSeeker(owner) {
    let sk = null;
    for (const c of SEEKER_POOL) if (!c.live) { sk = c; break; }
    if (!sk) return;                                    // pool exhausted (can't happen with 4 racers)
    sk.s = owner.prog + 4 / SPACING;
    sk.lat = owner.isPlayer ? clamp(kart.lateral, -(HALF + 8), HALF + 8) : owner.lat;
    trackPoint(sk.s, sk.lat, seekerTmp);
    sk.x = seekerTmp.x; sk.y = seekerTmp.y; sk.z = seekerTmp.z;
    sk.life = SEEKER_LIFE; sk.owner = owner; sk.live = true;
    sk.mesh.position.set(sk.x, sk.y + 0.8, sk.z);
    sk.mesh.visible = true;
    seekers.push(sk);
  }

  // Swap-remove keeps these allocation-free (Array.splice would create a new array every call)
  function removeSeeker(k) {
    const sk = seekers[k];
    sk.live = false; sk.mesh.visible = false; sk.owner = null;
    seekers[k] = seekers[seekers.length - 1];
    seekers.pop();
  }
  function removeBanana(k) {
    const bn = bananas[k];
    bn.live = false; bn.mesh.visible = false;
    bananas[k] = bananas[bananas.length - 1];
    bananas.pop();
  }

  const playerImmune = () => cheats.god || kart.frenzyT > 0;
  function spinOut() {
    if (playerImmune()) return;                          // GODMODE or item Frenzy
    kart.agSpeed = 0;
    kart.spinT = SPIN_TIME;
    kart.spinDir = kart.steerVis >= 0 ? 1 : -1;
    kart.vx = kart.vz = kart.vf = 0;
    if (kart.drifting) endDrift(false);
    kart.boost = 0;
    kart.invuln = SPIN_TIME + 0.6;
    showStatus('Spun out!', 'warn', 1.2);
  }

  const ITEM_TICKS = { banana: '🍌 You dropped a Banana', seeker: '🎯 You fired a Seeker', bomb: '💣 You threw a Blast Bomb', blue: '🔵 Leader Seeker launched!', feather: '🪶 You used a Feather', nitro: '🚀 Nitro!' };
  function fireItem(it) {
    if (kart.frenzyT <= 0 && ITEM_TICKS[it]) ticker(ITEM_TICKS[it]);
    if (it === 'nitro') {
      kart.boost = NITRO_TIME + (loadout.rocket ? 1.5 : 0);   // …but longer Nitros
      kart.boostMax = kart.boost;
      kart.boostMult = BOOST_MULT;
      if (kart.frenzyT <= 0) showStatus('Nitro!', 'boost', 0.8);
    } else if (it === 'seeker') {
      if (game.mode === 'battle') fireArenaShell(playerRacer); else fireSeeker(playerRacer);
    } else if (it === 'banana') {
      dropBanana();
    } else if (it === 'bomb') {
      throwBomb(playerRacer);
    } else if (it === 'horn') {
      superHorn(kart.x, kart.y, kart.z);
    } else if (it === 'fake') {
      dropFakeBox(playerRacer);
    } else if (it === 'blue') {
      fireLeaderSeeker(playerRacer);
    } else if (it === 'feather') {                        // big vertical hop: clear barriers, cut corners
      if (kart.fallT <= 0 && !kart.ag) {
        kart.airborne = true;
        kart.vy = Math.max(kart.vy, kart.roadVy || 0) + 35;
        kart.hopT = 0.22;
        emitBurst(kart.x, kart.y + 0.5, kart.z, 0xf4f7ff, 20, 5);
        showStatus('Feather!', 'boost', 0.8);
      }
    }
  }
  function useItem() {
    if (items.roll > 0 || kart.spinT > 0 || kart.fallT > 0) return;
    if (kart.frenzyT > 0 && items.frenzyKey) {           // Frenzy: fire as fast as you can press
      if (kart.frenzyCool > elapsed) return;
      kart.frenzyCool = elapsed + 0.12;
      race.itemsUsed++;
      fireItem(items.frenzyKey);
      return;
    }
    if (!items.held) return;
    const it = items.held;
    race.itemsUsed++;
    items.count = Math.max(0, (items.count || 1) - 1);
    if (items.count === 0) {                             // the back item moves up to the front
      items.held = items.held2; items.count = items.count2;
      items.held2 = null; items.count2 = 0;
    }
    fireItem(it);
  }
  function swapItems() {
    if (items.roll > 0 || !items.held2) return;
    const h = items.held, c = items.count;
    items.held = items.held2; items.count = items.count2;
    items.held2 = h; items.count2 = c;
    showStatus('Swapped: ' + ITEM_DEFS[items.held].name + ' in front', 'boost', 0.8);
  }

  function resetItems() {
    items.held = null; items.count = 0; items.held2 = null; items.count2 = 0; items.roll = 0; items.frenzyKey = null;
    clearBombs();
    while (seekers.length) removeSeeker(seekers.length - 1);
    while (bananas.length) removeBanana(bananas.length - 1);
    for (const b of itemBoxes) { b.active = true; b.respawn = 0; b.grow = 1; b.group.visible = true; b.group.scale.setScalar(1); }
  }

  const itemSlotEl = document.getElementById('itemslot');
  const itemIconEl = document.getElementById('itemicon');
  const itemCountEl = document.getElementById('itemcount');
  const itemIcon2El = document.getElementById('itemicon2');
  let slotShown = null;
  const iconFor = key => key ? ITEM_DEFS[key].svg : EMPTY_SVG;
  function renderSlots(mode) {
    const n = items.count, n2 = items.count2;
    const frenzy = kart.frenzyT > 0 && items.frenzyKey;
    const reels = mode === 'rolling' ? items.reels.map(r => ITEM_KEYS[r % ITEM_KEYS.length]).join(',') : '';
    const id = mode + '|' + items.held + '|' + n + '|' + items.held2 + '|' + n2 + '|' + reels + '|' + (frenzy ? items.frenzyKey + Math.ceil(kart.frenzyT) : '');
    if (slotShown === id) return;
    slotShown = id;
    if (frenzy) {
      itemIconEl.innerHTML = iconFor(items.frenzyKey) + '<span class="icount">∞</span>';
      itemIconEl.className = 'itemicon frenzy';
      itemCountEl.textContent = 'FRENZY ' + Math.ceil(kart.frenzyT) + 's · spam Space!';
    } else if (mode === 'rolling') {                     // three reels spinning
      itemIconEl.innerHTML = '<span class="reels">' + items.reels.map(r => iconFor(ITEM_KEYS[r % ITEM_KEYS.length])).join('') + '</span>';
      itemIconEl.className = 'itemicon rolling';
      itemCountEl.textContent = '';
    } else {
      itemIconEl.innerHTML = iconFor(items.held) + (n > 1 ? '<span class="icount">×' + n + '</span>' : '');
      itemIconEl.className = 'itemicon ' + (items.held ? 'got' : '');
      itemCountEl.textContent = n > 1 || (items.held === 'nitro' && n === 1 && game.mode === 'tt') ? 'Nitros: ' + n : '';
    }
    itemIcon2El.innerHTML = iconFor(items.held2) + (n2 > 1 ? '<span class="icount">×' + n2 + '</span>' : '');
    itemIcon2El.classList.toggle('filled', !!items.held2);
    itemSlotEl.classList.toggle('empty', !items.held && !frenzy);
    itemSlotEl.setAttribute('aria-label', 'Front item: ' + (items.held ? ITEM_DEFS[items.held].name : 'none') + ', back item: ' + (items.held2 ? ITEM_DEFS[items.held2].name : 'none'));
  }
  function setSlot() { renderSlots('got'); }
  function landRoulette() {
    let key = pickItem(true), count = 1;
    if (key === 'triple') { key = 'nitro'; count = 3; }
    // One-in-sixteen: all three reels line up → 5 s item Frenzy (invulnerable, 1.3× speed, unlimited item)
    if (FRENZY_KEYS.includes(key) && Math.random() < FRENZY_CHANCE) {
      const k = ITEM_KEYS.indexOf(key);
      items.reels = [k, k, k];
      items.frenzyKey = key;
      kart.frenzyT = 5;
      flashScreen(0xffe01a, 0.5);
      showStatus('FRENZY! ' + ITEM_DEFS[key].name + ' ×∞ for 5 s', 'boost', 2);
      return;
    }
    if (count === 3) showStatus('Triple Nitro!', 'boost', 1.0);
    if (items.rollInto === 1 || !items.held) { items.held = key; items.count = count; }
    else { items.held2 = key; items.count2 = count; }
  }
  function updateSlot(dt) {
    if (items.roll > 0) {
      items.roll -= dt;
      items.rollTick -= dt;
      if (items.rollTick <= 0) {
        items.rollTick = ROULETTE_TICK * activeCC().roll;
        items.reels = items.reels.map((r, k) => r + 1 + k);   // each reel spins at its own speed
      }
      if (items.roll <= 0) { items.roll = 0; landRoulette(); renderSlots('got'); }
      else renderSlots('rolling');
    } else {
      if (kart.frenzyT <= 0 && items.frenzyKey) items.frenzyKey = null;
      renderSlots('got');
    }
  }

  const tmpP = { x: 0, y: 0, z: 0 };
  function updateWorldItems(dt, time, racing, px, pz) {
    const hue = (time * 0.18) % 1;
    boxWireMat.color.setHSL(hue, 1, 0.65);
    boxGlowMat.color.setHSL((hue + 0.12) % 1, 1, 0.55);
    for (const b of itemBoxes) {
      if (!b.active) {
        b.respawn -= dt;
        if (b.respawn <= 0) { b.active = true; b.grow = 0; b.group.visible = true; }
        continue;
      }
      if (b.grow < 1) b.grow = Math.min(1, b.grow + dt * 3);
      const g = b.group;
      g.rotation.y += dt * 1.4;
      g.rotation.x += dt * 0.6;
      g.position.y = b.y + 1.7 + Math.sin(time * 2.4 + b.phase) * 0.25;
      g.scale.setScalar(b.grow < 1 ? 1 - Math.pow(1 - b.grow, 3) : 1);
      b.core.rotation.y -= dt * 3;
      if (racing && game.mode !== 'tt' && b.group.visible && kart.spinT <= 0 && kart.fallT <= 0 && Math.abs(kart.y - b.y) < 3 &&
          segDist2(b.x, b.z, px, pz, kart.x, kart.z) < BOX_HIT_R * BOX_HIT_R) {
        b.active = false;
        b.respawn = currentMap.arena ? 7 : BOX_RESPAWN;   // arena boxes come back slower
        g.visible = false;
        spawnBurst(b.x, g.position.y, b.z, boxWireMat.color.getHex(), 1.6);
        shatterBox(b.x, g.position.y, b.z, boxWireMat.color);
        if ((!items.held || !items.held2) && items.roll <= 0 && kart.frenzyT <= 0) {   // room in either slot
          items.roll = ROULETTE_TIME * activeCC().roll;   // 200cc: 15% faster roulette
          items.rollTick = 0;
          items.rollInto = items.held ? 2 : 1;
          items.reels = [0, 1, 2].map(() => Math.floor(Math.random() * ITEM_KEYS.length));
        }
      }
      if (b.active && racing) {
        for (const ai of activeAis) {
          if (Math.abs(ai.y - b.y) < 3 && segDist2(b.x, b.z, ai.px, ai.pz, ai.x, ai.z) < BOX_HIT_R * BOX_HIT_R) {
            b.active = false;
            b.respawn = currentMap.arena ? 7 : BOX_RESPAWN;   // arena boxes come back slower
            g.visible = false;
            spawnBurst(b.x, g.position.y, b.z, boxWireMat.color.getHex(), 1.6);
            shatterBox(b.x, g.position.y, b.z, boxWireMat.color);
            if (game.mode === 'battle' && !ai.item && ai.roll <= 0) ai.roll = ROULETTE_TIME * activeCC().roll;   // racing CPUs use signature powers instead
            break;
          }
        }
      }
    }

    if (racing || state === 'countdown') updateSlot(dt);

    // Seekers ride the track surface, easing onto the racing line
    for (let k = seekers.length - 1; k >= 0; k--) {
      const sk = seekers[k];
      const ox = sk.x, oz = sk.z;
      sk.s += (SEEKER_SPEED / SPACING) * dt;
      // Lock onto the closest racer ahead; home in on their line once within 40 m
      let target = null, best = N;
      for (const r of racers) {
        if (r === sk.owner || r.finished) continue;
        const gap = r.prog - sk.s;
        if (gap > -2 && gap < best) { best = gap; target = r; }
      }
      if (target && best * SPACING < 40) sk.lat += clamp(racerLateral(target) - sk.lat, -16 * dt, 16 * dt);
      else sk.lat *= Math.exp(-3 * dt);
      trackPoint(sk.s, sk.lat, tmpP);
      sk.x = tmpP.x; sk.y = tmpP.y; sk.z = tmpP.z;
      sk.mesh.position.set(sk.x, sk.y + 0.8 + Math.sin(time * 18) * 0.08, sk.z);
      sk.body.rotation.y += dt * 14;
      sk.ring.rotation.z += dt * 9;
      for (let e = 0; e < 2; e++) {
        fxGlow.emit(sk.x + rnd(-0.3, 0.3), sk.y + 0.8 + rnd(-0.3, 0.3), sk.z + rnd(-0.3, 0.3), rnd(-0.6, 0.6), rnd(0, 0.8), rnd(-0.6, 0.6),
          rnd(0.25, 0.4), 0.9, 0.05, 1.0, 0.25, 0.1, 0.8, 0, 1);
      }
      sk.life -= dt;
      let dead = sk.life <= 0;
      for (const r of racers) {
        if (dead || r === sk.owner) continue;
        const rp = racerPos(r);
        if (Math.abs(rp.y - sk.y) < 2.5 && segDist2(rp.x, rp.z, ox, oz, sk.x, sk.z) < 2.3 * 2.3) {
          hitRacer(r);
          dead = true;
        }
      }
      for (let j = bananas.length - 1; j >= 0 && !dead; j--) {
        const bn = bananas[j];
        if (Math.abs(bn.y - sk.y) < 2 && segDist2(bn.x, bn.z, ox, oz, sk.x, sk.z) < 1.8 * 1.8) {
          spawnBurst(bn.x, bn.y + 0.6, bn.z, 0xffd93d, 1.8);
          removeBanana(j);
          dead = true;
        }
      }
      if (dead) {
        spawnBurst(sk.x, sk.y + 0.8, sk.z, 0xff5a1f, 2.2);
        removeSeeker(k);
      }
    }

    // Bananas vs every kart
    const aiDriving = state === 'racing' || state === 'finished';
    for (let j = bananas.length - 1; j >= 0; j--) {
      const bn = bananas[j];
      if (bn.arm > 0) { bn.arm -= dt; continue; }
      let victim = null;
      if (racing && kart.invuln <= 0 && !kart.airborne && Math.abs(kart.y - bn.y) < 1.5 &&
          segDist2(bn.x, bn.z, px, pz, kart.x, kart.z) < BANANA_HIT_R * BANANA_HIT_R) {
        victim = playerRacer;
      } else if (aiDriving) {
        for (const ai of activeAis) {
          if (ai.invuln <= 0 && Math.abs(ai.y - bn.y) < 1.5 &&
              segDist2(bn.x, bn.z, ai.px, ai.pz, ai.x, ai.z) < BANANA_HIT_R * BANANA_HIT_R) { victim = ai; break; }
        }
      }
      if (victim) {
        spawnBurst(bn.x, bn.y + 0.6, bn.z, 0xffd93d, 1.6);
        removeBanana(j);
        hitRacer(victim);
      }
    }

    updateBursts(dt);
  }

  /* =====================================================================
     RIVAL KARTS (CPU) — spline-following racers with banana avoidance
     ===================================================================== */
  const AI_LOD_DIST2 = 170 * 170;          // beyond this from the camera: no rays, no bumping, no exhaust, no beam
  const AI_RAY_OFFSETS = [0, -0.9, 0.9, -1.8, 1.8];
  const AI_DEFS = [
    { name: 'Sunny', livery: KART_LIVERIES.ai[0], skill: 1.1, char: 'ninja' },
    { name: 'Blossom', livery: KART_LIVERIES.ai[1], skill: 1.0, char: 'cyber' },
    { name: 'Frost', livery: KART_LIVERIES.ai[2], skill: 0.86, char: 'goliath' }
  ];
  // Starting grid as [lateral offset, metres behind the line]; the last slot is the player's
  const GRID = [[-3.5, 5], [3.5, 8.5], [-3.5, 12], [3.5, 15.5]];

  // How much to slow for the corners coming up: worst curvature over the next ~50 m
  const cornerSpeed = new Float32Array(N);
  function buildCornerSpeeds() {
    const kappa = new Float32Array(N);
    for (let i = 0; i < N; i++) kappa[i] = Math.abs(wrapPi(heads[(i + 1) % N] - heads[(i - 1 + N) % N])) / (2 * SPACING);
    for (let i = 0; i < N; i++) {
      let k = 0;
      for (let j = 0; j < 24; j++) k = Math.max(k, kappa[(i + j) % N]);
      cornerSpeed[i] = clamp(1 - k * currentMap.cornerK, currentMap.cornerMin, 1);
    }
  }

  const playerRacer = { isPlayer: true, name: 'You', color: KART_LIVERIES.player.paint, prog: 0, finished: false, finishTime: 0 };
  const racers = [playerRacer];
  const ais = AI_DEFS.map(d => {
    const km = buildKart(d.livery);
    addHeadlights(km);
    km.root.scale.setScalar(CHARACTERS[d.char].scale);
    const ai = {
      stats: statsOf(CHARACTERS[d.char]), charKey: d.char, powerT: 0, starT: 0, shrinkT: 0, scaleVis: 1,
      isPlayer: false, name: d.name, color: d.livery.paint, css: '#' + d.livery.paint.toString(16).padStart(6, '0'), near: true,
      km, skill: d.skill, baseSkill: d.skill,
      s: 0, lat: 0, latTarget: 0, latVel: 0, lane: 0, laneT: 0, avoidT: 0,
      speed: 0, boost: 0, spinT: 0, spinDir: 1, invuln: 0,
      item: null, roll: 0, useIn: 0,
      x: 0, y: 0, z: 0, px: 0, pz: 0, h: 0, steerVis: 0, up: new THREE.Vector3(0, 1, 0), boostVis: 0,
      phase: Math.random() * TAU, exhaustAcc: 0, prog: 0, finished: false, finishTime: 0,
      slide: 0, errT: 0, liftT: 0, wobA: 0, wobB: 0, reactT: 0, launchT: 0, isLeader: false, holdT: 0, tripleLeft: 0, tripleT: 0, rampUsed: false, coins: 0
    };
    racers.push(ai);
    return ai;
  });
  const activeAis = ais.slice();                         // emptied in Time Trials

  const racerPos = r => (r.isPlayer ? kart : r);
  const racerLateral = r => (r.isPlayer ? kart.lateral : r.lat);
  const trackIdx = s => Math.floor(((s % N) + N) % N);

  function hitRacer(r) {
    if (game.mode === 'battle') { battleHit(r); return; }
    if (r.isPlayer) {
      if (kart.invuln <= 0 && kart.fallT <= 0) spinOut();
    } else if (r.invuln <= 0) {
      ticker('💫 ' + r.name + ' spun out');
      r.spinT = SPIN_TIME;
      r.spinDir = Math.random() < 0.5 ? -1 : 1;
      r.speed = 0;
      r.boost = 0;
      r.invuln = SPIN_TIME + 0.6;
    }
  }

  const aiTmp = { x: 0, y: 0, z: 0 };
  function poseAi(ai) {
    trackPoint(ai.s, ai.lat, aiTmp);
    ai.x = aiTmp.x; ai.y = aiTmp.y; ai.z = aiTmp.z;
    const i = trackIdx(ai.s);
    ai.h = Math.atan2(tangents[i].x, tangents[i].z) - Math.atan2(ai.latVel, Math.max(ai.speed, 4));
  }

  function placeAiOnGrid() {
    ais.forEach((ai, k) => {
      ai.skill = ai.baseSkill * currentMap.aiPace;            // Easy / Medium / Hard rivals
      ai.s = -GRID[k][1] / SPACING;
      ai.lat = ai.latTarget = ai.lane = GRID[k][0];
      ai.latVel = 0; ai.laneT = 2 + k; ai.avoidT = 0;
      ai.speed = 0; ai.boost = 0; ai.spinT = 0; ai.invuln = 0;
      ai.reactT = rnd(0.15, 0.4);                         // reaction time when the lights go GO
      ai.launchT = 6;                                     // launch phase: acceleration clamped below yours
      ai.item = null; ai.roll = 0; ai.useIn = 0; ai.holdT = 0; ai.tripleLeft = 0; ai.rampUsed = false; ai.coins = 0;
      ai.powerT = rnd(8, 12); ai.starT = 0; ai.shrinkT = 0; ai.bananaT = undefined;
      ai.finished = false; ai.finishTime = 0; ai.prog = ai.s;
      poseAi(ai);
      ai.px = ai.x; ai.pz = ai.z;
      ai.up.copy(frameU[trackIdx(ai.s)]);
    });
  }

  /* Basic raycast avoidance: five parallel rays down the track ahead; if one meets a banana, pick a side and swerve */
  const aiRay = new THREE.Raycaster();
  aiRay.far = 26;
  const aiRayOrigin = new THREE.Vector3(), aiRayHits = [], bananaProxies = [];
  function scanForBananas(ai) {
    bananaProxies.length = 0;
    for (const bn of bananas) bananaProxies.push(bn.proxy);
    const i = trackIdx(ai.s), t = frameT[i], r = frameR[i], u = frameU[i];
    for (const off of AI_RAY_OFFSETS) {
      aiRayOrigin.set(ai.x + r.x * off + u.x * 0.45, ai.y + r.y * off + u.y * 0.45, ai.z + r.z * off + u.z * 0.45);
      aiRay.set(aiRayOrigin, t);
      aiRayHits.length = 0;
      aiRay.intersectObjects(bananaProxies, false, aiRayHits);
      if (!aiRayHits.length) continue;
      const bn = aiRayHits[0].object.userData.banana;
      const bi = nearestIndex(bn.x, bn.z);
      const bl = (bn.x - samples[bi].x) * frameR[bi].x + (bn.y - samples[bi].y) * frameR[bi].y + (bn.z - samples[bi].z) * frameR[bi].z;
      const lim = HALF - 1.3;
      let side = ai.lat >= bl ? 1 : -1;
      let goal = bl + side * 3.4;
      if (Math.abs(goal) > lim) { side = -side; goal = bl + side * 3.4; }
      ai.latTarget = clamp(goal, -lim, lim);
      ai.avoidT = 0.9;
      return;
    }
  }

  /* Distant karts skip ray casting and dodge with a cheap dot-product test instead (same swerve rule) */
  function quickDodge(ai) {
    const i = trackIdx(ai.s), t = frameT[i], r = frameR[i];
    for (let k = 0; k < bananas.length; k++) {
      const bn = bananas[k];
      const dx = bn.x - ai.x, dy = bn.y - ai.y, dz = bn.z - ai.z;
      const ahead = dx * t.x + dy * t.y + dz * t.z;
      if (ahead < 0 || ahead > 26) continue;
      const side = dx * r.x + dy * r.y + dz * r.z;       // banana's offset from this kart, sideways
      if (Math.abs(side) > 2.8) continue;
      const bl = ai.lat + side, lim = HALF - 1.3;
      let dir = side <= 0 ? 1 : -1;
      let goal = bl + dir * 3.4;
      if (Math.abs(goal) > lim) { dir = -dir; goal = bl + dir * 3.4; }
      ai.latTarget = clamp(goal, -lim, lim);
      ai.avoidT = 0.9;
      return;
    }
  }

  function aiUseItem(ai) {
    const it = ai.item;
    ai.item = null;
    if (it === 'nitro') {
      ai.boost = NITRO_TIME;
    } else if (it === 'triple') {                        // chains all three, 1.6 s apart
      ai.boost = NITRO_TIME;
      ai.tripleLeft = 2;
      ai.tripleT = 1.6;
    } else if (it === 'banana') {
      dropBananaAt(ai.x - Math.sin(ai.h) * 3.3, ai.z - Math.cos(ai.h) * 3.3, ai.y + STEP_UP + 1, trackIdx(ai.s));
    } else if (it === 'seeker') {
      fireSeeker(ai);
    }
  }

  function updateAi(ai, dt, time, driving) {
    ai.px = ai.x; ai.pz = ai.z;
    const cdx = ai.x - camera.position.x, cdy = ai.y - camera.position.y, cdz = ai.z - camera.position.z;
    ai.near = cdx * cdx + cdy * cdy + cdz * cdz < AI_LOD_DIST2;
    if (driving) {
      if (ai.invuln > 0) ai.invuln -= dt;
      if (ai.reactT > 0) {                               // still reacting to GO: engine hasn't bitten yet
        ai.reactT = Math.max(0, ai.reactT - dt);
        ai.speed = 0;
      } else if (ai.spinT > 0) {
        ai.spinT = Math.max(0, ai.spinT - dt);
        ai.speed = 0;
      } else {
        const i = trackIdx(ai.s);
        // Rivals race in your class: their pace scales with the top speed of the racer you picked
        const classRatio = PC.maxSpeed / (130 / 3.6);
        const classScale = Math.pow(classRatio, classRatio > 1 ? 1.0 : 0.6);
        // (+8%: rivals no longer carry Nitros from item boxes, their signature powers replace them)
        const cc = activeCC();
        const normalTop = 1.08 * ai.stats.maxSpeed * ai.skill * classScale * cc.aiTop * cc.allTop * (1 + 0.005 * ai.coins) * cornerSpeed[i] *
          (cc.precise ? 1 : 1 + 0.03 * Math.sin(time * 0.7 + ai.phase));
        let target = normalTop;
        // Human mistakes: now and then the driver lifts off the throttle for a moment
        // (twice as often at 50cc; never at 200cc, where the rivals drive with machine precision)
        if (!cc.precise) {
          ai.errT -= dt;
          if (ai.errT <= 0) { ai.errT = cc.wiggle ? rnd(2.5, 5.5) : rnd(5, 11); ai.liftT = rnd(0.4, 0.9); }
          if (ai.liftT > 0) { ai.liftT -= dt; target *= 0.82; }
        }
        // Rubber-banding: the race leader more than 40 m ahead of you gets 60% acceleration and an 80% speed
        // cap; any other rival more than 60 m ahead gets the 80% cap
        const gapM = (ai.s - playerRacer.prog) * SPACING;
        const leaderNerf = ai.isLeader && gapM > 40 && !playerRacer.finished;
        if (leaderNerf || (gapM > 60 && !playerRacer.finished)) target = Math.min(target, normalTop * 0.8);
        else if (gapM < -150) target *= 1.06;                      // modest catch-up when far behind
        if (ai.finished) target *= 0.55;
        if (ai.starT > 0) target *= 1.1;                  // Star Shield: a little faster
        if (ai.shrinkT > 0) target *= 0.4;                // hit by a Toxic Shroom
        if (ai.boost > 0) { ai.boost = Math.max(0, ai.boost - dt); target = Math.max(target, ai.stats.maxSpeed * BOOST_MULT); }
        // Same engine curve as the player — accel × max(0.2, 1 − v / top) × dt. For the first 6 s after GO
        // a rival's acceleration is clamped to 92% of yours (heavy karts 85%) so none can out-launch you;
        // after that it uses its own class acceleration (heavy karts still 5% softer)
        const top = Math.max(1, ai.stats.maxSpeed * ai.skill * classScale);
        if (ai.launchT > 0) ai.launchT -= dt;
        if (ai.speed < target) {
          const heavy = ai.stats.mass > 1.2;
          let a = ai.launchT > 0 ? Math.min(ai.stats.accel, PC.accel) * (heavy ? 0.85 : 0.92) : ai.stats.accel * (heavy ? 0.95 : 1);
          if (leaderNerf) a *= 0.6;
          if (ai.boost > 0) a *= 3;
          ai.speed = Math.min(target, ai.speed + a * Math.max(0.2, 1 - ai.speed / top) * dt);
        } else {
          ai.speed = Math.max(target, ai.speed - BRAKE * 0.6 * dt);
        }
      }
      const sPrev = ai.s;
      ai.s += (ai.speed / SPACING) * dt;
      // Rivals pick up coins too (same +0.5% per coin, max 10) when they run over a coin spot
      if (ai.coins < 10) {
        for (let k = 0; k < COIN_SPOTS.length; k++) {
          const ci = COIN_SPOTS[k][0] * N;
          const a = ((sPrev % N) + N) % N, b = ((ai.s % N) + N) % N;
          const crossed = a <= b ? (ci > a && ci <= b) : (ci > a || ci <= b);
          if (crossed && Math.abs(ai.lat - COIN_SPOTS[k][1] * HALF) < 2.6) { ai.coins++; break; }
        }
      }

      // Racing lanes, overridden while dodging
      ai.laneT -= dt;
      if (ai.laneT <= 0) { ai.laneT = rnd(2.5, 5); ai.lane = rnd(-(HALF - 3), HALF - 3); }
      ai.avoidT -= dt;
      // Imperfect line: a slow two-frequency wobble, plus understeer that carries the kart wide on sharp
      // corners (outward slide grows with curvature × speed², tuned per map)
      const ic = trackIdx(ai.s);
      const curv = wrapPi(heads[(ic + 2) % N] - heads[(ic - 2 + N) % N]) / (4 * SPACING);   // + = turning left
      ai.slide += (clamp(curv * ai.speed * ai.speed * currentMap.aiSlide, -(HALF - 2), HALF - 2) - ai.slide) * (1 - Math.exp(-3 * dt));
      const ccL = activeCC();
      // 50cc: a heavy extra 5 m wiggle · 200cc: no wobble, no understeer — exactly on the line
      const wobble = ccL.precise ? 0 : Math.sin(time * 0.9 + ai.phase) * 1.1 + Math.sin(time * 2.3 + ai.phase * 1.7) * 0.45 +
        ccL.wiggle * Math.sin(time * 0.6 + ai.phase * 2.3);
      const slideNow = ccL.precise ? 0 : ai.slide;
      const lim = HALF - 1.2;
      const wetF = weather === 'rain' ? 1.6 : 1;         // rivals slide wider in the rain too
      if (ai.avoidT <= 0) ai.latTarget = clamp(ai.lane + wobble * wetF + slideNow * wetF, -lim, lim);
      if (bananas.length && ai.spinT <= 0) { if (ai.near) scanForBananas(ai); else quickDodge(ai); }   // far: no rays, plain maths
      if (hazards.length && ai.spinT <= 0 && ai.avoidT <= 0) hazardDodge(ai);
      if (ai.spinT <= 0 && ai.avoidT <= 0) powerDodge(ai);
      const prevLat = ai.lat;
      ai.lat += clamp(ai.latTarget - ai.lat, -7 * dt, 7 * dt);
      ai.latVel = (ai.lat - prevLat) / Math.max(dt, 1e-4);

      if (!ai.finished && ai.s >= TOTAL_LAPS * N) { ai.finished = true; ai.finishTime = race.clock; }
      aiSignaturePower(ai, dt);

      if (ai.roll > 0) {
        ai.roll -= dt;
        if (ai.roll <= 0) { ai.item = pickItem(); ai.useIn = rnd(0.6, 3.2); }
      } else if (ai.item === 'banana' && ai.spinT <= 0 && state === 'racing') {
        // Tactical banana: hold it until you are close behind on its line, then drop it right on the
        // rival's own spline position (gives up waiting after 12 s)
        ai.holdT += dt;
        const behind = (ai.s - playerRacer.prog) * SPACING;
        if ((behind > 3 && behind < 28 && Math.abs(ai.lat - kart.lateral) < 4.5) || ai.holdT > 12) {
          trackPoint(ai.s - 2.5 / SPACING, ai.lat, aiTmp);
          dropBananaAt(aiTmp.x, aiTmp.z, aiTmp.y + STEP_UP + 1, trackIdx(ai.s));
          ai.item = null; ai.holdT = 0;
          poseAi(ai);
        }
      } else if (ai.item && ai.spinT <= 0 && state === 'racing') {
        ai.useIn -= dt;
        if (ai.useIn <= 0) aiUseItem(ai);
      }
      if (ai.tripleLeft > 0) {
        ai.tripleT -= dt;
        if (ai.tripleT <= 0 && ai.boost <= 0) { ai.boost = NITRO_TIME; ai.tripleLeft--; ai.tripleT = 1.6; }
      }
    } else {
      ai.latVel = 0;
    }
    ai.prog = ai.s;
    poseAi(ai);
    updateAiVisual(ai, dt, time, driving);
  }

  const aiFwd = new THREE.Vector3(), aiSide = new THREE.Vector3(), aiBasis = new THREE.Matrix4();
  function updateAiVisual(ai, dt, time, driving) {
    const km = ai.km, i = trackIdx(ai.s);
    km.beam.visible = ai.near;
    ai.up.lerp(frameU[i], 1 - Math.exp(-10 * dt)).normalize();
    aiFwd.set(Math.sin(ai.h), 0, Math.cos(ai.h));
    aiFwd.addScaledVector(ai.up, -aiFwd.dot(ai.up)).normalize();
    aiSide.crossVectors(ai.up, aiFwd).normalize();
    aiBasis.makeBasis(aiSide, ai.up, aiFwd);
    km.root.quaternion.setFromRotationMatrix(aiBasis);
    km.root.position.set(ai.x, ai.y, ai.z);

    const turn = wrapPi(heads[(i + 4) % N] - heads[i]);
    const steerGoal = clamp(turn * 6 - ai.latVel * 0.12, -1, 1);
    ai.steerVis += (steerGoal - ai.steerVis) * (1 - Math.exp(-8 * dt));
    for (const p of km.frontPivots) p.rotation.y = ai.steerVis * 0.42;
    km.steeringWheel.rotation.z = -ai.steerVis * 1.4;
    for (const w of km.wheels) w.rotation.x += (ai.speed * dt) / w.userData.r;
    km.body.rotation.z = -ai.steerVis * 0.05 * clamp(ai.speed / ai.stats.maxSpeed, 0, 1);

    let spinYaw = 0;
    if (ai.spinT > 0) {
      const p = 1 - ai.spinT / SPIN_TIME;
      spinYaw = ai.spinDir * TAU * (1 - (1 - p) * (1 - p));
    }
    km.model.rotation.y = spinYaw;

    ai.boostVis += ((ai.boost > 0 ? 1 : 0) - ai.boostVis) * (1 - Math.exp(-12 * dt));
    km.bodyMat.color.copy(km.baseColor).lerp(KART_BOOST, ai.boostVis);
    if (ai.starT > 0) km.bodyMat.color.setHSL((time * 4) % 1, 1, 0.6);   // rainbow Star Shield flash
    ai.scaleVis += ((ai.shrinkT > 0 ? 0.5 : 1) - ai.scaleVis) * (1 - Math.exp(-10 * dt));
    km.root.scale.setScalar(CHARACTERS[ai.charKey].scale * ai.scaleVis);

    for (const f of km.flames) {
      f.visible = ai.boost > 0;
      if (f.visible) f.scale.set(1, 1, 0.8 + 0.5 * Math.abs(Math.sin(time * 55 + f.userData.phase)));
    }

    // Exhaust: rings on the grid, light fumes while racing (only when close enough to see)
    if (dt > 0 && ai.spinT <= 0 && ai.near) {
      ai.exhaustAcc += dt * (driving ? 14 : 3.5);
      if (ai.exhaustAcc >= 1) {
        km.root.updateMatrixWorld(true);
        fxBack.set(0, 0, -1).transformDirection(km.model.matrixWorld);
        while (ai.exhaustAcc >= 1) {
          ai.exhaustAcc -= 1;
          for (const tip of km.exhaustTips) {
            tip.getWorldPosition(fxP);
            if (driving) {
              const sp = rnd(1.5, 3);
              fxSmoke.emit(fxP.x, fxP.y, fxP.z, fxBack.x * sp + ai.up.x * 0.9, fxBack.y * sp + ai.up.y * 0.9, fxBack.z * sp + ai.up.z * 0.9,
                rnd(0.45, 0.8), 0.18, rnd(1.1, 1.7), 0.74, 0.74, 0.78, 0.18, -1.4, 2.0);
            } else {
              emitSmokeRing(fxP, fxBack, ai.up, rnd(1.1, 1.6));
            }
          }
        }
      }
    }
  }

  /* Kart-to-kart bumping: push overlapping karts apart and bleed off closing speed */
  const KART_RADIUS2 = 2.4;
  function resolveKartContacts() {
    for (let a = 0; a < racers.length; a++) {
      for (let b = a + 1; b < racers.length; b++) {
        const A = racers[a], B = racers[b];
        if ((!A.isPlayer && !A.near) || (!B.isPlayer && !B.near)) continue;   // distant karts skip bumping
        const pa = racerPos(A), pb = racerPos(B);
        if (Math.abs(pa.y - pb.y) > 1.6) continue;
        const dx = pb.x - pa.x, dz = pb.z - pa.z, d2 = dx * dx + dz * dz;
        if (d2 >= KART_RADIUS2 * KART_RADIUS2 || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), nx = dx / d, nz = dz / d, overlap = KART_RADIUS2 - d;
        const mA = A.isPlayer ? PC.mass : A.stats.mass, mB = B.isPlayer ? PC.mass : B.stats.mass;
        const pushA = overlap * mB / (mA + mB), pushB = overlap * mA / (mA + mB);   // the heavier kart moves less
        nudge(A, -nx * pushA, -nz * pushA, nx, nz);
        nudge(B, nx * pushB, nz * pushB, -nx, -nz);
      }
    }
  }
  function nudge(r, px, pz, nx, nz) {
    if (r.isPlayer) {
      kart.x += px; kart.z += pz;
      const vn = kart.vx * nx + kart.vz * nz;           // speed toward the other kart
      if (vn > 0) { kart.vx -= nx * vn * 0.6; kart.vz -= nz * vn * 0.6; }
    } else if (currentMap.arena) {
      r.x += px; r.z += pz;
    } else {
      const i = trackIdx(r.s);
      const lim = HALF - 1.2;
      r.lat = clamp(r.lat + px * sides[i].x + pz * sides[i].z, -lim, lim);
      const along = nx * tangents[i].x + nz * tangents[i].z;
      if (along > 0.5) r.speed *= 0.97;                // bumped the kart in front
      poseAi(r);
    }
  }

  /* Player progress along the spline, in the same units as the AI (samples; 0 = the start line) */
  function updatePlayerProgress() {
    const i = kart.idx;
    const frac = ((kart.x - samples[i].x) * tangents[i].x + (kart.z - samples[i].z) * tangents[i].z) / SPACING;
    playerRacer.prog = race.laps.length * N + (race.gatesPassed === 0 ? i - N : i) + frac;
  }

  const standingsArr = [];
  const byStanding = (a, b) => {
    if (game.mode === 'battle') {                        // arena: survivors first, then most balloons left
      if (!!a.out !== !!b.out) return a.out ? 1 : -1;
      return (b.balloons || 0) - (a.balloons || 0);
    }
    if (a.finished !== b.finished) return a.finished ? -1 : 1;
    if (a.finished) return a.finishTime - b.finishTime;
    return b.prog - a.prog;
  };
  function standings() {                             // re-sorts one shared array: no allocation per frame
    standingsArr.length = 0;
    for (let k = 0; k < racers.length; k++) standingsArr.push(racers[k]);
    return standingsArr.sort(byStanding);
  }
  const ordinal = n => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
  const ordinalHTML = n => { const o = ordinal(n); return o.slice(0, -2) + '<small>' + o.slice(-2) + '</small>'; };
  const hexCss = c => '#' + c.toString(16).padStart(6, '0');

  let boardKey = '';
  const posEl = document.getElementById('pos'), boardEl = document.getElementById('board');
  function updateBoard() {
    const order = standings();
    const place = order.indexOf(playerRacer) + 1;
    if (hudCache.place !== place) { hudCache.place = place; setHTML(posEl, 'pos', ordinalHTML(place)); }
    let key = '';
    for (let k = 0; k < order.length; k++) key += order[k].name + (order[k].finished ? '*|' : '|');
    if (key === boardKey) return;
    boardKey = key;
    if (state === 'racing' && game.mode !== 'battle') {  // milestones for the ticker
      if (lastLeader && order[0] !== lastLeader) ticker('🏁 ' + (order[0].isPlayer ? 'You took' : order[0].name + ' took') + ' 1st place!');
      if (lastPlayerPlace && place !== lastPlayerPlace && !(order[0].isPlayer && lastLeader !== playerRacer)) {
        ticker(place < lastPlayerPlace ? '⬆️ You moved up to ' + ordinal(place) : '⬇️ You dropped to ' + ordinal(place));
      }
      lastLeader = order[0]; lastPlayerPlace = place;
    }
    if (state === 'finished' && !(podium.pending > 0)) showOverlay('finished');   // results fill in live as rivals cross the line
    boardEl.innerHTML = order.map((r, k) =>
      '<li' + (r.isPlayer ? ' class="me"' : '') + '><span class="p">' + ordinal(k + 1) + '</span><i style="background:' + hexCss(r.color) + '"></i>' +
      r.name + (r.finished ? ' <em>✓</em>' : '') + '</li>').join('');
  }

  /* =====================================================================
     CAMERA
     ===================================================================== */
  let camYaw = 0, camBaseY = 0, camFovBase = 75;
  const camDesired = new THREE.Vector3();
  const lookGoal = new THREE.Vector3();
  const lookSmooth = new THREE.Vector3();
  const trackCenter = new THREE.Vector3();          // set by loadMap()

  function lerpAngle(a, b, t) { return a + wrapPi(b - a) * t; }

  function updateFollowCamera(dt) {
    // Height follows the kart through a low-pass filter so crests and dips never jolt the view
    camBaseY += (kart.y - camBaseY) * (1 - Math.exp(-5 * dt));
    const speedRatio = clamp(Math.abs(kart.vf) / PC.maxSpeed, 0, 1.3);
    camYaw = lerpAngle(camYaw, kart.h + kart.driftVis * 0.45, 1 - Math.exp(-12 * dt));
    const dist = 8.6 + speedRatio * 2.4;
    const height = 3.7 + speedRatio * 0.6;
    camUp.lerp(kart.ag ? kart.groundN : WORLD_UP, 1 - Math.exp(-5 * dt)).normalize();   // tilts with the wall
    camera.up.copy(camUp);
    camDesired.set(kart.x - Math.sin(camYaw) * dist, camBaseY, kart.z - Math.cos(camYaw) * dist).addScaledVector(camUp, height);
    camera.position.lerp(camDesired, 1 - Math.exp(-16 * dt));
    if (kart.shakeT > 0) {                               // balloon-pop screen shake
      kart.shakeT = Math.max(0, kart.shakeT - dt);
      const a = kart.shakeT * 1.6;
      camera.position.x += (Math.random() - 0.5) * a; camera.position.y += (Math.random() - 0.5) * a; camera.position.z += (Math.random() - 0.5) * a;
    }

    // Never dip below the road behind the kart
    if (!kart.ag && camUp.y > 0.95) {
      const g = queryGround(camera.position.x, camera.position.z, camera.position.y + 20, kart.idx);
      if (camera.position.y < g.y + 1.4) camera.position.y = g.y + 1.4;
    }

    lookGoal.set(kart.x + Math.sin(kart.h) * 5, camBaseY + kart.gradeF * 4, kart.z + Math.cos(kart.h) * 5).addScaledVector(camUp, 1.4);
    lookSmooth.lerp(lookGoal, 1 - Math.exp(-20 * dt));
    camera.lookAt(lookSmooth);

    // Speed warp: 75° cruising, stretching to 95° during purple drifts, boosts, slipstream and Frenzy
    const hyper = (kart.drifting && driftTier(kart.driftTimer) === 2) || kart.boost > 0 || kart.frenzyT > 0 || draft.slipT > 0;
    const fovGoal = hyper ? 95 : 75 + clamp(speedRatio, 0, 1) * 6;
    camFovBase += (fovGoal - camFovBase) * (1 - Math.exp(-(fovGoal > camFovBase ? 6 : 3) * dt));   // stretch fast, settle slower
    let fov = camFovBase;
    if (kart.fovPulse > 0) {                           // sharp 0.1 s punch: out and back
      kart.fovPulse = Math.max(0, kart.fovPulse - dt);
      fov += kart.fovKick * Math.sin(Math.PI * (1 - kart.fovPulse / 0.1));
    }
    fov = Math.min(fov, 97);                             // the punch never pushes past the warp ceiling
    if (Math.abs(fov - camera.fov) > 0.01) {
      camera.fov = fov;
      camera.updateProjectionMatrix();
    }
  }

  const camUp = new THREE.Vector3(0, 1, 0);
  function setOrbitMode(target, autoRotate) {
    camUp.set(0, 1, 0);
    camera.up.set(0, 1, 0);
    controls.enabled = true;
    controls.autoRotate = autoRotate;
    controls.target.copy(target);
    if (camera.fov !== 60) { camera.fov = 60; camera.updateProjectionMatrix(); }
    controls.update();
  }
  function setRaceMode() {
    controls.enabled = false;
    controls.autoRotate = false;
    lookSmooth.copy(controls.target);
    camYaw = kart.h;
    camBaseY = kart.y;
  }

  /* =====================================================================
     RACE STATE
     ===================================================================== */
  let state = 'menu';
  let countdownT = 0;
  let stateBeforePause = 'racing';
  const race = { time: 0, clock: 0, lapStart: 0, gatesPassed: 0, laps: [], best: Infinity, coins: 0, coinsTotal: 0, t3: 0, falls: 0, itemsUsed: 0 };   // clock keeps running after you finish, for rivals' times

  function placeOnGrid() {
    const gs = N - GRID[3][1] / SPACING;
    const i = Math.round(gs) % N;
    const p = trackPoint(gs, GRID[3][0], { x: 0, y: 0, z: 0 }), t = tangents[i];
    kart.x = p.x; kart.y = p.y; kart.z = p.z;
    kart.h = Math.atan2(t.x, t.z);
    kart.vx = kart.vz = kart.vf = kart.vy = 0;
    kart.airborne = false; kart.onTrack = true; kart.squash = 0;
    kart.groundN.copy(frameU[i]); kart.upVis.copy(frameU[i]);
    kart.drifting = false; kart.driftTimer = 0; kart.boost = 0; kart.hopT = 0;
    kart.boostMult = BOOST_MULT; kart.fovPulse = 0; flashT = 0;
    kart.ag = false; kart.gliding = false; kart.frenzyT = 0; kart.invertT = 0;
    kart.spinT = 0; kart.invuln = 0; kart.boostMax = 1; kart.fallT = 0;
    kart.safeIdx = i; kart.missT = 0; kart.missFrames = 0; kart.tumble = 0;
    kart.roadY = kart.y; kart.roadVy = 0; kart.roadVyRaw = 0;
    resetRescue();
    kart.steerVis = kart.driftVis = 0;
    kart.idx = i;
    kart.lateral = GRID[3][0];
    kart.offroad = false;
    kart.wrongWay = false;
    playerRacer.finished = false;
    playerRacer.finishTime = 0;
    playerRacer.prog = gs - N;
  }

  function startRace() {
    cup.record = false;
    resetCoins();
    clearDrops();
    clearFakes();
    clearTicker();
    draft.t = 0; draft.slipT = 0;
    lastLeader = null; lastPlayerPlace = 0;
    kart.shrinkT = 0;
    race.coinsTotal = 0; race.t3 = 0; race.falls = 0; race.itemsUsed = 0;
    placeOnGrid();
    race.time = 0; race.clock = 0; race.lapStart = 0; race.gatesPassed = 0; race.laps = [];
    statusMsg.t = 0;
    resetItems();
    placeAiOnGrid();
    configureRoster();
    if (game.mode === 'tt') { items.held = 'nitro'; items.count = 3; }   // Time Trials: exactly 3 Nitro shrooms
    boardKey = '';
    countdownT = 0;
    state = 'countdown';
    hideOverlay();
    setRaceMode();

  /* Minimap — track pre-rendered once, coloured by elevation */
  const mm = $('minimap'), mmx = mm.getContext('2d');
  const MM = 320, PAD = 30;
  const bounds = new THREE.Box3();
  let mmScale = 1, mmOx = 0, mmOz = 0;
  const toMM = (x, z) => [mmOx + (x - bounds.min.x) * mmScale, mmOz + (z - bounds.min.z) * mmScale];   // setup only
  let mmX = 0, mmY = 0;
  function mmPt(x, z) { mmX = mmOx + (x - bounds.min.x) * mmScale; mmY = mmOz + (z - bounds.min.z) * mmScale; }
  const mmBase = document.createElement('canvas');
  mmBase.width = mmBase.height = MM;
  function prerenderMinimap() {
    bounds.setFromPoints(samples);
    const bw = bounds.max.x - bounds.min.x, bd = bounds.max.z - bounds.min.z;
    mmScale = (MM - PAD * 2) / Math.max(bw, bd);
    mmOx = PAD + ((MM - PAD * 2) - bw * mmScale) / 2;
    mmOz = PAD + ((MM - PAD * 2) - bd * mmScale) / 2;
    const g = mmBase.getContext('2d');
    g.clearRect(0, 0, MM, MM);
    const path = new Path2D();
    samples.forEach((p, i) => { const [x, y] = toMM(p.x, p.z); i ? path.lineTo(x, y) : path.moveTo(x, y); });
    path.closePath();
    g.lineJoin = 'round'; g.lineCap = 'round';
    g.strokeStyle = '#0c0820'; g.lineWidth = 24; g.stroke(path);
    const yMin = bounds.min.y, ySpan = Math.max(1, bounds.max.y - bounds.min.y);
    g.lineWidth = 12;
    for (let i = 0; i < N; i++) {
      const [x1, y1] = toMM(samples[i].x, samples[i].z), [x2, y2] = toMM(samples[i + 1].x, samples[i + 1].z);
      const t = (samples[i].y - yMin) / ySpan;
      g.strokeStyle = 'hsl(' + (185 + t * 115).toFixed(0) + ',100%,58%)';
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    }
    const [sx, sy] = toMM(samples[0].x, samples[0].z);
    g.fillStyle = '#ffffff'; g.fillRect(sx - 9, sy - 9, 18, 18);
  }

  function drawMinimap() {
    mmx.clearRect(0, 0, MM, MM);
    mmx.drawImage(mmBase, 0, 0);
    mmx.fillStyle = '#ffff00';
    for (let k = 0; k < bananas.length; k++) { mmPt(bananas[k].x, bananas[k].z); mmx.beginPath(); mmx.arc(mmX, mmY, 6, 0, TAU); mmx.fill(); }
    mmx.fillStyle = '#ff3b3b';
    for (let k = 0; k < seekers.length; k++) { mmPt(seekers[k].x, seekers[k].z); mmx.beginPath(); mmx.arc(mmX, mmY, 7, 0, TAU); mmx.fill(); }
    mmx.strokeStyle = '#16213e'; mmx.lineWidth = 3;
    for (let k = 0; k < activeAis.length; k++) {
      const ai = activeAis[k];
      mmPt(ai.x, ai.z);
      mmx.fillStyle = ai.css;
      mmx.beginPath(); mmx.arc(mmX, mmY, 9, 0, TAU); mmx.fill(); mmx.stroke();
    }
    mmPt(kart.x, kart.z);
    mmx.save();
    mmx.translate(mmX, mmY);
    mmx.rotate(-kart.h);
    mmx.fillStyle = '#ffcf33'; mmx.strokeStyle = '#16213e'; mmx.lineWidth = 4;
    mmx.beginPath(); mmx.moveTo(0, 16); mmx.lineTo(11, -11); mmx.lineTo(-11, -11); mmx.closePath();
    mmx.fill(); mmx.stroke();
    mmx.restore();
  }

        return '<button class="map locked" data-info="1" disabled aria-disabled="true" style="--c1:#333;--c2:#000"><span class="mstripe"></span>' +
          '<span class="mname">🔒 ???</span><span class="mmeta"><span class="mtheme">Hidden track</span></span>' +
          '<span class="mdesc">Place 1st or 2nd on ' + MAPS[CUP_ORDER[k - 1]].name + ' in the Grand Prix to reveal the finale.</span><span class="mgo">?</span></button>';
      }
      const extra = (rec !== null ? 'Best lap ' + fmt(rec) : 'No best lap yet') + (gp ? '' : open ? ' · Race ▸' : '');
      return '<button class="map' + (open ? '' : ' locked') + '"' + (gp ? ' data-info="1"' : ' data-map="' + id + '"') + (open ? '' : ' disabled aria-disabled="true"') +
        ' style="--c1:' + m.look.card[0] + ';--c2:' + m.look.card[1] + '"><span class="mstripe"></span>' +
        '<span class="mname">' + (open ? '' : '🔒 ') + (gp ? (k + 1) + '. ' : '') + m.name + '</span>' +
        '<span class="mmeta"><span class="mtheme">' + m.theme + '</span><span class="diff d-' + m.difficulty.toLowerCase() + '">' + m.difficulty + '</span></span>' +
        '<span class="mdesc">' + (open ? m.blurb : 'Locked: place 1st or 2nd on ' + MAPS[CUP_ORDER[k - 1]].name + ' in the Grand Prix.') + '</span>' +
        '<span class="mgo">' + extra + '</span></button>';
    }).join('');
    return '<h2>' + (gp ? 'Neon Cup' : 'Time Trials') + '</h2><p class="sub">' + CHARACTERS[playerCharId].name +
      (gp ? ' · three races, points carry over' : ' · pick an unlocked track') + '</p><div class="maps">' + cards + '</div>' +
      '<div class="row">' + (gp ? '<button data-action="cupstart">Start the cup ▸</button>' : '') + '<button class="alt" data-action="chars">◂ Back</button></div>';
  }
  function showMenu(page) {

  function showTrackSelect() {
    state = 'menu';
    resetRescue();

  }
  function hideOverlay() {
    overlayEl.classList.add('hidden');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  panelEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled || b.dataset.info) return;
    const act = b.dataset.action;
    if (act !== 'reset') game.resetArmed = false;
    if (state === 'podium' && (act === 'modes' || act === 'cupagain')) leavePodium();
    if (b.dataset.profile) { switchProfile(b.dataset.profile); showOverlay('menu'); return; }
    if (b.dataset.cc) { store.set('cc', b.dataset.cc); showStatus('Game speed: ' + CC[b.dataset.cc].label, 'boost', 1); showOverlay('menu'); return; }

    }

      cosmetic.gold = !cosmetic.gold; store.set('cosmetic_gold', cosmetic.gold ? '1' : '0'); applyCosmetics(); showOverlay('menu'); return;
    }
    if (b.dataset.mode) { if (game.mode === 'battle') leaveBattle(); game.mode = b.dataset.mode; showMenu('chars'); }
    else if (b.dataset.char) {
      if (!owns(b.dataset.char)) return;
      setPlayerCharacter(b.dataset.char);
      if (game.mode === 'battle') startBattle(); else showMenu('tracks');
    }
    else if (b.dataset.map) {                            // Time Trials: rebuild the world, then 3, 2, 1, GO!
      if (!isUnlocked(b.dataset.map)) return;
      loadMap(b.dataset.map); configureRoster(); startRace();
    }
    else if (act === 'cupstart' || act === 'cupagain') { freshCupPoints(); startCupAt(0); }
    else if (act === 'next') startCupAt(cup.idx + 1);    // points carry over
    else if (act === 'retry') retryCupRace();
    else if (act === 'gameover') { freshCupPoints(); showMenu('title'); }
    else if (act === 'start') startRace();
    else if (act === 'resume') resume();
    else if (act === 'title') showMenu('title');
    else if (act === 'trophies') showMenu('trophies');
    else if (act === 'garage') showMenu('garage');
    else if (act === 'modes') showMenu('modes');
    else if (act === 'chars') showMenu('chars');

    else if (act === 'reset') {

      else {

        for (const a of ACHIEVEMENTS) { store.del('ach_' + a.id); achDone[a.id] = false; }
        store.del('cosmetic_glow'); store.del('cosmetic_gold'); cosmetic.glow = 'default'; cosmetic.gold = false;
        store.del('gpc');
        for (const it of SHOP) { store.del('owned_' + it.id); store.del('equip_' + it.id); if (it.kind === 'part') loadout[it.id] = false; }
        setPlayerCharacter(owns(playerCharId) ? playerCharId : 'cyber');

      }
      showOverlay('menu');

  });

  /* =====================================================================
     PROGRESS (localStorage), MODES and the GRAND PRIX CUP
     ===================================================================== */
  const CUP_ORDER = ['neon', 'magma', 'prism', 'nexus']; // Neon Plains → Magma Keep → Prism Void → hidden finale Neon Nexus
  const CUP_POINTS = [10, 8, 6, 4];
  /* Driver licences: three save slots in one browser. Every saved key is prefixed with the active
     licence (kl_A_gpc, kl_B_gpc, …), so wallets, unlocks, parts, records and daily claims never mix. */
  const raw = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };
  const cheats = { moon: false, god: false };           // session-only cheat toggles
  const PROFILES = ['A', 'B', 'C'];
  let activeProfile = PROFILES.includes(raw.get('kl_active_profile')) ? raw.get('kl_active_profile') : 'A';
  const pkey = (profile, k) => 'kl_' + profile + '_' + k;
  const store = {                                        // every call is guarded: blocked storage just means no saving
    get(k) { return raw.get(pkey(activeProfile, k)); },
    set(k, v) { raw.set(pkey(activeProfile, k), v); },
    del(k) { raw.del(pkey(activeProfile, k)); }
  };
  (function migrateLegacySave() {                        // saves from before licences existed become Driver A
    try {
      if (raw.get('kl_migrated') === '1') return;
      const legacy = /^(gpc|gp_trophies|unlocked_|best_lap_|ach_|cosmetic_|owned_|equip_|daily_challenge_completed_)/;
      for (let k = 0; k < localStorage.length; k++) {
        const key = localStorage.key(k);
        if (key && legacy.test(key) && raw.get(pkey('A', key)) === null) raw.set(pkey('A', key), raw.get(key));
      }
      raw.set('kl_migrated', '1');
    } catch (e) { /* storage blocked */ }
  })();
  const isUnlocked = id => id === CUP_ORDER[0] || store.get('unlocked_' + id) === '1';
  const unlock = id => store.set('unlocked_' + id, '1');
  const bestLap = id => { const v = parseFloat(store.get('best_lap_' + id)); return isFinite(v) ? v : null; };
  const trophyCount = () => parseInt(store.get('gp_trophies') || '0', 10) || 0;

  const game = { mode: 'gp', page: 'title', resetArmed: false };
  const PODIUM_GPC = [30, 20, 12, 6];
  // Game speed classes. Daily challenges and Time Trials always run at 150cc so everyone faces the same rules.
  const CC = {
    '50':  { label: '50cc (Easy)',    aiTop: 0.75, allTop: 1.0, wiggle: 5, precise: false, bananas: false, roll: 1.0,  gpc: () => 1.0 },
    '150': { label: '150cc (Medium)', aiTop: 1.0,  allTop: 1.0, wiggle: 0, precise: false, bananas: false, roll: 1.0,  gpc: () => 1.5 },
    '200': { label: '200cc (Insane)', aiTop: 1.0,  allTop: 1.3, wiggle: 0, precise: true,  bananas: true,  roll: 0.85, gpc: place => place === 1 ? 3.0 : 1.5 }
  };
  const chosenCC = () => (CC[store.get('cc')] ? store.get('cc') : '150');
  const activeCC = () => (game.mode === 'gp' || game.mode === 'battle') ? CC[chosenCC()] : CC['150'];                    // finishing bonus by place; coins convert 1:1
  const CUP_GPC = [100, 60, 30];                         // extra for a gold / silver / bronze cup
  const gpc = () => Math.max(0, parseInt(store.get('gpc') || '0', 10) || 0);
  const addGpc = n => store.set('gpc', String(gpc() + n));
  const owns = id => { const it = SHOP.find(x => x.id === id); return !it || store.get('owned_' + id) === '1'; };
  loadout.slick = owns('slick') && store.get('equip_slick') === '1';
  loadout.rocket = owns('rocket') && store.get('equip_rocket') === '1';
  function buy(id) {
    const it = SHOP.find(x => x.id === id);
    if (!it || owns(id) || gpc() < it.price) return false;
    store.set('gpc', String(gpc() - it.price));
    store.set('owned_' + id, '1');
    if (it.kind === 'part') { store.set('equip_' + id, '1'); loadout[id] = true; applyLoadout(); }
    showStatus((it.kind === 'char' ? CHARACTERS[id].name : it.name) + ' unlocked!', 'boost', 1.8);
    return true;
  }
  function toggleEquip(id) {
    if (!owns(id)) return;
    loadout[id] = !loadout[id];
    store.set('equip_' + id, loadout[id] ? '1' : '0');
    applyLoadout();
  }
  const cup = { idx: 0, points: {}, lastAward: null, place: 0, advance: false, record: false, unlockedNow: null, done: false, falls: 0 };

  /* =====================================================================
     DAILY CHALLENGE — one challenge per calendar day, the same for every player
     The UTC date (year, month, day) seeds the pick, so everyone on Earth shares the same challenge
     and it rolls over at the same instant. Progress and claims are stored per date.
     ===================================================================== */
  const DAILY_TEMPLATES = [
    { id: 'coins', name: 'Coin Hoarder', map: 'neon', reward: 100,
      desc: 'Collect 15 or more coins on Neon Plains in a single race.',
      progress: () => 'Coins: ' + race.coinsTotal + ' / 15', check: () => race.coinsTotal >= 15 },
    { id: 'drift', name: 'Drift Master', map: 'prism', reward: 150,
      desc: 'Fire three purple tier-3 mini-turbos on Prism Void without falling into the void.',
      progress: () => 'Purple turbos: ' + race.t3 + ' / 3' + (race.falls ? ' · fell!' : ''), check: () => race.t3 >= 3 && race.falls === 0 },
    { id: 'underdog', name: 'Underdog Victory', map: 'magma', char: 'ninja', reward: 120,
      desc: 'Win a race at Magma Keep driving the lightweight Neon Ninja (a loaner kart if you don\'t own it).',
      progress: () => 'Position: ' + ordinal(standings().indexOf(playerRacer) + 1), check: () => cup.place === 1 },
    { id: 'heavy', name: 'Heavyweight Title', map: 'prism', char: 'goliath', reward: 110,
      desc: 'Finish 1st or 2nd on Prism Void driving Mech-Goliath.',
      progress: () => 'Position: ' + ordinal(standings().indexOf(playerRacer) + 1), check: () => cup.place <= 2 },
    { id: 'pure', name: 'Pure Pace', map: 'neon', reward: 90,
      desc: 'Win on Neon Plains without using a single item.',
      progress: () => 'Items used: ' + race.itemsUsed + (race.itemsUsed ? ' · failed' : ' · keep it that way'), check: () => cup.place === 1 && race.itemsUsed === 0 },
    { id: 'sprint', name: 'Lava Sprint', map: 'magma', rivals: false, reward: 130,
      desc: 'Solo run: finish three laps of the Magma Keep figure-8 in under 2:15.000. Clean lines alone won\'t do it: drift and boost.',
      progress: () => 'Target 2:15.000 · now ' + fmt(race.time), check: () => race.laps.reduce((a, b) => a + b, 0) < 135 }
  ];
  function dailyDate(d) {                                // "YYYY-MM-DD" in UTC
    const y = d.getUTCFullYear(), m = d.getUTCMonth() + 1, day = d.getUTCDate();
    return y + '-' + String(m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
  }
  let dailyCache = { key: '', t: null };
  function dailyToday() {
    const now = new Date(), key = dailyDate(now);
    if (dailyCache.key !== key) {
      const seed = now.getUTCFullYear() * 10000 + (now.getUTCMonth() + 1) * 100 + now.getUTCDate();
      const rng = mulberry32(seed);
      rng(); rng();                                      // warm up the generator before picking
      dailyCache = { key, t: DAILY_TEMPLATES[Math.floor(rng() * DAILY_TEMPLATES.length)] };
    }
    return dailyCache.t;
  }
  const dailyKey = () => 'daily_challenge_completed_' + dailyDate(new Date());
  const dailyDone = () => store.get(dailyKey()) === '1';
  const daily = { prevChar: null, success: false, justPaid: false };

  function launchDaily() {
    const t = dailyToday();
    daily.prevChar = playerCharId;
    game.mode = 'daily';
    setPlayerCharacter(t.char || playerCharId);          // the challenge may hand you a loaner kart
    loadMap(t.map);
    const now = new Date();
    rollWeather(mulberry32(now.getUTCFullYear() * 10000 + (now.getUTCMonth() + 1) * 100 + now.getUTCDate() + 7));   // same weather for everyone
    configureRoster();
    startRace();
  }
  function endDailyMode() {                              // back to the menus: return your own kart
    if (game.mode === 'daily' && daily.prevChar && daily.prevChar !== playerCharId) setPlayerCharacter(daily.prevChar);
    daily.prevChar = null;
    game.mode = 'gp';
  }
  function settleDaily() {
    const t = dailyToday();
    daily.success = t.check();
    daily.justPaid = false;
    if (daily.success && !dailyDone()) {                 // credit once per day, instantly
      store.set(dailyKey(), '1');
      addGpc(t.reward);
      daily.justPaid = true;
    }
  }
  function nextResetText() {
    const now = new Date();
    const next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
    const mins = Math.max(0, Math.round((next - now.getTime()) / 60000));
    return Math.floor(mins / 60) + 'h ' + String(mins % 60).padStart(2, '0') + 'm';
  }
  function dailyPanelHTML() {
    const t = dailyToday(), done = dailyDone(), m = MAPS[t.map];
    return '<div class="dailypanel' + (done ? ' done' : '') + '" style="--c1:' + m.look.card[0] + ';--c2:' + m.look.card[1] + '">' +
      '<div class="dhead"><span class="dtag">DAILY CHALLENGE</span><span class="ddate">' + dailyDate(new Date()) + ' · new one in ' + nextResetText() + '</span></div>' +
      '<div class="dname">' + t.name + '</div><div class="ddesc">' + t.desc + '</div>' +
      '<div class="dmeta">' + m.name + (t.char ? ' · ' + CHARACTERS[t.char].name : '') + (t.rivals === false ? ' · solo' : ' · vs 3 rivals') + ' · reward <b>💰 ' + t.reward + ' GPC</b></div>' +
      (done ? '<div class="ddone">COMPLETED! Come back tomorrow!</div>'
            : '<button class="dlaunch" data-action="daily">LAUNCH CHALLENGE ▸</button>') + '</div>';
  }
  function dailyResultsHTML() {
    const t = dailyToday();
    return '<h2>' + (daily.success ? 'Challenge complete!' : 'Challenge failed') + '</h2>' +
      '<p class="sub">' + t.name + ' · ' + MAPS[t.map].name + '</p><p>' + t.desc + '</p>' +
      '<p class="gpc">' + (daily.success ? (daily.justPaid ? '💰 +' + t.reward + ' GPC credited' : 'Already claimed today') : t.progress()) +
      ' <small>· balance ' + gpc() + ' GPC</small></p>' +
      (daily.success ? '<p class="ddone">COMPLETED! Come back tomorrow!</p>' : '') +
      '<table class="results">' + lapRows() + '</table>' +
      '<div class="row">' + (daily.success ? '' : '<button data-action="start">Try again</button>') +
      '<button class="' + (daily.success ? '' : 'alt') + '" data-action="garage">🔧 Spend it in the Garage</button><button class="alt" data-action="title">Main menu</button></div>';
  }

  /* Achievements and the cosmetics they unlock (all saved in localStorage) */
  const ACHIEVEMENTS = [
    { id: 'speed', name: 'Speed Demon', desc: 'Set a Time Trials lap under 30 seconds.', reward: 'Gold tyres + gold underglow', glow: 0xffd23f },
    { id: 'drift', name: 'Clean Drift', desc: 'Hold a purple tier-3 drift for more than 3.5 seconds.', reward: 'Violet underglow', glow: 0xb400ff },
    { id: 'flawless', name: 'Flawless Cup', desc: 'Finish the whole Grand Prix without falling into the void once.', reward: 'White underglow', glow: 0xffffff },
    { id: 'slayer', name: 'AI Slayer', desc: 'Win a Grand Prix race as Mech-Goliath.', reward: 'Crimson underglow', glow: 0xff1a3c }
  ];
  const achDone = {};
  for (const a of ACHIEVEMENTS) achDone[a.id] = store.get('ach_' + a.id) === '1';
  function unlockAch(id) {
    if (achDone[id]) return;
    achDone[id] = true;
    store.set('ach_' + id, '1');
    const a = ACHIEVEMENTS.find(x => x.id === id);
    showStatus('🏆 ' + a.name + ' unlocked!', 'boost', 2.6);
    flashScreen(a.glow, 0.4);
  }
  const cosmetic = { glow: store.get('cosmetic_glow') || 'default', gold: store.get('cosmetic_gold') === '1' };
  function glowHexFor(key) {
    const a = ACHIEVEMENTS.find(x => x.id === key);
    return a && achDone[key] ? a.glow : null;
  }
  function applyCosmetics() {
    const g = glowHexFor(cosmetic.glow);
    kartMesh.underglow.material.color.setHex(g !== null ? g : kartMesh.baseGlow);
    kartMesh.tyreMat.color.setHex(cosmetic.gold && achDone.speed ? 0xd4a017 : kartMesh.baseTyre);
  }

  function configureRoster() {
    // Grand Prix: you + three rivals and item boxes. Time Trials: you alone against the clock.
    racers.length = 0;
    racers.push(playerRacer);
    activeAis.length = 0;
    for (const ai of ais) {
      const on = game.mode === 'gp' || game.mode === 'battle' || (game.mode === 'daily' && dailyToday().rivals !== false);
      ai.km.root.visible = on;
      if (on) { activeAis.push(ai); racers.push(ai); }
    }
    const soloRun = game.mode === 'tt' || (game.mode === 'daily' && dailyToday().rivals === false);
    for (const b of itemBoxes) b.group.visible = !soloRun;
    hudEl.classList.toggle('tt', soloRun);
    hudEl.classList.toggle('daily', game.mode === 'daily');
    hudEl.classList.toggle('battle', game.mode === 'battle');
    hudEl.classList.toggle('gp', game.mode === 'gp');
  }

  function freshCupPoints() {
    cup.points = { You: 0 };
    cup.lives = 3;                                       // playerLives: retro Grand Prix lives
    cup.gameOver = false;
    cup.falls = 0;
    for (const ai of ais) cup.points[ai.name] = 0;
  }
  function startCupAt(idx) {
    cup.idx = idx;
    cup.lastAward = null;
    cup.done = false;
    loadMap(CUP_ORDER[idx]);
    configureRoster();
    startRace();
  }

  /* When you cross the line on the final lap */
  function settleRace() {
    const order = standings();
    cup.place = order.indexOf(playerRacer) + 1;
    cup.unlockedNow = null;
    if (game.mode === 'daily') { settleDaily(); return; }
    if (game.mode !== 'gp') return;
    cup.lastAward = {};
    order.forEach((r, k) => { cup.points[r.name] += CUP_POINTS[k]; cup.lastAward[r.name] = CUP_POINTS[k]; });
    cup.advance = cup.place <= 2;                        // the progression wall: 1st or 2nd to go on
    cup.lifeLost = false;
    if (cup.place >= racers.length) {                    // dead last: lose a life and restart this track
      cup.lives = Math.max(0, cup.lives - 1);
      cup.lifeLost = true;
      cup.gameOver = cup.lives === 0;
    }
    cup.coinsGpc = race.coins; cup.placeGpc = PODIUM_GPC[cup.place - 1] || 0; cup.cupGpc = 0;
    if (cup.place === 1 && playerCharId === 'goliath') unlockAch('slayer');
    const next = CUP_ORDER[cup.idx + 1];

  /* Time Trials: the fastest lap ever on each track, saved as best_lap_<mapId> */

  function buildDrone() {
    const g = new THREE.Group();

  function buildGeyser(i) {
    const s0 = samples[i];

  function buildRamp(i, mat) {

  const GEYSER_CYCLE = 5.5;
  function geyserHeight(t) {                              // idle → burst up → hold → sink
    const c = t % GEYSER_CYCLE;
    if (c < 2.2) return 0;
    if (c < 2.6) return 20 * (1 - Math.pow(1 - (c - 2.2) / 0.4, 2));
    if (c < 3.8) return 20;
    if (c < 4.6) return 20 * (1 - (c - 3.8) / 0.8);
    return 0;
  }

  function starRampBoost() {                              // forced tier-3 rocket for 3 s + a hop off the lip

  function updateHazards(dt, time) {
    const racing = state === 'racing';
    for (const hz of hazards) {

        hz.g.position.set(hz.x, hz.y + Math.sin(time * 3 + hz.phase) * 0.15, hz.z);

        hz.t += dt;

        ventMat.color.setHSL(0.03, 1, c > 1.4 && c < 2.2 ? 0.45 + 0.15 * Math.sin(time * 40) : 0.45);   // flickers just before it blows
        if (hz.h > 1 && Math.random() < 0.7) {

            rnd(0.6, 1.1), rnd(0.5, 0.9), 0.1, 1.0, rnd(0.3, 0.6), 0.05, 0.9, 12, 0.5);

  /* Rivals steer round active hazards with the same swerve rule they use for bananas */
  /* ---- CPU signature powers (racing only; replaces item boxes for the CPUs) ----

  const DROP_MAX = 6;

  function buildDropMesh(type) {
    const g = new THREE.Group();

      stem.position.y = 0.4;

  }
  const dropTmp = { x: 0, y: 0, z: 0 };

    d.x = dropTmp.x; d.y = dropTmp.y; d.z = dropTmp.z;

    d.g.visible = true;
  }
  function aiSignaturePower(ai, dt) {

    if (state !== 'racing' || ai.finished || ai.spinT > 0) return;
    if (activeCC().bananas) {
      ai.bananaT = (ai.bananaT === undefined ? rnd(4, 8) : ai.bananaT) - dt;
      const ahead = (ai.s - playerRacer.prog) * SPACING;

    else if (ai.charKey === 'ninja') { dropPower(ai, 'toxic'); ai.powerT = rnd(8, 12); ticker('🍄 ' + ai.name + ' dropped a Toxic Shroom'); }
    else { ai.starT = 1; ai.invuln = Math.max(ai.invuln, 1); ai.powerT = rnd(10, 14); ticker('⭐ ' + ai.name + ' lit up a Star Shield'); }
  }
  function updateDrops(dt, time) {
    for (const d of drops) {
      if (!d.live) continue;
      d.life -= dt;
      d.g.rotation.y += dt * (d.type === 'lava' ? 3 : 1.2);
      if (d.type === 'lava' && Math.random() < 0.5) {
        fxGlow.emit(d.x + rnd(-0.7, 0.7), d.y + 1.1 + rnd(0, 0.8), d.z + rnd(-0.7, 0.7), rnd(-0.5, 0.5), rnd(1.5, 3.5), rnd(-0.5, 0.5),
          rnd(0.35, 0.6), rnd(0.6, 1.0), 0.1, 1.0, rnd(0.3, 0.6), 0.05, 0.9, -1, 0.5);
      }
      if (d.life <= 0) { d.live = false; d.g.visible = false; continue; }
      if (state !== 'racing') continue;
      const dx = kart.x - d.x, dz = kart.z - d.z;
      if (dx * dx + dz * dz < 2.3 * 2.3 && Math.abs(kart.y - d.y) < 2 && kart.fallT <= 0 && !kart.airborne) {
